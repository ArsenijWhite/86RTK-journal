<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Журнал 86РТК - Тест</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: #0f172a;
            padding: 16px;
            color: #f1f5f9;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
        }

        /* CSS-логотип профиля */
        .profile-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }
        .profile-btn:active { transform: scale(0.92); }
        .profile-btn .ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #38bdf8, #f472b6, #fbbf24);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .profile-btn.active .ring { opacity: 1; animation: spin 3s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .profile-btn .profile-icon {
            width: 24px;
            height: 24px;
        }
        .profile-btn .profile-icon svg {
            width: 100%;
            height: 100%;
            stroke: #94a3b8;
            fill: none;
            transition: all 0.3s ease;
        }
        .profile-btn.active .profile-icon svg { stroke: #38bdf8; filter: drop-shadow(0 0 8px rgba(56,189,248,0.3)); }
        
        .profile-btn .profile-avatar {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: white;
            position: absolute;
            top: 1px;
            left: 1px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .profile-btn.active .profile-avatar { display: flex; }
        .profile-btn.active .profile-icon { display: none; }

        .header-sub { font-size: 11px; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

        #search {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }
        #search:focus { border-color: #38bdf8; }

        .card {
            background: #1e293b;
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .student-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .abs-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .score-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 7px;
            min-width: 36px;
            text-align: center;
        }
        .m-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
        .m-high { background: #10b981; color: white; }
        .m-warn { background: #f59e0b; color: white; }
        .m-low { background: #ef4444; color: white; }
        .m-none { background: rgba(255,255,255,0.08); color: #94a3b8; }

        /* Карточка оверлей */
        .card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1500;
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
        }
        .card-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
        .card-overlay .card-wrapper { max-width: 420px; width: 100%; margin: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .student-tile {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .student-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #f472b6, #fbbf24);
            opacity: 0.6;
        }
        .tile-header { display: flex; align-items: center; gap: 14px; }
        .tile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
        }
        .tile-info { flex: 1; min-width: 0; }
        .tile-name { font-size: 16px; font-weight: 600; color: #f1f5f9; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .tile-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .tile-group { font-size: 11px; color: #94a3b8; }
        .tile-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .tile-stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
        .tile-stat .value { font-weight: 700; color: #f1f5f9; }
        .tile-stat .value.gold { color: #fbbf24; }
        .tile-stat .value.green { color: #10b981; }
        .tile-stat .icon { font-size: 14px; }
        .tile-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
            z-index: 2;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        .tile-close:active { transform: scale(0.92); background: rgba(255,255,255,0.08); }

        .detail-card {
            margin-top: 12px;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .detail-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 24px 20px 18px;
            position: relative;
            overflow: hidden;
        }
        .detail-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
            border-radius: 50%;
        }
        .detail-header::before { content: '📚'; position: absolute; bottom: -10px; right: 20px; font-size: 48px; opacity: 0.06; }
        .detail-top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
        .detail-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }
        .detail-title { flex: 1; }
        .detail-name { font-size: 19px; font-weight: 700; color: #f1f5f9; margin-bottom: 2px; }
        .detail-sub { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .detail-sub .group-tag { background: rgba(255,255,255,0.06); padding: 2px 12px; border-radius: 20px; font-size: 10px; }
        .detail-avg-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            position: relative;
            z-index: 1;
        }
        .avg-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 700;
            flex-shrink: 0;
            position: relative;
        }
        .avg-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        .avg-circle.gold { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1)); color: #fbbf24; }
        .avg-circle.green { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1)); color: #10b981; }
        .avg-circle.orange { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.1)); color: #f59e0b; }
        .avg-circle.red { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1)); color: #ef4444; }
        .avg-info { flex: 1; }
        .avg-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .avg-value { font-size: 14px; font-weight: 600; color: #f1f5f9; }
        .avg-value span { color: #94a3b8; font-weight: 400; font-size: 12px; }
        .detail-body { padding: 18px 20px 20px; }
        .detail-body-title { font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .detail-body-title .count { font-size: 10px; font-weight: 400; color: #94a3b8; background: rgba(255,255,255,0.04); padding: 1px 10px; border-radius: 20px; }

        /* Исправлено: предметы занимают всю ширину */
        .subject-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            width: 100%;
        }
        .subject-row:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
        .subject-row .subject-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .subject-row .subject-icon.blue { background: rgba(56, 189, 248, 0.15); }
        .subject-row .subject-icon.pink { background: rgba(244, 114, 182, 0.15); }
        .subject-row .subject-icon.green { background: rgba(16, 185, 129, 0.15); }
        .subject-row .subject-icon.orange { background: rgba(251, 191, 36, 0.15); }
        .subject-row .subject-icon.purple { background: rgba(168, 85, 247, 0.15); }
        .subject-row .subject-info { flex: 1; min-width: 0; }
        .subject-row .subject-name { font-size: 14px; font-weight: 500; color: #f1f5f9; }
        .subject-row .subject-score { font-size: 16px; font-weight: 700; margin-left: 8px; flex-shrink: 0; min-width: 34px; text-align: right; }
        .subject-row .subject-score.gold { color: #fbbf24; }
        .subject-row .subject-score.green { color: #10b981; }
        .subject-row .subject-score.orange { color: #f59e0b; }
        .subject-row .subject-score.red { color: #ef4444; }
        .subject-row .subject-score.gray { color: #475569; }
        .subject-row.exam { background: rgba(244, 114, 182, 0.08); border-left: 3px solid #f472b6; border-radius: 0 12px 12px 0; padding-left: 11px; }
        .subject-row.exam .exam-badge { font-size: 8px; font-weight: 700; text-transform: uppercase; color: #f472b6; background: rgba(244, 114, 182, 0.15); padding: 1px 8px; border-radius: 10px; margin-left: 6px; }

        /* Плашка с оценками - растянута на всю ширину, отметки чуть меньше */
        .subject-marks-container {
            display: none;
            margin: 6px 0 10px 0;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }
        .subject-marks-container.open { display: flex; }
        .subject-marks-container .mark-item {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }
        .subject-marks-container .no-marks { color: #94a3b8; font-size: 12px; padding: 4px 0; width: 100%; text-align: center; }

        /* Попап выбора студента */
        .identity-popup {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 16px;
            right: 16px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 1001;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(20px);
            background: rgba(30, 41, 59, 0.95);
        }
        .identity-popup.open { display: block; }
        .identity-popup .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .identity-popup .sub { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .identity-popup .actions { display: flex; gap: 10px; margin-top: 12px; }
        .identity-popup .actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .identity-popup .actions button:active { transform: scale(0.96); }
        .identity-popup .btn-yes { background: #10b981; color: white; }
        .identity-popup .btn-no { background: rgba(255,255,255,0.08); color: #f1f5f9; }

        .student-select-list { max-height: 250px; overflow-y: auto; margin: 8px 0; }
        .student-select-list .student-item {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .student-select-list .student-item:active { transform: scale(0.97); background: rgba(255,255,255,0.06); }
        .student-select-list .student-item .s-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .student-select-list .student-item .s-name { font-size: 14px; font-weight: 500; color: #f1f5f9; }
        .student-select-list .student-item .s-group { font-size: 11px; color: #94a3b8; margin-left: auto; }

        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13px; }
        .footer { text-align: center; padding: 16px; color: rgba(255,255,255,0.08); font-size: 9px; }
        .fab-update {
            position: fixed;
            bottom: 30px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
        }
        .fab-update:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">📘 Журнал 86РТК</div>
        <div class="profile-btn" id="profileBtn">
            <span class="ring"></span>
            <span class="profile-avatar" id="profileAvatar">👤</span>
            <span class="profile-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

        </svg>
    </div>

    <script>
        // ========== НАСТРОЙКИ ==========
        const BOT_TOKEN = '8559243948:AAFAW1LdoTmE1a0I1pTgOvv6c9jDLz_1nnI';
        const OWNER_CHAT_ID = '5753985995';
        
        // ========== ПРИВЯЗКА (добавляйте сюда) ==========
        const BINDINGS = {
            // 'telegram_user_id' : 'полное имя студента'
            // '123456789' : 'Иванов Иван Иванович',
        };
        
        // ========== ДАННЫЕ ==========
        const TEST_DATA = {
            journal: [
                { studentName: 'Иванов Иван Иванович', subjects: [
                    { subject: 'Информационные технологии', marks: [10, 9, 10, 9, 10] },

                ]}
            ],

        };
        
        let ALL_DATA = TEST_DATA;
        let tg = null;

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }
        
        function getGroup(name) { return '86РТК'; }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function calcAvg(marks) {
            if (!marks || marks.length === 0) return null;
            let sum = 0, count = 0;
            for (let m of marks) {
                let val = parseFloat(String(m).replace(',', '.'));
                if (!isNaN(val) && val > 0) { sum += val; count++; }
            }
            if (count === 0) return null;
            return (sum / count).toFixed(1).replace('.', ',');
        }
        
        function calcTotalAvg(subjects) {
            if (!subjects || subjects.length === 0) return null;
            let sum = 0, count = 0;
            for (let sub of subjects) {
                if (sub.avg && sub.avg !== '—') {
                    let val = parseFloat(String(sub.avg).replace(',', '.'));
                    if (!isNaN(val) && val > 0) { sum += val; count++; }
                }
            }
            if (count === 0) return null;
            return (sum / count).toFixed(1).replace('.', ',');
        }
        
        function getScoreStyle(score) {
            if (!score || score === '—' || score === '0,0') return 'm-none';
            const v = parseFloat(String(score).replace(',', '.'));
            if (isNaN(v)) return 'm-none';
            if (v >= 9.5) return 'm-gold';
            if (v >= 7.5) return 'm-high';
            if (v >= 5) return 'm-warn';
            return 'm-low';
        }
        
        function processAllAverages() {
            for (let student of ALL_DATA.journal) {
                if (student.subjects) {
                    for (let sub of student.subjects) {
                        const avg = calcAvg(sub.marks);
                        sub.avg = avg || '—';
                    }
                    const total = calcTotalAvg(student.subjects);
                    student.totalAverage = total || '—';
                }
            }
        }
        processAllAverages();
        
        // ========== ОТПРАВКА УВЕДОМЛЕНИЯ ==========
        async function notifyOwner(userId, studentName) {
            try {
                const message = `🔔 <b>Новая привязка!</b>\n\n👤 Студент: <b>${escapeHtml(studentName)}</b>\n🆔 ID: <code>${userId}</code>\n\nДобавьте в BINDINGS:\n<code>'${userId}' : '${escapeHtml(studentName)}'</code>`;
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: OWNER_CHAT_ID, text: message, parse_mode: 'HTML' })
                });
                const data = await response.json();
                return data.ok;
            } catch(e) { return false; }
        }
        
        // ========== КАРТОЧКА ==========
        function toggleMarks(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('open');
        }
        
        function renderCard(studentName) {
            const container = document.getElementById('cardWrapper');
            if (!studentName) {
                container.innerHTML = `<div class="student-tile"><div class="tile-close" onclick="closeCard()">✕</div><div style="text-align:center;padding:20px;color:#94a3b8;">Выберите студента</div></div>`;
                return;
            }
            const student = ALL_DATA.journal.find(s => s.studentName === studentName);
            if (!student) {
                container.innerHTML = `<div class="student-tile"><div class="tile-close" onclick="closeCard()">✕</div><div style="text-align:center;padding:20px;color:#94a3b8;">Студент не найден</div></div>`;
                return;
            }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const isBound = userId && BINDINGS[userId] === student.studentName;
            const absCount = ALL_DATA.absences[student.studentName] || "0";
            const totalAvg = student.totalAverage || '—';
            const avgNum = parseFloat(String(totalAvg).replace(',', '.'));
            let avgClass = 'gold';
            if (isNaN(avgNum)) avgClass = 'gold';
            else if (avgNum >= 7.5) avgClass = 'gold';
            else if (avgNum >= 5) avgClass = 'orange';
            else avgClass = 'red';
            
            const sorted = [...ALL_DATA.journal].sort((a,b) => a.studentName.localeCompare(b.studentName));
            const idx = sorted.findIndex(s => s.studentName === student.studentName) + 1;
            const studentId = String(idx).padStart(3, '0');
            
            let subjectsHtml = '';
            const icons = ['📐','💻','⚡','🔌','🏭','📡','🔧','📊','🎯','🧮','📈','🔬'];
            const colors = ['blue','pink','purple','green','orange','blue','pink','purple','green','orange','blue','pink'];
            
            student.subjects.forEach((sub, i) => {
                const isExam = ['Цифровая и микропроцессорная техника','Промышленная электроника и микроэлектроника','Автоматизация производства'].some(e => sub.subject.includes(e));
                const avg = sub.avg || '—';
                const num = parseFloat(String(avg).replace(',', '.'));
                let sc = 'gray';
                if (!isNaN(num)) { if (num >= 7.5) sc = 'gold'; else if (num >= 5) sc = 'orange'; else sc = 'red'; }
                
                let marksHtml = '';
                if (sub.marks && sub.marks.length) {
                    marksHtml = sub.marks.map(m => {
                        const n = parseFloat(String(m).replace(',', '.'));
                        let bg = '#475569';
                        if (!isNaN(n)) { if (n >= 7.5) bg = '#10b981'; else if (n >= 5) bg = '#f59e0b'; else bg = '#ef4444'; }
                        return `<span class="mark-item" style="background:${bg};">${m}</span>`;
                    }).join('');
                } else { marksHtml = '<span class="no-marks">Нет оценок</span>'; }
                
                const id = 'm_' + i + '_' + Math.random().toString(36).substr(2, 4);
                subjectsHtml += `
                    <div class="subject-row ${isExam ? 'exam' : ''}" onclick="toggleMarks('${id}')">
                        <div class="subject-icon ${colors[i % colors.length]}">${icons[i % icons.length]}</div>
                        <div class="subject-info"><div class="subject-name">${escapeHtml(sub.subject)} ${isExam ? '<span class="exam-badge">📝 Экзамен</span>' : ''}</div></div>
                        <div class="subject-score ${sc}">${avg}</div>
                    </div>
                    <div class="subject-marks-container" id="${id}">${marksHtml}</div>
                `;
            });
            
            container.innerHTML = `
                <div class="student-tile">
                    <div class="tile-close" onclick="closeCard()">✕</div>
                    <div class="tile-header">
                        <div class="tile-avatar">${getInitials(student.studentName)}</div>
                        <div class="tile-info">
                            <div class="tile-name">${escapeHtml(student.studentName)} ${isBound ? '<span class="tile-badge">✅ Вы</span>' : ''}</div>
                            <div class="tile-group">${getGroup(student.studentName)} • ID: #${studentId}</div>
                        </div>
                    </div>
                    <div class="tile-stats">
                        <div class="tile-stat"><span class="icon">📊</span> <span>Ср. балл: <span class="value gold">${totalAvg}</span></span></div>
                        <div class="tile-stat"><span class="icon">⏳</span> <span>Отгулы: <span class="value">${absCount}</span></span></div>
                        <div class="tile-stat"><span class="icon">📚</span> <span>Предметов: <span class="value green">${student.subjects.length}</span></span></div>
                    </div>
                </div>
                <div class="detail-card">
                    <div class="detail-header">
                        <div class="detail-top">
                            <div class="detail-avatar">${getInitials(student.studentName)}</div>
                            <div class="detail-title">
                                <div class="detail-name">${escapeHtml(student.studentName)}</div>
                                <div class="detail-sub"><span class="group-tag">${getGroup(student.studentName)}</span> <span>• ID: #${studentId}</span></div>
                            </div>
                        </div>
                        <div class="detail-avg-block">
                            <div class="avg-circle ${avgClass}">${totalAvg}</div>
                            <div class="avg-info">
                                <div class="avg-label">Средний балл</div>
                                <div class="avg-value">${avgNum >= 9 ? '🏆 Отлично' : avgNum >= 7.5 ? '✅ Хорошо' : avgNum >= 5 ? '⚠️ Удовлетворительно' : '❌ Требуется внимание'} <span>• ${student.subjects.length} предметов</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="detail-body">
                        <div class="detail-body-title">📋 Предметы <span class="count">${student.subjects.length}</span></div>
                        ${subjectsHtml}
                    </div>
                </div>
            `;
        }
        
        function openCard(name) {
            document.getElementById('cardOverlay').classList.add('open');
            renderCard(name);
        }
        function closeCard() { document.getElementById('cardOverlay').classList.remove('open'); }
        
        // ========== ЖУРНАЛ ==========
        function renderJournal() {
            const container = document.getElementById('list');
            const query = document.getElementById('search').value.toLowerCase().trim();
            container.innerHTML = '';
            
            const list = ALL_DATA.journal
                .filter(s => s.studentName.toLowerCase().includes(query))
                .sort((a,b) => a.studentName.localeCompare(b.studentName));
            
            if (!list.length) { container.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const sorted = [...ALL_DATA.journal].sort((a,b) => a.studentName.localeCompare(b.studentName));
            const top = [...ALL_DATA.journal].sort((a,b) => parseFloat(String(b.totalAverage).replace(',','.')) - parseFloat(String(a.totalAverage).replace(',','.'))).slice(0,3).map(s => s.studentName);
            const crowns = ['🥇','🥈','🥉'];
            
            list.forEach(s => {
                const isBound = userId && BINDINGS[userId] === s.studentName;
                const absCount = ALL_DATA.absences[s.studentName] || "0";
                const tIdx = top.indexOf(s.studentName);
                
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">${escapeHtml(s.studentName)} ${tIdx !== -1 ? crowns[tIdx] : ''} <span class="abs-badge">⏳ ${absCount}</span> ${isBound ? '<span style="font-size:9px;background:#10b981;color:white;padding:1px 8px;border-radius:10px;margin-left:6px;">✅ Вы</span>' : ''}</span>
                        <span class="score-pill ${getScoreStyle(s.totalAverage)}">${s.totalAverage || '—'}</span>
                    </div>
                `;
                div.onclick = () => openCard(s.studentName);
                container.appendChild(div);
            });
            updateProfile();
        }
        
        // ========== ПРОФИЛЬ ==========
        function updateProfile() {
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const bound = userId && BINDINGS[userId] ? BINDINGS[userId] : null;
            const btn = document.getElementById('profileBtn');
            const avatar = document.getElementById('profileAvatar');
            if (bound) {
                const student = ALL_DATA.journal.find(s => s.studentName === bound);
                if (student) { avatar.textContent = getInitials(student.studentName); btn.classList.add('active'); }
            } else { avatar.textContent = '👤'; btn.classList.remove('active'); }
        }
        
        // ========== ВЫБОР СТУДЕНТА (всегда открывается) ==========
        function showStudentSelect() {
            const popup = document.getElementById('identityPopup');
            const list = document.getElementById('studentSelectList');
            document.getElementById('popupSubText').textContent = 'Выберите свою фамилию из списка:';
            list.innerHTML = '';
            
            const sorted = [...ALL_DATA.journal].sort((a,b) => a.studentName.localeCompare(b.studentName));
            sorted.forEach(s => {
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `<div class="s-avatar">${getInitials(s.studentName)}</div><span class="s-name">${escapeHtml(s.studentName)}</span><span class="s-group">${getGroup(s.studentName)}</span>`;
                item.onclick = function() {
                    selectedStudent = s.studentName;
                    document.querySelectorAll('.student-item').forEach(el => { el.style.background = 'transparent'; el.style.border = 'none'; });
                    this.style.background = 'rgba(56, 189, 248, 0.1)';
                    this.style.border = '1px solid rgba(56, 189, 248, 0.2)';
                    document.getElementById('popupSubText').textContent = `Вы выбрали: ${s.studentName}`;
                };
                list.appendChild(item);
            });
            popup.classList.add('open');
        }
        
        // ========== СОБЫТИЯ ==========
        document.getElementById('profileBtn').onclick = function() {
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const bound = userId && BINDINGS[userId] ? BINDINGS[userId] : null;
            if (bound) {
                openCard(bound);
            } else {
                // Всегда показываем попап, пока не авторизован
                showStudentSelect();
            }
        };
        
        document.getElementById('cardOverlay').onclick = function(e) { if (e.target === this) closeCard(); };
        document.getElementById('search').oninput = renderJournal;
        document.getElementById('fabUpdate').onclick = function() { location.reload(); };
        
        document.getElementById('btnIdentityYes').onclick = async function() {
            if (!selectedStudent) { 
                if (tg) tg.showAlert('❌ Выберите свою фамилию из списка.');
                else alert('❌ Выберите свою фамилию из списка.');
                return; 
            }
            document.getElementById('identityPopup').classList.remove('open');
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            if (!userId) return;
            const sent = await notifyOwner(userId, selectedStudent);
            if (tg) tg.showAlert(sent ? '✅ Запрос отправлен!' : '❌ Ошибка отправки');
            else alert(sent ? '✅ Запрос отправлен!' : '❌ Ошибка отправки');
            selectedStudent = null;
            // Очищаем выделение
            document.querySelectorAll('.student-item').forEach(el => { el.style.background = 'transparent'; el.style.border = 'none'; });
        };
        
        document.getElementById('btnIdentityNo').onclick = function() {
            document.getElementById('identityPopup').classList.remove('open');
            selectedStudent = null;
            document.querySelectorAll('.student-item').forEach(el => { el.style.background = 'transparent'; el.style.border = 'none'; });
        };
        
        // Закрытие попапа по клику вне
        document.addEventListener('click', function(e) {
            const popup = document.getElementById('identityPopup');
            if (popup.classList.contains('open')) {
                if (!popup.contains(e.target)) {
                    popup.classList.remove('open');
                    selectedStudent = null;
                    document.querySelectorAll('.student-item').forEach(el => { el.style.background = 'transparent'; el.style.border = 'none'; });
                }
            }
        });
        
        // ========== ЗАПУСК ==========
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch(e) {}
        
        window.openCard = openCard;
        window.closeCard = closeCard;
        window.toggleMarks = toggleMarks;
        
        renderJournal();
        updateProfile();
    </script>
</body>
</html>
