<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Журнал 86РТК</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --exam-color: #f472b6;
            --exam-bg: rgba(244, 114, 182, 0.12);
            --success: #10b981;
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { 
            padding: 16px; 
            padding-bottom: 85px; 
        }

        /* ЛОАДЕР */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }
        
        .logo-container { 
            position: relative; 
            width: 100px; 
            height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 30px; 
        }
        
        .logo-outline {
            position: absolute; 
            width: 100%; 
            height: 100%;
            border-radius: 50%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        #loader:not(.error-mode) .logo-container {
            animation: breatheContainer 2s ease-in-out infinite;
        }
        
        #loader:not(.error-mode) .logo-outline {
            border: 2px solid rgba(56, 189, 248, 0.15);
            border-top: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: spin 1.2s linear infinite;
        }
        
        #loader:not(.error-mode) .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            animation: breatheIcon 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        
        #loader.error-mode .logo-outline {
            border: 2px solid var(--error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: none;
        }
        
        #loader.error-mode .logo-icon {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: breatheIconError 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        
        .logo-icon {
            width: 45px; 
            height: 60px; 
            border-radius: 5px 12px 12px 5px; 
            position: relative; 
            z-index: 2;
        }
        
        .logo-icon::before {
            content: ""; 
            position: absolute; 
            top: 12px; 
            left: 8px;
            width: 25px; 
            height: 3px; 
            background: rgba(255,255,255,0.5);
            border-radius: 2px; 
            box-shadow: 0 8px 0 rgba(255,255,255,0.5), 0 16px 0 rgba(255,255,255,0.5);
        }
        
        .loader-status { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--accent); 
            text-transform: uppercase; 
            letter-spacing: 0.3em; 
            margin-bottom: 25px;
        }
        
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
        }
        
        .error-container.visible {
            display: flex;
        }
        
        .error-message {
            font-size: 13px;
            font-weight: 500;
            color: var(--error);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        
        .copyright {
            position: absolute;
            bottom: 25px;
            font-size: 9px;
            color: rgba(255,255,255,0.08);
        }

        @keyframes breatheContainer {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.98); }
        }
        
        @keyframes breatheIcon {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        
        @keyframes breatheIconError {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* ИНТЕРФЕЙС */
        #main-content { 
            opacity: 0; 
            transition: 0.5s; 
            display: none;
        }
        #main-content.visible {
            display: block;
            opacity: 1;
        }
        
        .header-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .mini-journal-icon {
            width: 28px;
            height: 36px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-radius: 3px 8px 8px 3px;
            position: relative;
            display: inline-block;
        }
        
        .mini-journal-icon::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 5px;
            width: 18px;
            height: 2px;
            background: rgba(255,255,255,0.6);
            border-radius: 1px;
            box-shadow: 0 7px 0 rgba(255,255,255,0.6), 0 14px 0 rgba(255,255,255,0.6);
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
        }
        
        .header-sub { 
            font-size: 11px; 
            color: var(--muted); 
            margin-bottom: 16px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        
        #search { 
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 12px 16px; 
            border-radius: 14px; 
            background: rgba(255,255,255,0.04); 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 16px; 
        }
        #search:focus { 
            border-color: var(--accent); 
        }
        
        .card { 
            background: var(--card); 
            border-radius: 18px; 
            padding: 14px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
        }
        .card:active { 
            transform: scale(0.98); 
        }
        .student-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .student-name { 
            font-size: 15px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        
        .abs-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        
        .score-pill { 
            font-size: 11px; 
            font-weight: 700; 
            padding: 3px 8px; 
            border-radius: 7px; 
            min-width: 36px; 
            text-align: center; 
            display: inline-block;
        }
        .m-low { background: #ef4444; color: white; } 
        .m-warn { background: #f59e0b; color: white; } 
        .m-high { background: #10b981; color: white; }
        .m-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
        .m-none { background: rgba(255,255,255,0.08); color: var(--muted); }
        
        .subs-container { 
            display: none;
            padding-top: 12px; 
            margin-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .subs-container.open { 
            display: block; 
        }
        .sub-item { 
            margin-bottom: 10px; 
            cursor: pointer; 
            padding: 8px 10px;
            border-radius: 10px;
            transition: background 0.2s;
            position: relative;
        }
        .sub-item.exam-subject {
            background: var(--exam-bg);
            border-left: 3px solid var(--exam-color);
        }
        .sub-item.exam-subject:active {
            background: rgba(244, 114, 182, 0.2);
        }
        .sub-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 6px; 
            font-size: 13px; 
        }
        .subject-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .exam-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--exam-color);
            border-radius: 50%;
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
            pointer-events: none;
        }
        .exam-tooltip {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--exam-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text);
            line-height: 1.5;
            max-width: 100%;
            margin-top: 6px;
            animation: fadeIn 0.25s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .exam-tooltip.open {
            display: block;
        }
        .exam-tooltip .tooltip-title {
            color: var(--exam-color);
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .exam-tooltip .tooltip-text {
            color: var(--muted);
        }
        .exam-tooltip .tooltip-text strong {
            color: var(--text);
        }
        .exam-tooltip .tooltip-hint {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            margin-top: 6px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }
        
        .marks-box { 
            display: none; 
            background: rgba(0,0,0,0.25); 
            padding: 10px; 
            border-radius: 10px; 
            margin-top: 6px; 
        }
        .marks-box.open { 
            display: block; 
        }
        .marks-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
        }
        .mark { 
            width: 26px; 
            height: 26px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 7px; 
            font-size: 10px; 
            font-weight: 700; 
            margin-right: 2px; 
        }
        
        /* ВКЛАДКА СТУДЕНТЫ */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .student-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px 14px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .student-card:active {
            transform: scale(0.96);
        }
        
        .student-card .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }
        
        .student-card .sname {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        
        .student-card .sgroup {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        
        .student-card .sstats {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        .student-card .sstats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .student-card .sstats .avg {
            color: var(--gold);
            font-weight: 700;
        }
        
        .student-card .sstats .abs {
            color: var(--muted);
        }
        
        .student-card .badge-verified {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--success);
            color: white;
            font-size: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
        }
        
        .student-card .badge-verified.show {
            display: flex;
        }
        
        .student-card .sgroup-badge {
            display: inline-block;
            background: rgba(255,255,255,0.06);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 9px;
            color: var(--muted);
            margin-bottom: 2px;
        }
        
        /* КНОПКА "ЭТО ВЫ?" */
        .identity-popup {
            display: none;
            position: fixed;
            bottom: 100px;
            left: 16px;
            right: 16px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 1001;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            background: rgba(30, 41, 59, 0.95);
        }
        
        .identity-popup.open {
            display: block;
        }
        
        .identity-popup .title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .identity-popup .sub {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 16px;
        }
        
        .identity-popup .actions {
            display: flex;
            gap: 10px;
        }
        
        .identity-popup .actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .identity-popup .actions button:active {
            transform: scale(0.96);
        }
        
        .identity-popup .btn-yes {
            background: var(--success);
            color: white;
        }
        
        .identity-popup .btn-no {
            background: rgba(255,255,255,0.08);
            color: var(--text);
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* НАВИГАЦИЯ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 16px 10px;
            z-index: 1000;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: transparent;
            border: none;
            padding: 6px 12px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 120px;
        }
        
        .nav-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .nav-icon {
            width: 20px;
            height: 20px;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .icon-journal {
            width: 18px;
            height: 24px;
            background: linear-gradient(135deg, #94a3b8, #64748b);
            border-radius: 2px 5px 5px 2px;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .icon-journal::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 3px;
            width: 12px;
            height: 2px;
            background: rgba(255,255,255,0.5);
            border-radius: 1px;
            box-shadow: 0 5px 0 rgba(255,255,255,0.5), 0 10px 0 rgba(255,255,255,0.5);
        }
        
        .nav-item.active .icon-journal {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
        }
        
        .icon-students {
            width: 24px;
            height: 24px;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .icon-students svg {
            width: 100%;
            height: 100%;
            stroke: #94a3b8;
            transition: all 0.2s ease;
        }
        
        .nav-item.active .icon-students svg {
            stroke: var(--accent);
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
        }
        
        .nav-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            transition: all 0.2s ease;
        }
        
        .nav-item.active .nav-label {
            color: var(--accent);
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .fab-update { 
            position: fixed; 
            bottom: 75px; 
            right: 16px; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.12); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 999; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .fab-update:active { 
            transform: scale(0.92); 
        }
        
        .footer-signature {
            text-align: center;
            padding: 16px 16px 24px;
            color: rgba(255,255,255,0.08);
            font-size: 9px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-nav {
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }
            body {
                padding-bottom: calc(85px + env(safe-area-inset-bottom));
            }
            .fab-update {
                bottom: calc(75px + env(safe-area-inset-bottom));
            }
            .identity-popup {
                bottom: calc(100px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-inner">
            <div class="logo-container">
                <div class="logo-outline"></div>
                <div class="logo-icon"></div>
            </div>
            <div class="loader-status" id="loaderStatus">Загрузка данных</div>
            <div class="error-container" id="errorContainer">
                <div class="error-message" id="errorMessage">Не удалось подключиться к серверу</div>
                <button class="retry-button" id="retryButton">Повторить</button>
            </div>
        </div>
        <div class="copyright">by @skwared</div>
    </div>

    <div id="main-content">
        <div class="header-title">
            <span class="header-logo"><span class="mini-journal-icon"></span></span>
            Журнал 86РТК
        </div>
        
        <div id="page-journal" class="page active">
            <div class="header-sub">Электронный журнал успеваемости</div>
            <input type="text" id="search" placeholder="Поиск по фамилии" autocomplete="off">
            <div id="list"></div>
        </div>
        
        <div id="page-students" class="page">
            <div class="header-sub">Студенты группы</div>
            <div id="studentsGrid" class="students-grid"></div>
        </div>
        
        <div class="footer-signature">by @skwared</div>
    </div>
    
    <!-- ПОПАП ДЛЯ ПОДТВЕРЖДЕНИЯ ЛИЧНОСТИ -->
    <div class="identity-popup" id="identityPopup">
        <div class="title">👤 Это вы?</div>
        <div class="sub" id="popupStudentName">Иванов Иван</div>
        <div class="actions">
            <button class="btn-yes" id="btnIdentityYes">Да, это я</button>
            <button class="btn-no" id="btnIdentityNo">Нет</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" data-page="journal">
            <div class="nav-icon"><div class="icon-journal"></div></div>
            <span class="nav-label">Журнал</span>
        </button>
        <button class="nav-item" data-page="students">
            <div class="nav-icon">
                <svg class="icon-students" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <span class="nav-label">Студенты</span>
        </button>
    </div>

    <div class="fab-update" id="fabUpdate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
    </div>

    <script>
        // ============================================================
        // 1. НАСТРОЙКИ
        // ============================================================
        const API_JOURNAL = 'https://script.google.com/macros/s/AKfycbwtV3eFenNotdiVr3u1DQPJdOLn2fieHDsvWUwlsQquKURzkLkW4wuTiLqkNFnWCH0v/exec';
        const API_ABSENCES = 'https://script.google.com/macros/s/AKfycbyux4wfN_lVoodDq-JHHjbYAGuJys_DsZ2mADyUGdw1MERG-iZK833dN0tSzI7lq_QeZg/exec';
        const BOT_TOKEN = '8559243948:AAFAW1LdoTmE1a0I1pTgOvv6c9jDLz_1nnI'; // ← ВСТАВЬТЕ ТОКЕН ВАШЕГО БОТА
        const OWNER_CHAT_ID = '5753985995'; // ← ВАШ ID В ТЕЛЕГРАМЕ (узнать через @userinfobot)
        
        // ============================================================
        // 2. РУЧНАЯ ПРИВЯЗКА СТУДЕНТОВ
        //    СЮДА ВЫ ВНОСИТЕ СООТВЕТСТВИЯ ПОСЛЕ ПОЛУЧЕНИЯ УВЕДОМЛЕНИЯ
        // ============================================================
        const BINDINGS = {
            // 'telegram_user_id' : 'полное имя студента'
            // '123456789' : 'Иванов Иван Иванович',
            // '987654321' : 'Петров Петр Петрович'
        };
        
        // ============================================================
        // 3. ОСТАЛЬНОЙ КОД
        // ============================================================
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch(e) {}
        
        const CACHE_KEY = 'journal_86rtk_v7';
        
        const EXAM_SUBJECTS = [
            'Цифровая и микропроцессорная техника',
            'Промышленная электроника и микроэлектроника',
            'Автоматизация производства'
        ];
        
        let ALL_DATA = { journal: [], absences: {} };
        let isLoading = false;
        let currentStudentForIdentity = null;
        
        // ============================================================
        // 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function isExamSubject(subjectName) {
            if (!subjectName) return false;
            const name = subjectName.toLowerCase().trim();
            return EXAM_SUBJECTS.some(exam => name.includes(exam.toLowerCase()) || exam.toLowerCase().includes(name));
        }
        
        function calculateAverage(marks) {
            if (!marks || marks.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (let m of marks) {
                let val = parseFloat(String(m).replace(',', '.'));
                if (!isNaN(val) && val > 0) {
                    sum += val;
                    count++;
                }
            }
            if (count === 0) return null;
            let avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function calculateTotalAverage(subjects) {
            if (!subjects || subjects.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (let sub of subjects) {
                if (sub.avg && sub.avg !== '—') {
                    let val = parseFloat(String(sub.avg).replace(',', '.'));
                    if (!isNaN(val) && val > 0) {
                        sum += val;
                        count++;
                    }
                }
            }
            if (count === 0) return null;
            let avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function getStyleForScore(score) {
            if (!score || score === '—' || score === '0,0') return 'm-none';
            const v = parseFloat(String(score).replace(',', '.'));
            if (isNaN(v)) return 'm-none';
            if (v >= 9.5) return 'm-gold';
            if (v >= 7.5) return 'm-high';
            if (v >= 5) return 'm-warn';
            return 'm-low';
        }
        
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }
        
        function getGroup(name) {
            // Пытаемся извлечь группу из имени или используем заглушку
            // В ваших данных может быть отдельное поле group
            return '86РТК';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showError(message) {
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');
            loader.classList.add('error-mode');
            loaderStatus.textContent = 'Ошибка соединения';
            errorMessage.textContent = message || 'Не удалось подключиться к серверу';
            errorContainer.classList.add('visible');
        }
        
        function hideError() {
            const loader = document.getElementById('loader');
            const errorContainer = document.getElementById('errorContainer');
            loader.classList.remove('error-mode');
            errorContainer.classList.remove('visible');
            document.getElementById('loaderStatus').textContent = 'Загрузка данных';
        }
        
        // ============================================================
        // 5. ОТПРАВКА УВЕДОМЛЕНИЯ ВЛАДЕЛЬЦУ
        // ============================================================
        async function notifyOwner(userId, studentName) {
            try {
                const message = `🔔 <b>Новая привязка!</b>\n\n` +
                    `👤 Студент: <b>${escapeHtml(studentName)}</b>\n` +
                    `🆔 Telegram ID: <code>${userId}</code>\n\n` +
                    `Для привязки добавьте в BINDINGS:\n` +
                    `<code>'${userId}' : '${escapeHtml(studentName)}'</code>`;
                
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: OWNER_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                if (data.ok) {
                    console.log('Уведомление отправлено');
                    return true;
                } else {
                    console.error('Ошибка отправки:', data);
                    return false;
                }
            } catch (e) {
                console.error('Ошибка при отправке уведомления:', e);
                return false;
            }
        }
        
        // ============================================================
        // 6. ОСНОВНЫЕ ФУНКЦИИ
        // ============================================================
        function processAllAverages() {
            for (let student of ALL_DATA.journal) {
                if (student.subjects && Array.isArray(student.subjects)) {
                    for (let subject of student.subjects) {
                        const calculatedAvg = calculateAverage(subject.marks);
                        if (calculatedAvg) {
                            subject.avg = calculatedAvg;
                        } else if (!subject.avg || subject.avg === '—') {
                            subject.avg = '—';
                        }
                    }
                    const totalAvg = calculateTotalAverage(student.subjects);
                    if (totalAvg) {
                        student.totalAverage = totalAvg;
                    } else if (!student.totalAverage || student.totalAverage === '0,0') {
                        student.totalAverage = '—';
                    }
                }
            }
        }
        
        function getStudentByName(name) {
            return ALL_DATA.journal.find(s => s.studentName === name);
        }
        
        function renderJournal() {
            const container = document.getElementById('list');
            if (!container) return;
            container.innerHTML = '';
            const query = document.getElementById('search')?.value.toLowerCase().trim() || '';
            
            if (!ALL_DATA.journal || ALL_DATA.journal.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных</div>';
                return;
            }
            
            let filteredStudents = ALL_DATA.journal.filter(s => s && s.studentName);
            
            const sortedByTotal = [...filteredStudents].sort((a, b) => {
                const avgA = parseFloat(String(a.totalAverage).replace(',', '.'));
                const avgB = parseFloat(String(b.totalAverage).replace(',', '.'));
                if (isNaN(avgA)) return 1;
                if (isNaN(avgB)) return -1;
                return avgB - avgA;
            });
            const topNames = sortedByTotal.slice(0, 3).map(s => s.studentName);
            const crowns = ['🥇', '🥈', '🥉'];
            
            const list = filteredStudents
                .filter(s => s && s.studentName && s.studentName.toLowerCase().includes(query))
                .sort((a, b) => a.studentName.localeCompare(b.studentName));
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                return;
            }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            
            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card';
                const absCount = ALL_DATA.absences[s.studentName] || "0";
                const tIdx = topNames.indexOf(s.studentName);
                
                // Проверяем, привязан ли этот студент к текущему пользователю
                const isBoundToMe = userId && BINDINGS[userId] === s.studentName;
                
                let subsHtml = '';
                if (s.subjects && Array.isArray(s.subjects)) {
                    subsHtml = s.subjects.map(sub => {
                        const isExam = isExamSubject(sub.subject);
                        
                        let marksHtml = '';
                        if (sub.marks && Array.isArray(sub.marks) && sub.marks.length > 0) {
                            marksHtml = sub.marks.map(m => `<div class="mark ${getStyleForScore(m)}">${m}</div>`).join('');
                        } else {
                            marksHtml = '<div style="font-size:10px; opacity:0.4; padding:6px;">Нет отметок</div>';
                        }
                        
                        const avgDisplay = sub.avg && sub.avg !== '—' ? sub.avg : '—';
                        const examClass = isExam ? 'exam-subject' : '';
                        
                        const tooltipId = 'tooltip_' + Math.random().toString(36).substr(2, 9);
                        const examIcon = isExam ? `<span class="exam-icon">!</span>` : '';
                        
                        const tooltipHtml = isExam ? `
                            <div class="exam-tooltip" id="${tooltipId}">
                                <div class="tooltip-title">📝 Экзаменационный предмет</div>
                                <div class="tooltip-text">Итоговая отметка может <strong>отличаться</strong> от текущей успеваемости и выставляется по результатам экзамена.</div>
                                <div class="tooltip-hint">Нажмите на подсказку, чтобы скрыть</div>
                            </div>
                        ` : '';
                        
                        return `<div class="sub-item ${examClass}" data-tooltip="${tooltipId}" data-tooltip-shown="false">
                            <div class="sub-row">
                                <div class="subject-name-wrapper">
                                    <span>${escapeHtml(sub.subject || 'Без названия')}</span>
                                    ${examIcon}
                                </div>
                                <span class="score-pill ${getStyleForScore(avgDisplay)}">${avgDisplay}</span>
                            </div>
                            <div class="marks-box">
                                <div class="marks-row">${marksHtml}</div>
                            </div>
                            ${tooltipHtml}
                        </div>`;
                    }).join('');
                } else {
                    subsHtml = '<div style="font-size:11px; opacity:0.4; text-align:center; padding:10px;">Нет предметов</div>';
                }
                
                const totalDisplay = s.totalAverage && s.totalAverage !== '—' ? s.totalAverage : '—';
                
                const identityBadge = isBoundToMe ? 
                    `<span style="font-size:9px;background:var(--success);color:white;padding:1px 8px;border-radius:10px;margin-left:6px;">✅ Вы</span>` : '';
                
                card.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">
                            ${escapeHtml(s.studentName)} ${tIdx !== -1 ? crowns[tIdx] : ''}
                            <span class="abs-badge">⏳ ${absCount}</span>
                            ${identityBadge}
                        </span>
                        <span class="score-pill ${getStyleForScore(totalDisplay)}">${totalDisplay}</span>
                    </div>
                    <div class="subs-container">${subsHtml}</div>`;
                
                // Обработка клика по карточке - открываем попап для идентификации
                card.onclick = function(e) {
                    e.stopPropagation();
                    
                    // Если уже привязан или это не в Telegram (нет ID) - просто открываем предметы
                    if (isBoundToMe || !userId) {
                        const subsContainer = this.querySelector('.subs-container');
                        if (subsContainer) {
                            subsContainer.classList.toggle('open');
                            if (subsContainer.classList.contains('open')) {
                                this.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                            }
                        }
                        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                        return;
                    }
                    
                    // Показываем попап "Это вы?"
                    currentStudentForIdentity = s.studentName;
                    const popup = document.getElementById('identityPopup');
                    document.getElementById('popupStudentName').textContent = s.studentName;
                    popup.classList.add('open');
                    
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                };
                
                container.appendChild(card);
            });
            
            document.querySelectorAll('.sub-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const marksBox = this.querySelector('.marks-box');
                    if (marksBox) marksBox.classList.toggle('open');
                    
                    if (this.classList.contains('exam-subject')) {
                        const tooltipId = this.dataset.tooltip;
                        const tooltip = document.getElementById(tooltipId);
                        if (tooltip && this.dataset.tooltipShown === 'false') {
                            tooltip.classList.add('open');
                            this.dataset.tooltipShown = 'true';
                            
                            tooltip.onclick = function(e) {
                                e.stopPropagation();
                                this.classList.remove('open');
                                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                            };
                            
                            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                        }
                    }
                });
            });
        }
        
        function renderStudents() {
            const container = document.getElementById('studentsGrid');
            if (!container) return;
            container.innerHTML = '';
            
            if (!ALL_DATA.journal || ALL_DATA.journal.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных</div>';
                return;
            }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const sorted = [...ALL_DATA.journal].filter(s => s && s.studentName)
                .sort((a, b) => a.studentName.localeCompare(b.studentName));
            
            sorted.forEach(s => {
                const absCount = ALL_DATA.absences[s.studentName] || "0";
                const totalAvg = s.totalAverage && s.totalAverage !== '—' ? s.totalAverage : '—';
                const isBound = userId && BINDINGS[userId] === s.studentName;
                
                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="badge-verified ${isBound ? 'show' : ''}">✓</div>
                    <div class="avatar">${getInitials(s.studentName)}</div>
                    <div class="sname">${escapeHtml(s.studentName)}</div>
                    <div class="sgroup">
                        <span class="sgroup-badge">${getGroup(s.studentName)}</span>
                    </div>
                    <div class="sstats">
                        <span>📊 <span class="avg">${totalAvg}</span></span>
                        <span>⏳ <span class="abs">${absCount}</span></span>
                    </div>
                `;
                
                // Клик по карточке в списке студентов - переход в журнал с поиском
                card.onclick = function(e) {
                    e.stopPropagation();
                    // Переключаемся на вкладку журнала и ищем студента
                    switchPage('journal');
                    document.getElementById('search').value = s.studentName;
                    renderJournal();
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                };
                
                container.appendChild(card);
            });
        }
        
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
        }
        
        // ============================================================
        // 7. ЗАГРУЗКА ДАННЫХ
        // ============================================================
        async function init(force = false) {
            if (isLoading) return;
            isLoading = true;
            
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            hideError();
            loaderStatus.textContent = 'Загрузка данных';
            
            const timeoutId = setTimeout(() => {
                if (isLoading) showError('Сервер не отвечает');
            }, 20000);
            
            const cached = localStorage.getItem(CACHE_KEY);
            if (!force && cached) {
                try {
                    ALL_DATA = JSON.parse(cached);
                    if (ALL_DATA.journal && ALL_DATA.journal.length > 0) {
                        clearTimeout(timeoutId);
                        processAllAverages();
                        renderJournal();
                        renderStudents();
                        hideLoader();
                        isLoading = false;
                        return;
                    }
                } catch(e) {}
            }
            
            try {
                loaderStatus.textContent = 'Загрузка журнала';
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 15000);
                
                const [resJ, resA] = await Promise.all([
                    fetch(API_JOURNAL, { signal: controller.signal }).then(r => r.json()),
                    fetch(API_ABSENCES, { signal: controller.signal }).then(r => r.json())
                ]);
                
                clearTimeout(timeoutId);
                
                const absMap = {};
                if (Array.isArray(resA)) {
                    resA.forEach(a => { 
                        if (a && a.name) absMap[a.name.trim()] = a.count || "0"; 
                    });
                }
                
                let journalData = [];
                if (Array.isArray(resJ)) journalData = resJ;
                else if (resJ && resJ.journal && Array.isArray(resJ.journal)) journalData = resJ.journal;
                else if (resJ && !resJ.error) journalData = resJ;
                
                if (!journalData.length) throw new Error('No data');
                
                ALL_DATA = { journal: journalData, absences: absMap };
                
                processAllAverages();
                
                localStorage.setItem(CACHE_KEY, JSON.stringify(ALL_DATA));
                
                renderJournal();
                renderStudents();
                hideLoader();
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
            } catch (e) {
                console.error('Error:', e);
                clearTimeout(timeoutId);
                
                if (ALL_DATA.journal && ALL_DATA.journal.length > 0) {
                    loaderStatus.textContent = 'Использую сохранённые данные';
                    setTimeout(() => {
                        processAllAverages();
                        renderJournal();
                        renderStudents();
                        hideLoader();
                    }, 800);
                } else {
                    showError('Проверьте подключение к интернету');
                }
            } finally {
                isLoading = false;
            }
        }
        
        function forceUpdate() {
            localStorage.removeItem(CACHE_KEY);
            init(true);
        }
        
        function hideLoader() {
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('main-content');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                mainContent.classList.add('visible');
            }, 500);
        }
        
        // ============================================================
        // 8. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================
        // Навигация
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                switchPage(page);
                if (page === 'students') renderStudents();
                if (page === 'journal') renderJournal();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });
        });
        
        // Поиск
        document.getElementById('search')?.addEventListener('input', () => renderJournal());
        
        // Обновление
        document.getElementById('retryButton')?.addEventListener('click', () => forceUpdate());
        document.getElementById('fabUpdate')?.addEventListener('click', () => forceUpdate());
        
        // Попап "Это вы?"
        document.getElementById('btnIdentityYes')?.addEventListener('click', async function() {
            const popup = document.getElementById('identityPopup');
            popup.classList.remove('open');
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            if (!userId || !currentStudentForIdentity) {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            
            // Отправляем уведомление владельцу
            const sent = await notifyOwner(userId, currentStudentForIdentity);
            
            // Показываем уведомление пользователю
            if (tg && tg.HapticFeedback) {
                if (sent) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert('✅ Запрос отправлен! Ожидайте подтверждения.');
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('❌ Ошибка отправки. Попробуйте позже.');
                }
            } else {
                alert(sent ? '✅ Запрос отправлен!' : '❌ Ошибка отправки');
            }
            
            currentStudentForIdentity = null;
        });
        
        document.getElementById('btnIdentityNo')?.addEventListener('click', function() {
            document.getElementById('identityPopup').classList.remove('open');
            currentStudentForIdentity = null;
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });
        
        // Закрытие попапа по клику вне его
        document.addEventListener('click', function(e) {
            const popup = document.getElementById('identityPopup');
            if (popup.classList.contains('open')) {
                if (!popup.contains(e.target)) {
                    popup.classList.remove('open');
                    currentStudentForIdentity = null;
                }
            }
        });
        
        // ============================================================
        // 9. ЗАПУСК
        // ============================================================
        if (tg) {
            tg.onEvent('backButtonClicked', () => tg.close());
        }
        
        init(true);
    </script>
</body>
</html>
