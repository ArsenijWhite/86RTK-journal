<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Журнал 86РТК</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --exam-color: #f472b6;
            --exam-bg: rgba(244, 114, 182, 0.12);
            --success: #10b981;
            --admin: #8b5cf6;
            --tab-inactive: #334155;
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { 
            padding: 16px; 
            padding-bottom: 80px; 
        }

        /* ЛОАДЕР */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }
        .logo-container { 
            position: relative; 
            width: 100px; 
            height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 30px; 
        }
        .logo-outline {
            position: absolute; 
            width: 100%; 
            height: 100%;
            border-radius: 50%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        #loader:not(.error-mode) .logo-container {
            animation: breatheContainer 2s ease-in-out infinite;
        }
        #loader:not(.error-mode) .logo-outline {
            border: 2px solid rgba(56, 189, 248, 0.15);
            border-top: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: spin 1.2s linear infinite;
        }
        #loader:not(.error-mode) .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            animation: breatheIcon 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        #loader.error-mode .logo-outline {
            border: 2px solid var(--error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: none;
        }
        #loader.error-mode .logo-icon {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: breatheIconError 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .logo-icon {
            width: 45px; 
            height: 60px; 
            border-radius: 5px 12px 12px 5px; 
            position: relative; 
            z-index: 2;
        }
        .logo-icon::before {
            content: ""; 
            position: absolute; 
            top: 12px; 
            left: 8px;
            width: 25px; 
            height: 3px; 
            background: rgba(255,255,255,0.5);
            border-radius: 2px; 
            box-shadow: 0 8px 0 rgba(255,255,255,0.5), 0 16px 0 rgba(255,255,255,0.5);
        }
        .loader-status { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--accent); 
            text-transform: uppercase; 
            letter-spacing: 0.3em; 
            margin-bottom: 25px;
        }
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
        }
        .error-container.visible { display: flex; }
        .error-message {
            font-size: 13px;
            font-weight: 500;
            color: var(--error);
            text-align: center;
            margin-bottom: 20px;
        }
        .retry-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .copyright {
            position: absolute;
            bottom: 25px;
            font-size: 9px;
            color: rgba(255,255,255,0.08);
        }

        @keyframes breatheContainer {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.98); }
        }
        @keyframes breatheIcon {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        @keyframes breatheIconError {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ОСНОВНОЙ КОНТЕНТ */
        #main-content { 
            opacity: 0; 
            transition: 0.5s; 
            display: none;
        }
        #main-content.visible {
            display: block;
            opacity: 1;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
        }
        .header-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            vertical-align: middle;
        }
        .mini-journal-icon {
            width: 28px;
            height: 36px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-radius: 3px 8px 8px 3px;
            position: relative;
            display: inline-block;
        }
        .mini-journal-icon::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 5px;
            width: 18px;
            height: 2px;
            background: rgba(255,255,255,0.6);
            border-radius: 1px;
            box-shadow: 0 7px 0 rgba(255,255,255,0.6), 0 14px 0 rgba(255,255,255,0.6);
        }
        
        .profile-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }
        .profile-btn:active { transform: scale(0.92); }
        .profile-btn .ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #38bdf8, #f472b6, #fbbf24);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .profile-btn.active .ring { opacity: 1; animation: spinRing 3s linear infinite; }
        .profile-btn .profile-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #94a3b8;
        }
        .profile-btn .profile-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            transition: all 0.3s ease;
        }
        .profile-btn.active .profile-icon { color: #38bdf8; filter: drop-shadow(0 0 8px rgba(56,189,248,0.3)); }
        .profile-btn .mode-label {
            display: none;
            position: absolute;
            bottom: -18px;
            font-size: 7px;
            color: var(--muted);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .profile-btn.active .mode-label { display: block; }

        .header-sub { 
            font-size: 11px; 
            color: var(--muted); 
            margin-bottom: 16px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        #search { 
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 12px 16px; 
            border-radius: 14px; 
            background: rgba(255,255,255,0.04); 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 16px; 
        }
        #search:focus { border-color: var(--accent); }
        
        .card { 
            background: var(--card); 
            border-radius: 18px; 
            padding: 14px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .student-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .student-name { 
            font-size: 15px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        .abs-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .score-pill { 
            font-size: 11px; 
            font-weight: 700; 
            padding: 3px 8px; 
            border-radius: 7px; 
            min-width: 36px; 
            text-align: center; 
            display: inline-block;
        }
        .m-low { background: #ef4444; color: white; } 
        .m-warn { background: #f59e0b; color: white; } 
        .m-high { background: #10b981; color: white; }
        .m-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
        .m-none { background: rgba(255,255,255,0.08); color: var(--muted); }
        
        .subs-container { 
            display: none;
            padding-top: 12px; 
            margin-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .subs-container.open { display: block; }
        .sub-item { 
            margin-bottom: 10px; 
            cursor: pointer; 
            padding: 8px 10px;
            border-radius: 10px;
            transition: background 0.2s;
            position: relative;
        }
        .sub-item.exam-subject {
            background: var(--exam-bg);
            border-left: 3px solid var(--exam-color);
        }
        .sub-item.exam-subject:active { background: rgba(244, 114, 182, 0.2); }
        .sub-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 6px; 
            font-size: 13px; 
        }
        .subject-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .exam-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--exam-color);
            border-radius: 50%;
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
            pointer-events: none;
        }
        .exam-tooltip {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--exam-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text);
            line-height: 1.5;
            max-width: 100%;
            margin-top: 6px;
            animation: fadeIn 0.25s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .exam-tooltip.open { display: block; }
        .exam-tooltip .tooltip-title {
            color: var(--exam-color);
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .exam-tooltip .tooltip-text { color: var(--muted); }
        .exam-tooltip .tooltip-text strong { color: var(--text); }
        .exam-tooltip .tooltip-hint {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            margin-top: 6px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }
        .marks-box { 
            display: none; 
            background: rgba(0,0,0,0.25); 
            padding: 10px; 
            border-radius: 10px; 
            margin-top: 6px; 
        }
        .marks-box.open { display: block; }
        .marks-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
        }
        .mark { 
            width: 26px; 
            height: 26px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 7px; 
            font-size: 10px; 
            font-weight: 700; 
            margin-right: 2px; 
        }

        .card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1500;
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
        }
        .card-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
        .card-overlay .card-wrapper { max-width: 420px; width: 100%; margin: auto; animation: slideUp 0.3s ease; }

        .student-card {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            position: relative;
        }
        .student-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #f472b6, #fbbf24);
            opacity: 0.6;
        }
        .card-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
            z-index: 2;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        .card-close:active { transform: scale(0.92); background: rgba(255,255,255,0.08); }
        .card-header {
            padding: 24px 20px 18px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        .card-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
            border-radius: 50%;
        }
        .card-header::before { content: '📚'; position: absolute; bottom: -10px; right: 20px; font-size: 48px; opacity: 0.06; }
        .card-user {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }
        .card-user-info { flex: 1; min-width: 0; }
        .card-user-name { font-size: 19px; font-weight: 700; color: var(--text); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-user-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .card-user-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-user-meta .tag { background: rgba(255,255,255,0.06); padding: 2px 12px; border-radius: 20px; font-size: 10px; }
        .card-stats {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            position: relative;
            z-index: 1;
        }
        .stat-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 700;
            flex-shrink: 0;
            position: relative;
        }
        .stat-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        .stat-circle.gold { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1)); color: #fbbf24; }
        .stat-circle.green { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1)); color: #10b981; }
        .stat-circle.orange { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.1)); color: #f59e0b; }
        .stat-circle.red { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1)); color: #ef4444; }
        .stat-info { flex: 1; }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 14px; font-weight: 600; color: var(--text); }
        .stat-value span { color: var(--muted); font-weight: 400; font-size: 12px; }
        .card-body { padding: 18px 20px 20px; }
        .card-body-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .card-body-title .count { font-size: 10px; font-weight: 400; color: var(--muted); background: rgba(255,255,255,0.04); padding: 1px 10px; border-radius: 20px; }
        .subject-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            width: 100%;
        }
        .subject-row:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
        .subject-row .subject-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .subject-row .subject-icon.blue { background: rgba(56, 189, 248, 0.15); }
        .subject-row .subject-icon.pink { background: rgba(244, 114, 182, 0.15); }
        .subject-row .subject-icon.green { background: rgba(16, 185, 129, 0.15); }
        .subject-row .subject-icon.orange { background: rgba(251, 191, 36, 0.15); }
        .subject-row .subject-icon.purple { background: rgba(168, 85, 247, 0.15); }
        .subject-row .subject-info { flex: 1; min-width: 0; }
        .subject-row .subject-name { font-size: 14px; font-weight: 500; color: var(--text); }
        .subject-row .subject-score { font-size: 14px; font-weight: 700; margin-left: 8px; flex-shrink: 0; min-width: 30px; text-align: right; }
        .subject-row .subject-score.gold { color: #fbbf24; }
        .subject-row .subject-score.green { color: #10b981; }
        .subject-row .subject-score.orange { color: #f59e0b; }
        .subject-row .subject-score.red { color: #ef4444; }
        .subject-row .subject-score.gray { color: #475569; }
        .subject-row.exam { background: rgba(244, 114, 182, 0.08); border-left: 3px solid #f472b6; border-radius: 0 12px 12px 0; padding-left: 11px; }
        .subject-row.exam .exam-badge { font-size: 8px; font-weight: 700; text-transform: uppercase; color: #f472b6; background: rgba(244, 114, 182, 0.15); padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
        .subject-marks-container {
            display: none;
            margin: 6px 0 10px 0;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }
        .subject-marks-container.open { display: flex; }
        .subject-marks-container .mark-item {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }
        .subject-marks-container .no-marks { color: var(--muted); font-size: 12px; padding: 4px 0; width: 100%; text-align: center; }

        .identity-popup {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 16px;
            right: 16px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 1001;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(20px);
            background: rgba(30, 41, 59, 0.95);
        }
        .identity-popup.open { display: block; }
        .identity-popup .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .identity-popup .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
        .identity-popup .actions { display: flex; gap: 10px; margin-top: 12px; }
        .identity-popup .actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        function getBoundStudent() {
            if (!userId) return null;
            return BINDINGS[userId] || null;
        }
        function findStudentByName(name) {
            if (!name) return null;
            let found = ALL_DATA.journal.find(s => s.studentName === name);
            if (found) return found;
            const lastName = name.split(' ')[0];
            found = ALL_DATA.journal.find(s => s.studentName && s.studentName.startsWith(lastName));
            return found || null;
        }
        function isExamSubject(subjectName) {
            if (!subjectName) return false;
            const name = subjectName.toLowerCase().trim();
            return EXAM_SUBJECTS.some(exam => name.includes(exam.toLowerCase()) || exam.toLowerCase().includes(name));
        }
        function calculateAverage(marks) {
            if (!marks || marks.length === 0) return null;
            let sum = 0, count = 0;
            for (const m of marks) {
                const val = parseFloat(String(m).replace(',', '.'));
                if (!isNaN(val) && val > 0) { sum += val; count++; }
            }
            if (count === 0) return null;
            const avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        function calculateTotalAverage(subjects) {
            if (!subjects || subjects.length === 0) return null;
            let sum = 0, count = 0;
            for (const sub of subjects) {
                if (sub.avg && sub.avg !== '—') {
                    const val = parseFloat(String(sub.avg).replace(',', '.'));
                    if (!isNaN(val) && val > 0) { sum += val; count++; }
                }
            }
            if (count === 0) return null;
            const avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        function getStyleForScore(score) {
            if (!score || score === '—' || score === '0,0') return 'm-none';
            const v = parseFloat(String(score).replace(',', '.'));
            if (isNaN(v)) return 'm-none';
            if (v >= 9.5) return 'm-gold';
            if (v >= 7.5) return 'm-high';
            if (v >= 5) return 'm-warn';
            return 'm-low';
        }
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }
        function getGroup(name) { return '86РТК'; }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function notifyOwner(userId, studentName) {
            const message = '🔔 <b>Новая привязка!</b>\n\n' +
                '👤 Студент: <b>' + escapeHtml(studentName) + '</b>\n' +
                '🆔 Telegram ID: <code>' + userId + '</code>\n\n' +
                'Для привязки добавьте в BINDINGS:\n' +
                '<code>\'' + userId + '\' : \'' + escapeHtml(studentName) + '\'</code>';
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: OWNER_CHAT_ID, text: message, parse_mode: 'HTML' })
            }).then(r => r.json()).then(data => {
                if (data.ok) console.log('✅ Уведомление отправлено');
                else console.error('❌ Ошибка:', data);
            }).catch(e => console.error('❌ Ошибка:', e));
        }
        function updateAdminRecipients() {
            const select = document.getElementById('adminRecipient');
            const currentValue = select.value;
            select.innerHTML = '<option value="all">📢 Всем студентам</option>';
            const boundStudents = Object.keys(BINDINGS).map(id => ({ id, name: BINDINGS[id] }));
            boundStudents.sort((a, b) => a.name.localeCompare(b.name));
            boundStudents.forEach(s => {
                const option = document.createElement('option');
                option.value = s.name;
                option.textContent = '👤 ' + s.name;
                select.appendChild(option);
            });
            if (currentValue) select.value = currentValue;
        }
        function sendMessageToStudents(text, recipient) {
            const statusEl = document.getElementById('adminStatus');
            statusEl.textContent = '⏳ Отправка...';
            statusEl.className = 'admin-status';
            let students = [];
            if (recipient === 'all') {
                students = Object.keys(BINDINGS).map(id => ({ id, name: BINDINGS[id] }));
            } else {
                const boundId = Object.keys(BINDINGS).find(id => BINDINGS[id] === recipient);
                if (boundId) students = [{ id: boundId, name: recipient }];
            }
            students = students.filter(s => s.id !== OWNER_CHAT_ID);
            if (students.length === 0) {
                statusEl.textContent = '❌ Нет получателей';
                statusEl.className = 'admin-status error';
                return;
            }
            const msg = '📢 ' + escapeHtml(text) + '\n\n━━━━━━━━━━━━━━\n📱 Журнал 86РТК';
            let sent = 0, failed = 0, errors = [];
            const promises = students.map(s => {
                const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: s.id, text: msg, parse_mode: 'HTML', disable_web_page_preview: true })
                }).then(r => r.json()).then(data => {
                    if (data.ok) { sent++; console.log('✅ Отправлено:', s.name); }
                    else { failed++; errors.push(s.name + ': ' + (data.description || 'Неизвестная ошибка')); console.error('❌ Ошибка:', s.name, data); }
                }).catch(err => { failed++; errors.push(s.name + ': ' + err.message); console.error('❌ Ошибка сети:', s.name, err); });
            });
            Promise.all(promises).then(() => {
                if (failed === 0) {
                    statusEl.textContent = '✅ Отправлено ' + sent + ' студентам!';
                    statusEl.className = 'admin-status success';
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    let errorText = '⚠️ Отправлено ' + sent + ', ошибок: ' + failed;
                    if (errors.length > 0) errorText += '\n' + errors.join('\n');
                    statusEl.textContent = errorText;
                    statusEl.className = 'admin-status error';
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
                setTimeout(() => { document.getElementById('adminMessage').value = ''; }, 5000);
            });
        }

                return;

            const student = findStudentByName(studentName);

                container.innerHTML = '<div class="student-card"><div class="card-close" onclick="closeCard()">✕</div><div style="text-align:center;padding:40px 20px;color:var(--muted);">Студент не найден</div></div>';
                return;
            }
            const isBound = userId && getBoundStudent() === student.studentName;
            const absCount = ALL_DATA.absences[student.studentName] || '0';
            const totalAvg = student.totalAverage || '—';
            const avgNum = parseFloat(String(totalAvg).replace(',', '.'));
            let avgClass = 'gold';
            if (isNaN(avgNum)) avgClass = 'gold';
            else if (avgNum >= 7.5) avgClass = 'gold';
            else if (avgNum >= 5) avgClass = 'orange';
            else avgClass = 'red';
            const sorted = ALL_DATA.journal.filter(s => s && s.studentName).sort((a, b) => a.studentName.localeCompare(b.studentName));
            const idx = sorted.findIndex(s => s.studentName === student.studentName) + 1;
            const studentId = String(idx).padStart(3, '0');
            const icons = ['📐','💻','⚡','🔌','🏭','📡','🔧','📊','🎯','🧮','📈','🔬'];
            const colors = ['blue','pink','purple','green','orange','blue','pink','purple','green','orange','blue','pink'];
            let subjectsHtml = '';
            if (student.subjects && Array.isArray(student.subjects)) {
                student.subjects.forEach((sub, i) => {
                    const isExam = isExamSubject(sub.subject);
                    const avg = sub.avg || '—';
                    const num = parseFloat(String(avg).replace(',', '.'));
                    let sc = 'gray';
                    if (!isNaN(num)) { if (num >= 7.5) sc = 'gold'; else if (num >= 5) sc = 'orange'; else sc = 'red'; }
                    let marksHtml = '';

                        marksHtml = sub.marks.map(m => {
                            const n = parseFloat(String(m).replace(',', '.'));
                            let bg = '#475569';
                            if (!isNaN(n)) { if (n >= 7.5) bg = '#10b981'; else if (n >= 5) bg = '#f59e0b'; else bg = '#ef4444'; }

                        }).join('');
                    } else { marksHtml = '<span class="no-marks">Нет оценок</span>'; }
                    const id = 'm_' + i + '_' + Math.random().toString(36).substr(2, 4);
                    subjectsHtml += 
                        '<div class="subject-row ' + (isExam ? 'exam' : '') + '" onclick="toggleMarks(\'' + id + '\')">' +

                            '<div class="subject-info"><div class="subject-name">' + escapeHtml(sub.subject || 'Без названия') + (isExam ? ' <span class="exam-badge">📝 Экзамен</span>' : '') + '</div></div>' +
                            '<div class="subject-score ' + sc + '">' + avg + '</div>' +
                        '</div>' +
                        '<div class="subject-marks-container" id="' + id + '">' + marksHtml + '</div>';
                });
            }
            const subjectsCount = student.subjects ? student.subjects.length : 0;
            const statusText = avgNum >= 9 ? '🏆 Отлично' : avgNum >= 7.5 ? '✅ Хорошо' : avgNum >= 5 ? '⚠️ Удовлетворительно' : '❌ Требуется внимание';
            const badge = isBound ? '<span class="card-user-badge">✅ Вы</span>' : '';

                '<div class="student-card">' +
                    '<div class="card-close" onclick="closeCard()">✕</div>' +

                        '<div class="card-user">' +
                            '<div class="card-user-info">' +
                                '<div class="card-user-name">' + escapeHtml(student.studentName) + ' ' + badge + '</div>' +
                                '<div class="card-user-meta">' +
                                    '<span class="tag">' + getGroup(student.studentName) + '</span>' +
                                    '<span>• ID: #' + studentId + '</span>' +
                                    '<span>• ' + subjectsCount + ' предметов</span>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="card-stats">' +
                            '<div class="stat-circle ' + avgClass + '">' + totalAvg + '</div>' +
                            '<div class="stat-info">' +
                                '<div class="stat-label">Средний балл</div>' +

        // 8. РЕНДЕРИНГ ЖУРНАЛА
        // ============================================================
        function renderJournal() {
            const container = document.getElementById('list');
            if (!container) return;
            container.innerHTML = '';
            const query = document.getElementById('search')?.value.toLowerCase().trim() || '';
            if (!ALL_DATA.journal || ALL_DATA.journal.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных</div>';
                return;
            }
            const filteredStudents = ALL_DATA.journal.filter(s => s && s.studentName);
            const sortedByTotal = [...filteredStudents].sort((a, b) => {
                const avgA = parseFloat(String(a.totalAverage).replace(',', '.'));
                const avgB = parseFloat(String(b.totalAverage).replace(',', '.'));
                if (isNaN(avgA)) return 1;
                if (isNaN(avgB)) return -1;
                return avgB - avgA;
            });
            const topNames = sortedByTotal.slice(0, 3).map(s => s.studentName);
            const crowns = ['🥇', '🥈', '🥉'];
            const list = filteredStudents
                .filter(s => s && s.studentName && s.studentName.toLowerCase().includes(query))
                .sort((a, b) => a.studentName.localeCompare(b.studentName));
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                return;
            }
            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card';
                const absCount = ALL_DATA.absences[s.studentName] || '0';
                const tIdx = topNames.indexOf(s.studentName);
                const isBoundToMe = userId && getBoundStudent() === s.studentName;
                let subsHtml = '';
                if (s.subjects && Array.isArray(s.subjects)) {
                    subsHtml = s.subjects.map(sub => {
                        const isExam = isExamSubject(sub.subject);
                        let marksHtml = '';
                        if (sub.marks && Array.isArray(sub.marks) && sub.marks.length > 0) {
                            marksHtml = sub.marks.map(m => '<div class="mark ' + getStyleForScore(m) + '">' + m + '</div>').join('');
                        } else {
                            marksHtml = '<div style="font-size:10px; opacity:0.4; padding:6px;">Нет отметок</div>';
                        }
                        const avgDisplay = sub.avg && sub.avg !== '—' ? sub.avg : '—';
                        const examClass = isExam ? 'exam-subject' : '';
                        const tooltipId = 'tooltip_' + Math.random().toString(36).substr(2, 9);
                        const examIcon = isExam ? '<span class="exam-icon">!</span>' : '';
                        const tooltipHtml = isExam ? 
                            '<div class="exam-tooltip" id="' + tooltipId + '">' +
                                '<div class="tooltip-title">📝 Экзаменационный предмет</div>' +
                                '<div class="tooltip-text">Итоговая отметка может <strong>отличаться</strong> от текущей успеваемости и выставляется по результатам экзамена.</div>' +
                                '<div class="tooltip-hint">Нажмите на подсказку, чтобы скрыть</div>' +
                            '</div>' : '';
                        return '<div class="sub-item ' + examClass + '" data-tooltip="' + tooltipId + '" data-tooltip-shown="false">' +
                            '<div class="sub-row">' +
                                '<div class="subject-name-wrapper">' +
                                    '<span>' + escapeHtml(sub.subject || 'Без названия') + '</span>' +
                                    examIcon +
                                '</div>' +
                                '<span class="score-pill ' + getStyleForScore(avgDisplay) + '">' + avgDisplay + '</span>' +
                            '</div>' +
                            '<div class="marks-box">' +
                                '<div class="marks-row">' + marksHtml + '</div>' +
                            '</div>' +
                            tooltipHtml +
                        '</div>';
                    }).join('');
                } else {
                    subsHtml = '<div style="font-size:11px; opacity:0.4; text-align:center; padding:10px;">Нет предметов</div>';
                }
                const totalDisplay = s.totalAverage && s.totalAverage !== '—' ? s.totalAverage : '—';
                const identityBadge = isBoundToMe ? 
                    '<span style="font-size:9px;background:var(--success);color:white;padding:1px 8px;border-radius:10px;margin-left:6px;">✅ Вы</span>' : '';
                card.innerHTML = 
                    '<div class="student-header">' +
                        '<span class="student-name">' +
                            escapeHtml(s.studentName) + ' ' + (tIdx !== -1 ? crowns[tIdx] : '') +

                            identityBadge +
                        '</span>' +

                    '</div>' +

                    };

            });
            document.querySelectorAll('.sub-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const marksBox = this.querySelector('.marks-box');
                    if (marksBox) marksBox.classList.toggle('open');
                    if (this.classList.contains('exam-subject')) {
                        const tooltipId = this.dataset.tooltip;

                            tooltip.classList.add('open');

                                e.stopPropagation();

        // ============================================================
        // 11. ЗАГРУЗКА ДАННЫХ
        // ============================================================
        function loadData() {
            if (isLoading) return;
            isLoading = true;
            isDataLoaded = false;
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            hideError();
            loaderStatus.textContent = 'Загрузка журнала';
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data.journal && data.journal.length > 0) {
                        ALL_DATA = data;
                        processAllAverages();
                        isDataLoaded = true;
                        renderJournal();
                        updateProfileButton();
                        if (isAdmin) updateAdminRecipients();
                        hideLoader();
                        isLoading = false;
                        console.log('✅ Загружено из кеша');
                    }
                }
            } catch(e) { console.warn('Ошибка чтения кеша:', e); }
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            Promise.all([
                fetch(API_JOURNAL, { signal: controller.signal }).then(r => r.json()),
                fetch(API_ABSENCES, { signal: controller.signal }).then(r => r.json())
            ]).then(([resJ, resA]) => {
                clearTimeout(timeoutId);
                const absMap = {};
                if (Array.isArray(resA)) {
                    resA.forEach(a => { if (a && a.name) absMap[a.name.trim()] = a.count || '0'; });
                }
                let journalData = [];
                if (Array.isArray(resJ)) journalData = resJ;
                else if (resJ && resJ.journal && Array.isArray(resJ.journal)) journalData = resJ.journal;
                else if (resJ && !resJ.error) journalData = resJ;
                if (!journalData.length) throw new Error('Нет данных');
                ALL_DATA = { journal: journalData, absences: absMap };
                processAllAverages();
                localStorage.setItem(CACHE_KEY, JSON.stringify(ALL_DATA));
                isDataLoaded = true;
                renderJournal();
                updateProfileButton();
                if (isAdmin) updateAdminRecipients();
                if (loader.style.display !== 'none') hideLoader();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                console.log('✅ Загружено с сервера');
                isLoading = false;
            }).catch(e => {
                clearTimeout(timeoutId);
                console.error('Ошибка загрузки с сервера:', e);
                if (isDataLoaded && ALL_DATA.journal.length > 0) {
                    console.log('📦 Использую кеш');
                    isLoading = false;
                    return;
                }
                showError('Проверьте подключение к интернету');
                isLoading = false;
            });
        }
        function processAllAverages() {
            ALL_DATA.journal.forEach(student => {
                if (student.subjects && Array.isArray(student.subjects)) {
                    student.subjects.forEach(subject => {
                        const calculatedAvg = calculateAverage(subject.marks);
                        subject.avg = calculatedAvg || '—';
                    });
                    const totalAvg = calculateTotalAverage(student.subjects);
                    student.totalAverage = totalAvg || '—';
                }
            });
        }
        function forceUpdate() {
            localStorage.removeItem(CACHE_KEY);
            if (document.getElementById('cardOverlay').classList.contains('open')) closeCard();
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            document.getElementById('main-content').classList.remove('visible');
            loadData();
        }
        function hideLoader() {
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('main-content');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                mainContent.classList.add('visible');
            }, 400);
        }

        document.getElementById('search').addEventListener('input', renderJournal);
        document.getElementById('fabUpdate').addEventListener('click', forceUpdate);
        document.getElementById('retryButton').addEventListener('click', forceUpdate);

        // Навигация
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const tabId = this.dataset.tab;
                switchTab(tabId);
            });
        });

        // Расписание
        document.getElementById('scheduleRefreshBtn').addEventListener('click', function() {
            loadSchedule();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Админ-панель
        document.getElementById('adminFab').addEventListener('click', function() {
            document.getElementById('adminPanel').classList.add('open');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });
        document.getElementById('closeAdmin').addEventListener('click', function() {
            document.getElementById('adminPanel').classList.remove('open');
        });
        document.getElementById('adminCancel').addEventListener('click', function() {
            document.getElementById('adminPanel').classList.remove('open');
            document.getElementById('adminMessage').value = '';
            document.getElementById('adminStatus').textContent = '';
            document.getElementById('adminStatus').className = 'admin-status';
        });
        document.getElementById('adminSend').addEventListener('click', function() {
            const message = document.getElementById('adminMessage').value.trim();
            const recipient = document.getElementById('adminRecipient').value;
            if (!message) {
                const statusEl = document.getElementById('adminStatus');
                statusEl.textContent = '❌ Введите сообщение';
                statusEl.className = 'admin-status error';
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            if (recipient === 'all') {
                if (tg) {
                    tg.showPopup({
                        title: '⚠️ Подтверждение',
                        message: 'Отправить сообщение ВСЕМ студентам?',
                        buttons: [{ id: 'cancel', type: 'cancel' }, { id: 'ok', type: 'ok' }]
                    }, function(buttonId) {
                        if (buttonId === 'ok') sendMessageToStudents(message, recipient);
                    });
                } else {
                    if (confirm('Отправить сообщение ВСЕМ студентам?')) sendMessageToStudents(message, recipient);
                }
            } else {
                sendMessageToStudents(message, recipient);
            }
        });
        document.getElementById('templateNewScores').addEventListener('click', function() {
            document.getElementById('adminMessage').value = '📊 Выставлены новые баллы, проверьте журнал!';
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Авторизация
        document.getElementById('btnIdentityYes').addEventListener('click', function() {
            if (!selectedStudentForIdentity) {
                if (tg) {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('❌ Выберите свою фамилию из списка.');
                } else alert('❌ Выберите свою фамилию из списка.');
                return;
            }
            document.getElementById('identityPopup').classList.remove('open');
            if (!userId) {
                if (tg) tg.showAlert('❌ Ошибка: не удалось определить пользователя');
                return;
            }
            notifyOwner(userId, selectedStudentForIdentity);
            if (tg) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert('✅ Запрос отправлен! Ожидайте подтверждения.');
            } else alert('✅ Запрос отправлен!');
            selectedStudentForIdentity = null;
            document.querySelectorAll('.student-item').forEach(el => {
                el.style.background = 'transparent';
                el.style.border = 'none';
            });
            document.getElementById('popupSubText').textContent = 'Выберите свою фамилию из списка:';
        });
        document.getElementById('btnIdentityNo').addEventListener('click', function() {
            document.getElementById('identityPopup').classList.remove('open');
            selectedStudentForIdentity = null;
            document.querySelectorAll('.student-item').forEach(el => {
                el.style.background = 'transparent';
                el.style.border = 'none';
            });
            document.getElementById('popupSubText').textContent = 'Выберите свою фамилию из списка:';
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });
        document.addEventListener('click', function(e) {
            const popup = document.getElementById('identityPopup');
            if (popup.classList.contains('open')) {
                if (!popup.contains(e.target)) {
                    popup.classList.remove('open');
                    selectedStudentForIdentity = null;
                    document.querySelectorAll('.student-item').forEach(el => {
                        el.style.background = 'transparent';
                        el.style.border = 'none';
                    });
                    document.getElementById('popupSubText').textContent = 'Выберите свою фамилию из списка:';
                }
            }
        });
        if (tg) {
            tg.onEvent('backButtonClicked', function() {
                if (document.getElementById('cardOverlay').classList.contains('open')) {
                    closeCard();
                } else if (document.getElementById('adminPanel').classList.contains('open')) {
                    document.getElementById('adminPanel').classList.remove('open');
                } else if (document.getElementById('tabSchedule').classList.contains('active')) {
                    switchTab('tabJournal');
                } else {
                    tg.close();
                }
            });
        }

        // ============================================================
        // 15. ЗАПУСК
        // ============================================================
        window.openCard = openCard;
        window.closeCard = closeCard;
        window.toggleMarks = toggleMarks;

        loadData();
    </script>
</body>
</html>
