<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание 86РТК</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --success: #10b981;
            --schedule-day-bg: rgba(56, 189, 248, 0.06);
            --schedule-border: rgba(56, 189, 248, 0.12);
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { padding: 16px; padding-bottom: 30px; }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span { font-size: 24px; }
        .header .group-label {
            background: rgba(56, 189, 248, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .header .week-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            width: 100%;
        }
        .header .status-badge {
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
        }
        .header .status-badge.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .header .status-badge.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }
        .header .status-badge.loading {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
        }
        .header .status-badge.fallback {
            background: rgba(139, 92, 246, 0.15);
            color: #8b5cf6;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 12px;
        }
        .controls button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 6px 14px;
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .controls button:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.08);
        }
        .controls button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .schedule-loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-loader .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .schedule-error {
            text-align: center;
            padding: 30px 20px;
            color: var(--error);
            font-size: 13px;
        }
        .schedule-error .error-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .schedule-error .retry-btn {
            margin-top: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 24px;
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
        .schedule-error .retry-btn:active { transform: scale(0.95); }

        .schedule-day {
            margin-bottom: 14px;
            background: var(--schedule-day-bg);
            border-radius: 14px;
            border: 1px solid var(--schedule-border);
            overflow: hidden;
        }
        .schedule-day-header {
            padding: 12px 16px 10px;
            background: rgba(56, 189, 248, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--schedule-border);
            flex-wrap: wrap;
        }
        .schedule-day-header .day-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .schedule-day-header .day-date {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
        }
        .schedule-day-header .day-badge {
            margin-left: auto;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }
        .schedule-day-header .day-badge.today {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .schedule-day-header .day-badge.weekend {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .schedule-lesson {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: background 0.15s;
        }
        .schedule-lesson:last-child { border-bottom: none; }
        .schedule-lesson:active { background: rgba(255,255,255,0.03); }

        .schedule-lesson .lesson-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            min-width: 36px;
            padding-top: 1px;
        }
        .schedule-lesson .lesson-info {
            flex: 1;
            min-width: 0;
        }
        .schedule-lesson .lesson-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }
        .schedule-lesson .lesson-subgroup {
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            background: rgba(251, 191, 36, 0.12);
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-left: 6px;
        }
        .schedule-lesson .lesson-details {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .schedule-lesson .lesson-details .detail-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .schedule-lesson .lesson-details .detail-item .icon {
            font-size: 11px;
        }
        .schedule-lesson .lesson-details .detail-item .type-badge {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.lecture {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.practice {
            background: rgba(251, 191, 36, 0.12);
            color: var(--gold);
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.lab {
            background: rgba(244, 114, 182, 0.12);
            color: #f472b6;
        }

        .schedule-empty {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-empty .empty-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .debug-log {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 11px;
            color: var(--muted);
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .debug-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .debug-log .log-entry:last-child { border-bottom: none; }
        .debug-log .log-entry .time {
            color: var(--muted);
            opacity: 0.5;
        }
        .debug-log .log-entry.success { color: var(--success); }
        .debug-log .log-entry.error { color: var(--error); }
        .debug-log .log-entry.info { color: var(--accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1><span>📅</span> Расписание</h1>
            <span class="week-label" id="weekLabel">Загрузка...</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="group-label">Группа 86</span>
            <span class="status-badge loading" id="statusBadge">⏳ Загрузка...</span>
        </div>
    </div>

    <div class="controls">
        <button id="refreshBtn">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Обновить</span>
        </button>
    </div>

    <div id="scheduleContent">
        <div class="schedule-loader">
            <div class="spinner"></div>
            <span>Загрузка расписания...</span>
        </div>
    </div>

    <div class="debug-log" id="debugLog">
        <div class="log-entry info"><span class="time">[⏳]</span> Ожидание загрузки...</div>
    </div>

    <script>
        // ============================================================
        // 1. НАСТРОЙКИ
        // ============================================================
        const SCHEDULE_URL = 'https://mgkct.minskedu.gov.by/personnel/for-students/weekly-timetable?group=86';
        const DAYS_RU = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
        const SCHEDULE_CACHE_KEY = 'schedule_test_v1';

        // ============================================================
        // 2. ЛОГГЕР
        // ============================================================
        function addLog(message, type = 'info') {
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============================================================
        // 3. ПАРСИНГ
        // ============================================================
        function parseLessonContent(content, pairNum) {
            if (!content || content.trim() === '') return null;
            
            let discipline = content;
            let lessonType = '';
            let teacher = '';
            let room = '';
            let subgroup = '';
            
            const subgroupMatch = content.match(/^(\d+)\./);
            if (subgroupMatch) {
                subgroup = subgroupMatch[1];
                discipline = discipline.replace(/^\d+\.\s*/, '').trim();
            }
            
            const roomMatch = content.match(/(Кн\.?\s*[\d\-()]+|[\d\-]+\(?[к\)]?)/i);
            if (roomMatch) {
                room = roomMatch[0];
                discipline = discipline.replace(roomMatch[0], '').trim();
            }
            
            const teacherMatch = discipline.match(/\(([^)]+)\)/);
            if (teacherMatch) {
                const parts = teacherMatch[1].split(/\s+/);
                if (parts.length >= 2) {
                    teacher = teacherMatch[1];
                    discipline = discipline.replace(teacherMatch[0], '').trim();
                }
            }
            
            const typeMatch = discipline.match(/\(([^)]+)\)/);
            if (typeMatch) {
                const type = typeMatch[1].trim();
                const typeMap = {
                    'Лек': 'лекция',
                    'ЛР': 'лабораторная',
                    'ПР': 'практика',
                    'Лекция': 'лекция',
                    'Лабораторная': 'лабораторная',
                    'Практика': 'практика'
                };
                lessonType = typeMap[type] || type;
                discipline = discipline.replace(typeMatch[0], '').trim();
            }
            
            discipline = discipline.replace(/[,\-–\s]+$/, '').trim();
            
            return {
                pair: pairNum,
                discipline: discipline || content,
                type: lessonType,
                teacher: teacher,
                room: room,
                subgroup: subgroup
            };
        }

        function parseScheduleTable(table) {
            const rows = table.querySelectorAll('tr');
            addLog(`Найдено строк в таблице: ${rows.length}`, 'info');
            
            if (rows.length < 3) {
                addLog('❌ Таблица слишком маленькая', 'error');
                return null;
            }
            
            const headerRow = rows[1];
            const dayCells = headerRow.querySelectorAll('td, th');
            const days = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const schedule = {};
            days.forEach(day => { schedule[day] = []; });
            
            addLog(`Найдено дней: ${dayCells.length - 1}`, 'info');
            
            for (let i = 2; i < rows.length; i++) {
                const row = rows[i];
                const cells = row.querySelectorAll('td');
                if (cells.length < 2) continue;
                
                const pairNum = cells[0].textContent.trim();
                if (!pairNum || pairNum === '') continue;
                
                for (let d = 0; d < Math.min(dayCells.length - 1, cells.length - 1); d++) {
                    const cell = cells[d + 1];
                    const content = cell.textContent.trim();
                    
                    if (content && content !== '' && content !== '-') {
                        const lesson = parseLessonContent(content, pairNum);
                        if (lesson) {
                            const dayName = days[d] || 'Неизвестно';
                            schedule[dayName].push(lesson);
                            addLog(`✅ Пара ${pairNum}: ${lesson.discipline} (${dayName})`, 'success');
                        }
                    }
                }
            }
            
            return schedule;
        }

        function parseScheduleHTML(html) {
            addLog('🔍 Начинаем парсинг HTML...', 'info');
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // Ищем заголовок группы 86
            let targetSection = null;
            const headings = doc.querySelectorAll('h2');
            for (const h2 of headings) {
                const text = h2.textContent.trim();
                if (text.includes('Группа - 86')) {
                    targetSection = h2;
                    addLog(`✅ Найден заголовок: "${text}"`, 'success');
                    break;
                }
            }
            
            if (!targetSection) {
                addLog('❌ Заголовок "Группа - 86" не найден', 'error');
                // Пробуем найти по тексту
                const bodyText = doc.body.textContent;
                if (bodyText.includes('Группа - 86')) {
                    addLog('⚠️ Заголовок найден в тексте, пробуем извлечь...', 'info');
                    // Ищем таблицу после "Группа - 86" в тексте
                    const regex = /Группа - 86([\s\S]*?)(?:Группа -|$)/i;
                    const match = bodyText.match(regex);
                    if (match) {
                        addLog('📄 Извлекаем расписание из текста', 'info');
                        return parseTextSchedule(match[1]);
                    }
                }
                throw new Error('Расписание для группы 86 не найдено');
            }
            
            // Ищем таблицу
            let table = targetSection.nextElementSibling;
            while (table && table.tagName !== 'TABLE') {
                table = table.nextElementSibling;
            }
            
            if (!table) {
                addLog('❌ Таблица не найдена', 'error');
                throw new Error('Таблица расписания не найдена');
            }
            
            addLog('✅ Таблица найдена, парсим...', 'success');
            return parseScheduleTable(table);
        }

        function parseTextSchedule(text) {
            const schedule = {
                'Понедельник': [],
                'Вторник': [],
                'Среда': [],
                'Четверг': [],
                'Пятница': [],
                'Суббота': []
            };
            
            const lines = text.split('\n').filter(line => line.trim() !== '');
            let currentDay = null;
            let pairCounter = 0;
            
            for (const line of lines) {
                const trimmed = line.trim();
                const dayMatch = trimmed.match(/^(Понедельник|Вторник|Среда|Четверг|Пятница|Суббота)/i);
                if (dayMatch) {
                    currentDay = dayMatch[1];
                    pairCounter = 0;
                    addLog(`📅 День: ${currentDay}`, 'info');
                    continue;
                }
                
                if (currentDay && /^\d/.test(trimmed)) {
                    const parts = trimmed.split(/\s+/);
                    const pairNum = parts[0];
                    const rest = parts.slice(1).join(' ');
                    const lesson = parseLessonContent(rest, pairNum);
                    if (lesson) {
                        schedule[currentDay].push(lesson);
                        pairCounter++;
                        addLog(`  Пара ${pairNum}: ${lesson.discipline}`, 'success');
                    }
                }
            }
            
            addLog(`📊 Всего пар найдено: ${Object.values(schedule).reduce((a, b) => a + b.length, 0)}`, 'info');
            return schedule;
        }

        // ============================================================
        // 4. ОТОБРАЖЕНИЕ
        // ============================================================
        function renderSchedule(schedule, sourceType) {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            const weekLabel = document.getElementById('weekLabel');
            
            if (!schedule || !Object.values(schedule).some(arr => arr.length > 0)) {
                container.innerHTML = `
                    <div class="schedule-empty">
                        <span class="empty-icon">📭</span>
                        <span>Расписание не найдено</span>
                    </div>
                `;
                statusBadge.textContent = '❌ Ошибка';
                statusBadge.className = 'status-badge error';
                return;
            }
            
            // Статус
            if (sourceType === 'live') {
                statusBadge.textContent = '✅ С сервера';
                statusBadge.className = 'status-badge success';
                addLog('✅ Отображение: данные с сервера', 'success');
            } else if (sourceType === 'cache') {
                statusBadge.textContent = '💾 Из кеша';
                statusBadge.className = 'status-badge success';
                addLog('💾 Отображение: данные из кеша', 'info');
            } else {
                statusBadge.textContent = '📋 Запасное';
                statusBadge.className = 'status-badge fallback';
                addLog('📋 Отображение: запасные данные', 'info');
            }
            
            // Даты недели
            const today = new Date();
            const weekDates = [];
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(today);
            monday.setDate(diff);
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
            }
            if (weekDates.length >= 2) {
                const start = weekDates[0].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                const end = weekDates[6].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                weekLabel.textContent = `${start} — ${end}`;
            }
            
            const todayIndex = today.getDay();
            const todayName = todayIndex === 0 ? 'Воскресенье' : DAYS_RU[todayIndex - 1];
            
            let html = '';
            let hasLessons = false;
            
            for (let i = 0; i < 6; i++) {
                const dayName = DAYS_RU[i];
                const lessons = schedule[dayName] || [];
                if (lessons.length === 0) continue;
                hasLessons = true;
                
                const isToday = dayName === todayName;
                const isWeekend = (i === 5);
                const dateStr = weekDates[i] ? weekDates[i].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) : '';
                
                html += `
                    <div class="schedule-day">
                        <div class="schedule-day-header">
                            <span class="day-name">${dayName}</span>
                            ${dateStr ? `<span class="day-date">${dateStr}</span>` : ''}
                            <span class="day-badge ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">${isToday ? 'СЕГОДНЯ' : isWeekend ? 'СУББОТА' : `${lessons.length} пар`}</span>
                        </div>
                `;
                
                lessons.forEach(lesson => {
                    const typeClass = lesson.type === 'лекция' ? 'lecture' : 
                                    lesson.type === 'лабораторная' ? 'lab' : 
                                    lesson.type === 'практика' ? 'practice' : '';
                    const typeLabel = lesson.type ? lesson.type.charAt(0).toUpperCase() + lesson.type.slice(1) : '';
                    const subgroupLabel = lesson.subgroup ? `1-${lesson.subgroup} подгруппа` : '';
                    
                    html += `
                        <div class="schedule-lesson">
                            <span class="lesson-time">${lesson.pair}</span>
                            <div class="lesson-info">
                                <div class="lesson-name">
                                    ${escapeHtml(lesson.discipline)}
                                    ${subgroupLabel ? `<span class="lesson-subgroup">${subgroupLabel}</span>` : ''}
                                </div>
                                <div class="lesson-details">
                                    ${lesson.teacher ? `<span class="detail-item"><span class="icon">👨‍🏫</span> ${escapeHtml(lesson.teacher)}</span>` : ''}
                                    ${lesson.room ? `<span class="detail-item"><span class="icon">🏛️</span> ${escapeHtml(lesson.room)}</span>` : ''}
                                    ${typeLabel ? `<span class="detail-item"><span class="type-badge ${typeClass}">${typeLabel}</span></span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            if (!hasLessons) {
                container.innerHTML = `
                    <div class="schedule-empty">
                        <span class="empty-icon">📭</span>
                        <span>На этой неделе занятий нет</span>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = html;
            addLog(`📊 Отображено ${Object.values(schedule).reduce((a, b) => a + b.length, 0)} пар`, 'info');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 5. ЗАГРУЗКА
        // ============================================================
        async function loadSchedule() {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            const weekLabel = document.getElementById('weekLabel');
            
            // Очищаем лог
            document.getElementById('debugLog').innerHTML = '';
            addLog('🚀 Начинаем загрузку расписания...', 'info');
            
            container.innerHTML = `
                <div class="schedule-loader">
                    <div class="spinner"></div>
                    <span>Загрузка расписания...</span>
                </div>
            `;
            weekLabel.textContent = 'Загрузка...';
            statusBadge.textContent = '⏳ Загрузка...';
            statusBadge.className = 'status-badge loading';
            
            // Сначала пробуем кеш
            try {
                const cached = localStorage.getItem(SCHEDULE_CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data && data.schedule && Object.values(data.schedule).some(arr => arr.length > 0)) {
                        const cacheAge = Date.now() - (data.timestamp || 0);
                        const hours = Math.round(cacheAge / 3600000);
                        addLog(`💾 Найден кеш (возраст: ${hours} ч)`, 'info');
                        renderSchedule(data.schedule, 'cache');
                        // Продолжаем загрузку свежих данных в фоне
                    }
                }
            } catch(e) {
                addLog(`⚠️ Ошибка чтения кеша: ${e.message}`, 'error');
            }
            
            // Пробуем загрузить свежие данные
            const proxies = [
                { url: 'https://api.allorigins.win/raw?url=', name: 'AllOrigins' },
                { url: 'https://corsproxy.io/?', name: 'CorsProxy' },
                { url: 'https://api.codetabs.com/v1/proxy?quest=', name: 'CodeTabs' }
            ];
            
            let html = null;
            let usedProxy = '';
            
            for (const proxy of proxies) {
                try {
                    addLog(`🔄 Пробуем ${proxy.name}...`, 'info');
                    const url = proxy.url + encodeURIComponent(SCHEDULE_URL);
                    const response = await fetch(url, {
                        signal: AbortSignal.timeout(8000),
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });
                    if (response.ok) {
                        const text = await response.text();
                        if (text.includes('Группа - 86')) {
                            html = text;
                            usedProxy = proxy.name;
                            addLog(`✅ ${proxy.name} сработал!`, 'success');
                            break;
                        } else {
                            addLog(`⚠️ ${proxy.name} вернул HTML без "Группа - 86"`, 'error');
                        }
                    } else {
                        addLog(`❌ ${proxy.name} вернул ${response.status}`, 'error');
                    }
                } catch(e) {
                    addLog(`❌ ${proxy.name} ошибка: ${e.message}`, 'error');
                }
            }
            
            // Если прокси не сработали — пробуем прямой запрос
            if (!html) {
                try {
                    addLog(`🔄 Пробуем прямой запрос...`, 'info');
                    const response = await fetch(SCHEDULE_URL, {
                        signal: AbortSignal.timeout(5000),
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                            'Accept': 'text/html,application/xhtml+xml',
                            'Accept-Language': 'ru-RU,ru;q=0.9'
                        }
                    });
                    if (response.ok) {
                        const text = await response.text();
                        if (text.includes('Группа - 86')) {
                            html = text;
                            usedProxy = 'Прямой запрос';
                            addLog(`✅ Прямой запрос сработал!`, 'success');
                        }
                    }
                } catch(e) {
                    addLog(`❌ Прямой запрос ошибка: ${e.message}`, 'error');
                }
            }
            
            // Если получили HTML — парсим
            if (html) {
                try {
                    addLog(`🔍 Парсинг HTML (${html.length} символов)...`, 'info');
                    const schedule = parseScheduleHTML(html);
                    if (schedule && Object.values(schedule).some(arr => arr.length > 0)) {
                        // Сохраняем в кеш
                        try {
                            localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify({
                                schedule: schedule,
                                timestamp: Date.now()
                            }));
                            addLog(`💾 Кеш сохранен`, 'success');
                        } catch(e) {
                            addLog(`⚠️ Не удалось сохранить кеш: ${e.message}`, 'error');
                        }
                        renderSchedule(schedule, 'live');
                        addLog(`✅ Готово! Загружено с ${usedProxy}`, 'success');
                        return;
                    } else {
                        addLog(`⚠️ Парсинг не дал результатов`, 'error');
                    }
                } catch(e) {
                    addLog(`❌ Ошибка парсинга: ${e.message}`, 'error');
                }
            }
            
            // Если ничего не сработало — проверяем, есть ли кеш
            try {
                const cached = localStorage.getItem(SCHEDULE_CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data && data.schedule && Object.values(data.schedule).some(arr => arr.length > 0)) {
                        addLog(`📦 Использую кеш (финальный)`, 'info');
                        renderSchedule(data.schedule, 'cache');
                        return;
                    }
                }
            } catch(e) {
                addLog(`⚠️ Ошибка чтения кеша: ${e.message}`, 'error');
            }
            
            // Всё плохо — показываем ошибку
            container.innerHTML = `
                <div class="schedule-error">
                    <span class="error-icon">⚠️</span>
                    <span>Не удалось загрузить расписание</span>
                    <br>
                    <span style="font-size:11px;color:var(--muted);">Попробуйте обновить или проверьте интернет</span>
                    <br>
                    <button class="retry-btn" onclick="loadSchedule()">🔄 Попробовать снова</button>
                </div>
            `;
            statusBadge.textContent = '❌ Ошибка';
            statusBadge.className = 'status-badge error';
            weekLabel.textContent = 'Ошибка загрузки';
            addLog(`❌ Все способы загрузки не сработали`, 'error');
        }

        // ============================================================
        // 6. ЗАПУСК
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadSchedule();
        });

        loadSchedule();
    </script>
</body>
</html>
