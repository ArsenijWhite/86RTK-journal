<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Журнал 86РТК</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --exam-color: #f472b6;
            --exam-bg: rgba(244, 114, 182, 0.12);
            --success: #10b981;
            --admin: #8b5cf6;
            --tab-inactive: #334155;
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { 
            padding: 16px; 
            padding-bottom: 100px; 
        }

        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }
        .logo-container { 
            position: relative; 
            width: 100px; 
            height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 30px; 
        }
        .logo-outline {
            position: absolute; 
            width: 100%; 
            height: 100%;
            border-radius: 50%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        #loader:not(.error-mode) .logo-container {
            animation: breatheContainer 2s ease-in-out infinite;
        }
        #loader:not(.error-mode) .logo-outline {
            border: 2px solid rgba(56, 189, 248, 0.15);
            border-top: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: spin 1.2s linear infinite;
        }
        #loader:not(.error-mode) .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            animation: breatheIcon 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        #loader.error-mode .logo-outline {
            border: 2px solid var(--error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: none;
        }
        #loader.error-mode .logo-icon {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: breatheIconError 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .logo-icon {
            width: 45px; 
            height: 60px; 
            border-radius: 5px 12px 12px 5px; 
            position: relative; 
            z-index: 2;
        }
        .logo-icon::before {
            content: ""; 
            position: absolute; 
            top: 12px; 
            left: 8px;
            width: 25px; 
            height: 3px; 
            background: rgba(255,255,255,0.5);
            border-radius: 2px; 
            box-shadow: 0 8px 0 rgba(255,255,255,0.5), 0 16px 0 rgba(255,255,255,0.5);
        }
        .loader-status { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--accent); 
            text-transform: uppercase; 
            letter-spacing: 0.3em; 
            margin-bottom: 25px;
        }
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
        }
        .error-container.visible { display: flex; }
        .error-message {
            font-size: 13px;
            font-weight: 500;
            color: var(--error);
            text-align: center;
            margin-bottom: 20px;
        }
        .retry-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .copyright {
            position: absolute;
            bottom: 25px;
            font-size: 9px;
            color: rgba(255,255,255,0.08);
        }

        @keyframes breatheContainer {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.98); }
        }
        @keyframes breatheIcon {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        @keyframes breatheIconError {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #main-content { 
            opacity: 0; 
            transition: 0.5s; 
            display: none;
        }
        #main-content.visible {
            display: block;
            opacity: 1;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active { display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 env(safe-area-inset-bottom) 0;
            z-index: 1000;
            height: 64px;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 16px;
            border: none;
            background: transparent;
            color: var(--tab-inactive);
            transition: color 0.2s ease;
            position: relative;
            flex: 1;
        }
        .bottom-nav .nav-item:active { transform: scale(0.95); }
        .bottom-nav .nav-item.active { color: var(--accent); }
        .bottom-nav .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .bottom-nav .nav-item .nav-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .schedule-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .schedule-header h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .schedule-header .schedule-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .schedule-header .schedule-logo .calendar-icon {
            width: 28px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-radius: 4px;
            position: relative;
            display: inline-block;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .schedule-header .schedule-logo .calendar-icon::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px 2px 0 0;
        }
        .schedule-header .schedule-logo .calendar-icon::after {
            content: "86";
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 800;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }
        .schedule-header .week-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
        }

        .schedule-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .schedule-controls button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 8px 16px;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .schedule-controls button:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.08);
        }
        .schedule-controls button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .schedule-controls button.active {
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(56, 189, 248, 0.08);
        }

        .schedule-loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-loader .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .schedule-error {
            text-align: center;
            padding: 30px 20px;
            color: var(--error);
            font-size: 13px;
        }
        .schedule-error .error-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .schedule-error .retry-btn {
            margin-top: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 24px;
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
        .schedule-error .retry-btn:active { transform: scale(0.95); }

        .schedule-day {
            margin-bottom: 14px;
            background: rgba(56, 189, 248, 0.06);
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.12);
            overflow: hidden;
        }
        .schedule-day-header {
            padding: 12px 16px 10px;
            background: rgba(56, 189, 248, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
            flex-wrap: wrap;
        }
        .schedule-day-header .day-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .schedule-day-header .day-date {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
        }
        .schedule-day-header .day-badge {
            margin-left: auto;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }
        .schedule-day-header .day-badge.today {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .schedule-day-header .day-badge.weekend {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .schedule-lesson {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: background 0.15s;
        }
        .schedule-lesson:last-child { border-bottom: none; }
        .schedule-lesson:active { background: rgba(255,255,255,0.03); }

        .schedule-lesson .lesson-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            min-width: 36px;
            padding-top: 2px;
        }
        .schedule-lesson .lesson-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .schedule-lesson .lesson-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }
        .schedule-lesson .lesson-subgroup {
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            background: rgba(251, 191, 36, 0.12);
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
            width: auto;
            max-width: fit-content;
        }
        .schedule-lesson .lesson-meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .schedule-lesson .lesson-meta-row .room-badge {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .schedule-lesson .lesson-meta-row .room-badge .icon { font-size: 10px; }
        .schedule-lesson .lesson-meta-row .type-badge {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .schedule-lesson .lesson-meta-row .type-badge.lecture {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.15);
        }
        .schedule-lesson .lesson-meta-row .type-badge.practice {
            background: rgba(251, 191, 36, 0.12);
            color: var(--gold);
            border-color: rgba(251, 191, 36, 0.15);
        }
        .schedule-lesson .lesson-meta-row .type-badge.lab {
            background: rgba(244, 114, 182, 0.12);
            color: #f472b6;
            border-color: rgba(244, 114, 182, 0.15);
        }

        .schedule-lesson .lesson-teachers {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 1px;
        }
        .schedule-lesson .lesson-teachers .teacher-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 600;
            background: rgba(139, 92, 246, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(139, 92, 246, 0.15);
            text-transform: none;
            letter-spacing: 0.3px;
        }
        .schedule-lesson .lesson-teachers .teacher-item .teacher-icon { font-size: 10px; opacity: 0.7; }
        .schedule-lesson .lesson-teachers .teacher-item .teacher-name { font-weight: 400; }

        .schedule-empty {
            text-align: center;
            padding: 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-empty .empty-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
            opacity: 0.5;
        }

        .admin-panel {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 16px;
            right: 16px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--admin);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 1002;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(20px);
            background: rgba(30, 41, 59, 0.95);
            max-height: 85vh;
            overflow-y: auto;
        }
        .admin-panel.open { display: block; }
        .admin-panel .admin-title {
            color: var(--admin);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .admin-title .close-admin {
            margin-left: auto;
            color: var(--muted);
            cursor: pointer;
            font-size: 20px;
        }
        .admin-panel .admin-template-btn {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(139, 92, 246, 0.08);
            color: var(--admin);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
            text-align: center;
        }
        .admin-panel .admin-template-btn:active {
            transform: scale(0.97);
            background: rgba(139, 92, 246, 0.2);
        }
        .admin-panel .admin-input {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .admin-panel .admin-input:focus { border-color: var(--admin); }
        .admin-panel .admin-select {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            appearance: none;
            -webkit-appearance: none;
        }
        .admin-panel .admin-select:focus { border-color: var(--admin); }
        .admin-panel .admin-select option {
            background: var(--card);
            color: #fff;
        }
        .admin-panel .admin-actions { display: flex; gap: 10px; }
        .admin-panel .admin-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .admin-panel .admin-actions button:active { transform: scale(0.96); }
        .admin-panel .admin-actions .btn-send { background: var(--admin); color: white; }
        .admin-panel .admin-actions .btn-cancel { background: rgba(255,255,255,0.08); color: var(--text); }
        .admin-panel .admin-actions .btn-send-me { 
            background: var(--success); 
            color: white;
            flex: 0.5;
        }
        .admin-panel .admin-status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .admin-panel .admin-status.success { color: var(--success); }
        .admin-panel .admin-status.error { color: var(--error); }

        .admin-fab {
            display: none;
            position: fixed;
            bottom: 85px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: 1px solid rgba(139, 92, 246, 0.3);
            align-items: center;
            justify-content: center;
            z-index: 998;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .admin-fab:active { transform: scale(0.92); }
        .admin-fab.visible { display: flex; }
        .admin-fab svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
        }
        .header-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            vertical-align: middle;
        }
        .mini-journal-icon {
            width: 28px;
            height: 36px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-radius: 3px 8px 8px 3px;
            position: relative;
            display: inline-block;
        }
        .mini-journal-icon::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 5px;
            width: 18px;
            height: 2px;
            background: rgba(255,255,255,0.6);
            border-radius: 1px;
            box-shadow: 0 7px 0 rgba(255,255,255,0.6), 0 14px 0 rgba(255,255,255,0.6);
        }
        .profile-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }
        .profile-btn:active { transform: scale(0.92); }
        .profile-btn .ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #38bdf8, #f472b6, #fbbf24);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .profile-btn.active .ring { opacity: 1; animation: spinRing 3s linear infinite; }
        .profile-btn .profile-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #94a3b8;
        }
        .profile-btn .profile-icon svg {
            width: 100%;

        function findStudentByName(name) {
            if (!name) return null;

        function isExamSubject(subjectName) {

        }
        
        function calculateAverage(marks) {
            if (!marks || marks.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (const m of marks) {
                const val = parseFloat(String(m).replace(',', '.'));
                if (!isNaN(val) && val > 0) {
                    sum += val;
                    count++;
                }
            }
            if (count === 0) return null;
            const avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function calculateTotalAverage(subjects) {
            if (!subjects || subjects.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (const sub of subjects) {
                if (sub.avg && sub.avg !== '—') {
                    const val = parseFloat(String(sub.avg).replace(',', '.'));
                    if (!isNaN(val) && val > 0) {
                        sum += val;
                        count++;
                    }
                }
            }
            if (count === 0) return null;
            const avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function getStyleForScore(score) {
            if (!score || score === '—' || score === '0,0') return 'm-none';
            const v = parseFloat(String(score).replace(',', '.'));
            if (isNaN(v)) return 'm-none';
            if (v >= 9.5) return 'm-gold';
            if (v >= 7.5) return 'm-high';
            if (v >= 5) return 'm-warn';
            return 'm-low';
        }

                        if (type) line += ` (${type.slice(0, 3)})`;
                        
                        let details = [];

                            details.push(teachers.join(', '));

                        if (room) {

            tg.showAlert('✅ Расписание отправлено!');
        }

        function getCurrentPair() {
            const now = new Date();
            const time = now.getHours() * 60 + now.getMinutes();
            const day = now.getDay();
            
            if (day === 0 || day === 6) return null;
            
            for (const [pair, schedule] of Object.entries(PAIR_SCHEDULE)) {
                const [startH, startM] = schedule.start.split(':').map(Number);
                const [endH, endM] = schedule.end.split(':').map(Number);
                const start = startH * 60 + startM;
                const end = endH * 60 + endM;
                
                if (time >= start && time <= end + 2) {
                    return {
                        pair: pair,
                        start: schedule.start,
                        end: schedule.end,
                        break: schedule.nextBreak
                    };
                }
            }
            return null;
        }

        function getScheduleForDay(dayName) {
            if (!scheduleBlocks || scheduleBlocks.length === 0) {
                return null;
            }
            
            const targetDate = getWeekOffsetDate(scheduleOffset || 0);
            const targetMondayStr = formatDate(targetDate);
            
            let targetBlock = null;
            for (const block of scheduleBlocks) {
                if (block.dates && block.dates.includes(targetMondayStr)) {
                    targetBlock = block;
                    break;
                }
            }
            
            if (!targetBlock) {
                targetBlock = scheduleBlocks[0];
            }
            
            const schedule = parseScheduleFromBlock(targetBlock);
            if (!schedule) return null;
            
            return schedule[dayName] || null;
        }

        function sendAfterPairNotification(pairNumber) {
            const students = Object.keys(BINDINGS);
            const nextPair = parseInt(pairNumber) + 1;
            const nextSchedule = PAIR_SCHEDULE[nextPair];
            
            if (!nextSchedule) {
                console.log('📚 Все пары на сегодня закончились');
                return;
            }
            
            const today = new Date();
            const dayName = today.getDay() === 0 ? 'Воскресенье' : DAYS_RU[today.getDay() - 1];
            const schedule = getScheduleForDay(dayName);
            const nextLesson = schedule ? schedule.find(l => l.pair === String(nextPair)) : null;
            
            let message = `🔔 *Пара ${pairNumber} закончилась!*\n\n`;
            message += `⏰ Следующая пара (${nextPair}) начнется в *${nextSchedule.start}*\n`;
            
            if (nextLesson) {
                message += `\n📚 *${nextLesson.discipline}*`;
                if (nextLesson.type) message += ` (${nextLesson.type})`;
                if (nextLesson.teachers && nextLesson.teachers.length > 0) {
                    message += `\n👨‍🏫 ${nextLesson.teachers.join(', ')}`;
                }
                if (nextLesson.room) message += `\n🏛️ Аудитория: ${nextLesson.room}`;
                message += `\n⏱️ Длится до ${nextSchedule.end}`;
            } else {
                message += `\n📭 Занятий на следующую пару нет`;
            }
            
            if (nextSchedule.nextBreak) {
                message += `\n\n☕ Перемена до ${nextSchedule.nextBreak}`;
            }
            
            students.forEach(id => {
                if (id !== OWNER_CHAT_ID) {
                    sendMessageToUser(id, message);
                }
            });
            
            console.log(`✅ Отправлено уведомление о конце пары ${pairNumber}`);
        }

        function sendNextWeekSchedule() {
            const students = Object.keys(BINDINGS);
            const today = new Date();
            const dayOfWeek = today.getDay();
            const daysUntilMonday = dayOfWeek === 0 ? 1 : 8 - dayOfWeek;
            const nextMonday = new Date(today);
            nextMonday.setDate(today.getDate() + daysUntilMonday);
            
            let message = `📆 *Расписание на следующую неделю*\n`;
            message += `🗓️ *${nextMonday.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })}*\n\n`;
            
            for (let i = 0; i < 6; i++) {
                const date = new Date(nextMonday);
                date.setDate(nextMonday.getDate() + i);
                const dayName = date.getDay() === 0 ? 'Воскресенье' : DAYS_RU[date.getDay() - 1];
                const dateStr = date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                
                const schedule = getScheduleForDay(dayName);
                
                message += `*${dayName}* (${dateStr})\n`;
                if (!schedule || schedule.length === 0) {
                    message += '📭 Выходной\n\n';
                } else {
                    schedule.forEach(lesson => {
                        message += `  ${lesson.pair}. ${lesson.discipline}`;
                        if (lesson.type) message += ` (${lesson.type})`;
                        if (lesson.teachers && lesson.teachers.length > 0) {
                            message += ` ${lesson.teachers.join(', ')}`;
                        }
                        if (lesson.room) message += ` [${lesson.room}]`;
                        message += '\n';
                    });
                    message += '\n';
                }
            }
            
            students.forEach(id => {
                if (id !== OWNER_CHAT_ID) {
                    sendMessageToUser(id, message);
                }
            });
            
            console.log('✅ Отправлено расписание на следующую неделю');
        }

        function checkNotifications() {
            const now = new Date();
            const hour = now.getHours();
            const minutes = now.getMinutes();
            const day = now.getDay();
            
            // Проверка окончания пар (каждые 2 минуты)
            if (minutes % 2 === 0 || minutes === 1) {
                const currentPair = getCurrentPair();
                if (currentPair) {
                    const [endH, endM] = currentPair.end.split(':').map(Number);
                    const endTime = endH * 60 + endM;
                    const currentTime = hour * 60 + minutes;
                    
                    if (currentTime >= endTime && currentTime <= endTime + 2) {
                        sendAfterPairNotification(currentPair.pair);
                    }
                }
            }
            
            // Проверка субботы 17:00
            if (day === 6 && hour === 17 && minutes === 0) {
                sendNextWeekSchedule();
            }
        }

        // ============================================================
        // 12. ЗАГРУЗКА ДАННЫХ (ЖУРНАЛ)
        // ============================================================
        function loadData() {
            if (isLoading) return;
            isLoading = true;
            isDataLoaded = false;
            
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            hideError();
            loaderStatus.textContent = 'Загрузка журнала';
            
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data.journal && data.journal.length > 0) {
                        ALL_DATA = data;
                        processAllAverages();
                        isDataLoaded = true;
                        renderJournal();
                        updateProfileButton();
                        if (isAdmin) {
                            updateAdminRecipients();
                        }
                        hideLoader();
                        isLoading = false;
                        console.log('✅ Загружено из кеша');
                    }
                }
            } catch(e) {
                console.warn('Ошибка чтения кеша:', e);
            }
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            
            Promise.all([
                fetch(API_JOURNAL, { signal: controller.signal }).then(r => r.json()),
                fetch(API_ABSENCES, { signal: controller.signal }).then(r => r.json())
            ]).then(([resJ, resA]) => {
                clearTimeout(timeoutId);
                
                const absMap = {};
                if (Array.isArray(resA)) {
                    resA.forEach(a => { 
                        if (a && a.name) absMap[a.name.trim()] = a.count || '0'; 
                    });
                }
                
                let journalData = [];
                if (Array.isArray(resJ)) journalData = resJ;
                else if (resJ && resJ.journal && Array.isArray(resJ.journal)) journalData = resJ.journal;
                else if (resJ && !resJ.error) journalData = resJ;
                
                if (!journalData.length) throw new Error('Нет данных');
                
                ALL_DATA = { journal: journalData, absences: absMap };
                processAllAverages();
                localStorage.setItem(CACHE_KEY, JSON.stringify(ALL_DATA));
                isDataLoaded = true;
                
                renderJournal();
                updateProfileButton();
                if (isAdmin) {
                    updateAdminRecipients();
                }
                
                if (loader.style.display !== 'none') {
                    hideLoader();
                }
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
                console.log('✅ Загружено с сервера');
                isLoading = false;
                
            }).catch(e => {
                clearTimeout(timeoutId);
                console.error('Ошибка загрузки с сервера:', e);
                
                if (isDataLoaded && ALL_DATA.journal.length > 0) {
                    console.log('📦 Использую кеш');
                    isLoading = false;
                    return;
                }
                
                showError('Проверьте подключение к интернету');
                isLoading = false;
            });
        }

            ALL_DATA.journal.forEach(student => {

                    student.subjects.forEach(subject => {

        // ============================================================
        // 13. РАСПИСАНИЕ — ПАРСИНГ И ОТОБРАЖЕНИЕ
        // ============================================================
        function cleanDiscipline(name) {
            if (!name) return '';
            let cleaned = name.trim();
            cleaned = cleaned.replace(/\([^)]*\)/g, '').trim();
            cleaned = cleaned.replace(/\([кКнН]\)$/, '').trim();
            cleaned = cleaned.replace(/[.,\s]+$/, '').trim();
            return cleaned;
        }

        function extractTeacherFromText(text) {
            const patterns = [
                /([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)/,
                /([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)/,
                /([А-Я][а-я]+\s+[А-Я][а-я]+\s+[А-Я][а-я]+)/
            ];
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) return match[0].trim();
            }
            return null;
        }

        function parseLessonText(text, pairNum) {
            if (!text || text.trim() === '' || text.trim() === '-') return null;
            
            let content = text.trim();
            let subgroup = '';
            let lessonType = '';
            let room = '';
            let teachers = [];
            
            const subMatch = content.match(/^(\d+)\./);
            if (subMatch) {
                subgroup = subMatch[1];
                content = content.replace(/^\d+\.\s*/, '').trim();
            }
            
            const roomMatch = content.match(/(Кн\.?\s*[\d\-()]+|[\d\-]+\(?[к\)]?)/i);
            if (roomMatch) {
                room = roomMatch[0].trim();
                content = content.replace(roomMatch[0], '').trim();
            }
            
            const kMatch = content.match(/\([кКнН]\)/);
            if (kMatch) {
                const kText = kMatch[0];
                if (!room) room = kText;
                else room = room + ' ' + kText;
                content = content.replace(kMatch[0], '').trim();
            }
            
            const typeMatch = content.match(/\(([^)]+)\)/);
            if (typeMatch) {
                const type = typeMatch[1].trim();
                lessonType = TYPE_MAP[type] || type;
                content = content.replace(typeMatch[0], '').trim();
            }
            
            let discipline = '';
            let tempContent = content;
            let isFizra = false;
            
            if (tempContent.includes('ФЗКиЗ')) {
                isFizra = true;
                const teacherPatterns = [
                    /Усикова\s+[А-Я]\.\s*[А-Я]\./,
                    /Анципов\s+[А-Я]\.\s*[А-Я]\./
                ];
                
                for (const pattern of teacherPatterns) {
                    const match = tempContent.match(pattern);
                    if (match) {
                        teachers.push(match[0].trim());
                        tempContent = tempContent.replace(match[0], '').trim();
                    }
                }
                
                if (teachers.length > 0) {
                    discipline = 'ФЗКиЗ';
                }
            }
            
            if (!discipline) {
                const teacher = extractTeacherFromText(tempContent);
                if (teacher) {
                    teachers.push(teacher);
                    tempContent = tempContent.replace(teacher, '').trim();
                }
                discipline = cleanDiscipline(tempContent);
                if (!discipline) discipline = 'Без названия';
            }
            
            if (isFizra) {
                subgroup = '';
                if (room === '2' || room === '--' || room === '-') {
                    room = '';
                }
            }
            
            return {
                pair: pairNum,
                discipline: discipline,
                type: lessonType,
                teachers: teachers,
                room: room,
                subgroup: subgroup
            };
        }

        function mergeLessonsInPair(lessons) {
            if (!lessons || lessons.length === 0) return [];
            
            const grouped = {};
            
            for (const lesson of lessons) {
                const key = lesson.pair + '|' + lesson.discipline + '|' + lesson.type + '|' + lesson.room;
                if (!grouped[key]) {
                    grouped[key] = {
                        pair: lesson.pair,
                        discipline: lesson.discipline,
                        type: lesson.type,
                        room: lesson.room,
                        teachers: [],
                        subgroups: []
                    };
                }
                if (lesson.teachers && lesson.teachers.length > 0) {
                    for (const teacher of lesson.teachers) {
                        if (!grouped[key].teachers.includes(teacher)) {
                            grouped[key].teachers.push(teacher);
                        }
                    }
                }
                if (lesson.subgroup && !grouped[key].subgroups.includes(lesson.subgroup)) {
                    grouped[key].subgroups.push(lesson.subgroup);
                }
            }
            
            return Object.values(grouped);
        }

        function getWeekOffsetDate(offset) {
            const today = new Date();
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(today);
            monday.setDate(diff + offset * 7);
            return monday;
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}.${m}.${y}`;
        }

        function getWeekNumber(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        function extractScheduleBlocks(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const blocks = [];
            const headings = doc.querySelectorAll('h2');
            
            for (let i = 0; i < headings.length; i++) {
                const h2 = headings[i];
                if (h2.textContent.includes('Группа - 86')) {
                    let table = null;
                    let el = h2.nextElementSibling;
                    while (el) {
                        if (el.tagName === 'TABLE') {
                            table = el;
                            break;
                        }
                        el = el.nextElementSibling;
                    }
                    
                    if (table) {
                        const headerRow = table.querySelector('tr');
                        let dates = [];
                        if (headerRow) {
                            const cells = headerRow.querySelectorAll('td, th');
                            for (const cell of cells) {
                                const text = cell.textContent.trim();
                                const dateMatch = text.match(/(\d{2}\.\d{2}\.\d{4})/);
                                if (dateMatch) {
                                    dates.push(dateMatch[1]);
                                }
                            }
                        }
                        
                        blocks.push({
                            table: table,
                            dates: dates,
                            html: table.outerHTML
                        });
                    }
                }
            }
            
            return blocks;
        }

        function parseScheduleFromBlock(block) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(block.html, 'text/html');
            const table = doc.querySelector('table');
            
            if (!table) return null;
            
            const rows = table.querySelectorAll('tr');
            if (rows.length < 4) return null;
            
            let headerRow = null;
            let headerRowIndex = 0;
            
            for (let i = 0; i < Math.min(3, rows.length); i++) {
                const cells = rows[i].querySelectorAll('td, th');
                let hasDay = false;
                for (const cell of cells) {
                    const text = cell.textContent.trim();
                    for (const day of DAYS_RU) {
                        if (text.includes(day)) {
                            hasDay = true;
                            break;
                        }
                    }
                    if (hasDay) break;
                }
                if (hasDay) {
                    headerRow = rows[i];
                    headerRowIndex = i;
                    break;
                }
            }
            
            if (!headerRow) return null;
            
            const headerCells = headerRow.querySelectorAll('td, th');
            const dayMap = {};
            let currentCol = 0;
            
            for (const cell of headerCells) {
                const text = cell.textContent.trim();
                const colspan = parseInt(cell.getAttribute('colspan')) || 1;
                
                let foundDay = null;
                for (const day of DAYS_RU) {
                    if (text.includes(day)) {
                        foundDay = day;
                        break;
                    }
                }
                
                if (foundDay) {
                    dayMap[foundDay] = {
                        subjectCol: currentCol,
                        roomCol: currentCol + 1,
                        date: text
                    };
                }
                
                currentCol += colspan;
            }
            
            if (Object.keys(dayMap).length === 0) {
                for (let i = 0; i < 6; i++) {
                    dayMap[DAYS_RU[i]] = {
                        subjectCol: 1 + i * 2,
                        roomCol: 2 + i * 2,
                        date: ''
                    };
                }
            }
            
            const schedule = {};
            Object.keys(dayMap).forEach(day => { schedule[day] = []; });
            
            let totalPairs = 0;
            const startRow = headerRowIndex + 2;
            
            for (let i = startRow; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td, th');
                if (cells.length < 2) continue;
                
                const pairNum = cells[0].textContent.trim();
                if (!pairNum || pairNum === '') continue;
                
                for (const [dayName, info] of Object.entries(dayMap)) {
                    const subjCol = info.subjectCol;
                    const roomCol = info.roomCol;
                    
                    let subject = '';
                    let room = '';
                    
                    if (subjCol < cells.length) {
                        subject = cells[subjCol].textContent.trim();
                    }
                    if (roomCol < cells.length) {
                        room = cells[roomCol].textContent.trim();
                    }
                    
                    if (!subject || subject === '' || subject === '-') continue;
                    
                    let fullText = subject;
                    if (room && room !== '' && room !== '-') {
                        fullText += ' ' + room;
                    }
                    
                    const lesson = parseLessonText(fullText, pairNum);
                    if (lesson) {
                        if (!lesson.room && room && room !== '' && room !== '-') {
                            lesson.room = room;
                        }
                        schedule[dayName].push(lesson);
                        totalPairs++;
                    }
                }
            }
            
            for (const day of Object.keys(schedule)) {
                schedule[day] = mergeLessonsInPair(schedule[day]);
            }
            
            return schedule;
        }

        function renderScheduleUI(schedule, weekOffset) {
            const container = document.getElementById('scheduleContent');
            const weekLabel = document.getElementById('scheduleWeekLabel');
            
            if (!schedule) {
                container.innerHTML = `<div class="schedule-empty"><span class="empty-icon">📭</span><span>Расписание не найдено</span></div>`;
                return;
            }
            
            const mondayDate = getWeekOffsetDate(weekOffset);
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(mondayDate);
                d.setDate(mondayDate.getDate() + i);
                weekDates.push(d);
            }
            
            const weekNum = getWeekNumber(mondayDate);
            const isEvenWeek = weekNum % 2 === 0;
            const weekType = isEvenWeek ? 'Числитель' : 'Знаменатель';
            
            const start = weekDates[0].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            const end = weekDates[6].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            const offsetLabel = weekOffset === 0 ? '📌 Текущая' : weekOffset === 1 ? '➡️ Следующая' : '⬅️ Предыдущая';
            weekLabel.textContent = `${start} — ${end} (${offsetLabel}) • ${weekType}`;
            
            const today = new Date();
            const todayName = today.getDay() === 0 ? 'Воскресенье' : DAYS_RU[today.getDay() - 1];
            
            let html = '';
            
            for (let i = 0; i < 6; i++) {
                const dayName = DAYS_RU[i];
                const lessons = schedule[dayName] || [];
                const isToday = dayName === todayName && weekOffset === 0;
                const isWeekend = i === 5;
                const dateStr = weekDates[i].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                
                html += `
                    <div class="schedule-day">
                        <div class="schedule-day-header">
                            <span class="day-name">${dayName}</span>
                            <span class="day-date">${dateStr}</span>
                            <span class="day-badge ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">${isToday ? 'СЕГОДНЯ' : isWeekend ? 'СУББОТА' : lessons.length > 0 ? `${lessons.length} пар` : 'ВЫХОДНОЙ'}</span>
                        </div>
                `;
                
                if (lessons.length === 0) {
                    html += `<div class="schedule-empty"><span class="empty-icon">📭</span><span>Нет занятий</span></div>`;
                } else {
                    lessons.sort((a, b) => parseInt(a.pair) - parseInt(b.pair));
                    lessons.forEach(lesson => {
                        const typeClass = lesson.type === 'лекция' ? 'lecture' : 
                                        lesson.type === 'лабораторная' ? 'lab' : 
                                        lesson.type === 'практика' ? 'practice' : '';
                        const typeLabel = lesson.type ? lesson.type.charAt(0).toUpperCase() + lesson.type.slice(1) : '';
                        
                        let teachersHtml = '';
                        if (lesson.teachers && lesson.teachers.length > 0) {
                            teachersHtml = lesson.teachers.map(t => 
                                `<span class="teacher-item">
                                    <span class="teacher-icon">👨‍🏫</span>
                                    <span class="teacher-name">${escapeHtml(t)}</span>
                                </span>`
                            ).join(' ');
                        }
                        
                        let subgroupsHtml = '';
                        if (lesson.subgroups && lesson.subgroups.length > 0) {
                            subgroupsHtml = lesson.subgroups.map(s => 
                                `${s} подгруппа`
                            ).join(' / ');
                        }
                        
                        html += `
                            <div class="schedule-lesson">
                                <span class="lesson-time">${lesson.pair}</span>
                                <div class="lesson-info">
                                    <div class="lesson-name">${escapeHtml(lesson.discipline)}</div>
                                    ${subgroupsHtml ? `<div class="lesson-subgroup">${subgroupsHtml}</div>` : ''}
                                    <div class="lesson-meta-row">
                                        ${lesson.room ? `<span class="room-badge"><span class="icon">🏛️</span> ${escapeHtml(lesson.room)}</span>` : ''}
                                        ${typeLabel ? `<span class="type-badge ${typeClass}">${typeLabel}</span>` : ''}
                                    </div>
                                    ${teachersHtml ? `<div class="lesson-teachers">${teachersHtml}</div>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
                
                html += `</div>`;
            }
            
            container.innerHTML = html;
            updateScheduleButtons(weekOffset);
        }

        function updateScheduleButtons(offset) {
            document.querySelectorAll('#tabSchedule .schedule-controls button').forEach(b => b.classList.remove('active'));
            if (offset === 0) {
                document.getElementById('scheduleCurrentWeek').classList.add('active');
            } else if (offset === 1) {
                document.getElementById('scheduleNextWeek').classList.add('active');
            } else if (offset === -1) {
                document.getElementById('schedulePrevWeek').classList.add('active');
            }
        }

        function loadCurrentSchedule() {
            if (!scheduleRawHTML || scheduleBlocks.length === 0) {
                loadScheduleData();
                return;
            }
            
            const targetDate = getWeekOffsetDate(scheduleOffset);
            const targetMondayStr = formatDate(targetDate);
            
            let targetBlock = null;
            for (const block of scheduleBlocks) {
                if (block.dates && block.dates.includes(targetMondayStr)) {
                    targetBlock = block;
                    break;
                }
            }
            
            if (!targetBlock) {
                targetBlock = scheduleBlocks[0];
            }
            
            const schedule = parseScheduleFromBlock(targetBlock);
            if (schedule) {
                renderScheduleUI(schedule, scheduleOffset);
            } else {
                document.getElementById('scheduleContent').innerHTML = 
                    `<div class="schedule-error"><span class="error-icon">⚠️</span><span>Ошибка парсинга</span></div>`;
            }
        }

        async function loadScheduleData() {
            const container = document.getElementById('scheduleContent');
            
            container.innerHTML = `<div class="schedule-loader"><div class="spinner"></div><span>Загрузка расписания...</span></div>`;
            
            try {
                const response = await fetch(PROXY_URL, { signal: AbortSignal.timeout(15000) });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                scheduleRawHTML = await response.text();
                scheduleBlocks = extractScheduleBlocks(scheduleRawHTML);
                
                if (scheduleBlocks.length === 0) {
                    throw new Error('Блоки расписания не найдены');
                }
                
                scheduleOffset = 0;
                loadCurrentSchedule();
                
            } catch(e) {
                console.error('Ошибка загрузки расписания:', e);
                container.innerHTML = `
                    <div class="schedule-error">
                        <span class="error-icon">⚠️</span>
                        <span>Не удалось загрузить расписание</span>
                        <br>
                        <span style="font-size:11px;color:var(--muted);">Проверьте прокси-сервер</span>
                        <br>
                        <button class="retry-btn" onclick="loadScheduleData()">🔄 Попробовать снова</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // 14. НАВИГАЦИЯ
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
            
            if (tabId === 'tabSchedule') {
                const container = document.getElementById('scheduleContent');
                if (container.querySelector('.schedule-loader') || 
                    container.querySelector('.schedule-error') || 
                    container.innerHTML === '' ||
                    container.querySelector('.schedule-empty')) {
                    loadScheduleData();
                }
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // ============================================================
        document.getElementById('profileBtn').addEventListener('click', function(e) {
            e.stopPropagation();

            if (bound) {
                if (isCardMode) {
                    closeCard();
                } else {
                    openCard(bound);
                }
            } else {
                showStudentSelect();
            }
        });
        
        document.getElementById('cardOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeCard();

        document.getElementById('search').addEventListener('input', renderJournal);
        document.getElementById('fabUpdate').addEventListener('click', forceUpdate);
        document.getElementById('retryButton').addEventListener('click', forceUpdate);
        
        document.querySelectorAll('.nav-item').forEach(item => {

                switchTab(tabId);

        document.getElementById('scheduleCurrentWeek').addEventListener('click', () => {

            loadCurrentSchedule();

        document.getElementById('scheduleNextWeek').addEventListener('click', () => {

        document.getElementById('schedulePrevWeek').addEventListener('click', () => {

            sendScheduleToOwner(scheduleHTML);

        });
        
        document.getElementById('closeAdmin').addEventListener('click', function() {
            document.getElementById('adminPanel').classList.remove('open');
        });
        
        document.getElementById('adminCancel').addEventListener('click', function() {
            document.getElementById('adminPanel').classList.remove('open');
            document.getElementById('adminMessage').value = '';

                statusEl.className = 'admin-status success';

        document.getElementById('adminSend').addEventListener('click', function() {

                sendMessageToStudents(message, recipient);
            }

        document.getElementById('templateNewScores').addEventListener('click', function() {

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        document.getElementById('btnIdentityYes').addEventListener('click', function() {

                if (tg) {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('❌ Выберите свою фамилию из списка.');

            sendMessageToUser(OWNER_CHAT_ID, msg);

        document.getElementById('btnIdentityNo').addEventListener('click', function() {

                    document.querySelectorAll('.student-item').forEach(el => {
                        el.style.background = 'transparent';
                        el.style.border = 'none';
                    });
                    document.getElementById('popupSubText').textContent = 'Выберите свою фамилию из списка:';

        if (tg) {

                    document.getElementById('adminPanel').classList.remove('open');
                } else if (document.getElementById('tabSchedule').classList.contains('active')) {

                }

        // ============================================================
        // 16. ЗАПУСК УВЕДОМЛЕНИЙ
        // ============================================================
        setInterval(checkNotifications, 60000);
        setTimeout(() => {
            checkNotifications();
            console.log('🔔 Система уведомлений запущена');
        }, 5000);

        // ============================================================
        // 17. ЗАПУСК
        // ============================================================
        window.openCard = openCard;
        window.closeCard = closeCard;
        window.toggleMarks = toggleMarks;
        window.loadScheduleData = loadScheduleData;

        loadData();
    </script>
