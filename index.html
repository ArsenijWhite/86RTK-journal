<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание 86РТК</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --success: #10b981;
            --schedule-day-bg: rgba(56, 189, 248, 0.06);
            --schedule-border: rgba(56, 189, 248, 0.12);
        }
        * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        html, body { background-color: var(--bg); margin: 0; padding: 0; color: var(--text); min-height: 100vh; }
        body { padding: 16px; padding-bottom: 30px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .header h1 { font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
        .header h1 span { font-size: 24px; }
        .header .group-label { background: rgba(56, 189, 248, 0.12); padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.15); }
        .header .week-label { font-size: 11px; color: var(--muted); font-weight: 400; width: 100%; }
        .header .status-badge { font-size: 9px; padding: 2px 10px; border-radius: 12px; font-weight: 600; background: rgba(255,255,255,0.06); color: var(--muted); }
        .header .status-badge.success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .header .status-badge.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .header .status-badge.loading { background: rgba(56, 189, 248, 0.12); color: var(--accent); }

        .controls { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
        .controls button { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 6px 14px; color: var(--muted); font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .controls button:active { transform: scale(0.95); background: rgba(255,255,255,0.08); }
        .controls button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

        .schedule-loader { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
        .schedule-loader .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.06); border-top-color: var(--accent); animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .schedule-error { text-align: center; padding: 30px 20px; color: var(--error); font-size: 13px; }
        .schedule-error .error-icon { font-size: 28px; display: block; margin-bottom: 8px; }
        .schedule-error .retry-btn { margin-top: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 8px 24px; border-radius: 20px; color: var(--text); font-size: 12px; cursor: pointer; }
        .schedule-error .retry-btn:active { transform: scale(0.95); }

        .schedule-day { margin-bottom: 14px; background: var(--schedule-day-bg); border-radius: 14px; border: 1px solid var(--schedule-border); overflow: hidden; }
        .schedule-day-header { padding: 12px 16px 10px; background: rgba(56, 189, 248, 0.04); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--schedule-border); flex-wrap: wrap; }
        .schedule-day-header .day-name { font-size: 15px; font-weight: 700; color: var(--text); }
        .schedule-day-header .day-date { font-size: 11px; color: var(--muted); font-weight: 400; }
        .schedule-day-header .day-badge { margin-left: auto; font-size: 10px; padding: 2px 10px; border-radius: 12px; background: rgba(56, 189, 248, 0.12); color: var(--accent); font-weight: 600; white-space: nowrap; }
        .schedule-day-header .day-badge.today { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .schedule-day-header .day-badge.weekend { background: rgba(239, 68, 68, 0.1); color: var(--error); }

        .schedule-lesson { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; align-items: flex-start; gap: 12px; transition: background 0.15s; }
        .schedule-lesson:last-child { border-bottom: none; }
        .schedule-lesson:active { background: rgba(255,255,255,0.03); }

        .schedule-lesson .lesson-time { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 36px; padding-top: 1px; }
        .schedule-lesson .lesson-info { flex: 1; min-width: 0; }
        .schedule-lesson .lesson-name { font-size: 14px; font-weight: 500; color: var(--text); }
        .schedule-lesson .lesson-subgroup { font-size: 10px; font-weight: 600; color: var(--gold); background: rgba(251, 191, 36, 0.12); padding: 1px 8px; border-radius: 10px; display: inline-block; margin-left: 6px; }
        .schedule-lesson .lesson-details { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 8px; }
        .schedule-lesson .lesson-details .detail-item { display: inline-flex; align-items: center; gap: 4px; }
        .schedule-lesson .lesson-details .detail-item .icon { font-size: 11px; }
        .schedule-lesson .lesson-details .detail-item .type-badge { font-size: 9px; padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,0.06); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .schedule-lesson .lesson-details .detail-item .type-badge.lecture { background: rgba(56, 189, 248, 0.12); color: var(--accent); }
        .schedule-lesson .lesson-details .detail-item .type-badge.practice { background: rgba(251, 191, 36, 0.12); color: var(--gold); }
        .schedule-lesson .lesson-details .detail-item .type-badge.lab { background: rgba(244, 114, 182, 0.12); color: #f472b6; }

        .schedule-lesson .lesson-teachers { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .schedule-lesson .lesson-teachers .teacher-item { display: inline-block; background: rgba(255,255,255,0.04); padding: 1px 8px; border-radius: 8px; margin: 1px 2px; }

        .schedule-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
        .schedule-empty .empty-icon { font-size: 24px; display: block; margin-bottom: 4px; opacity: 0.5; }

        .debug-log { margin-top: 20px; padding: 12px 16px; background: rgba(0,0,0,0.3); border-radius: 10px; font-size: 11px; color: var(--muted); font-family: monospace; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid rgba(255,255,255,0.04); }
        .debug-log .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .debug-log .log-entry:last-child { border-bottom: none; }
        .debug-log .log-entry .time { color: var(--muted); opacity: 0.5; }
        .debug-log .log-entry.success { color: var(--success); }
        .debug-log .log-entry.error { color: var(--error); }
        .debug-log .log-entry.info { color: var(--accent); }
        .debug-log .log-entry.warning { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1><span>📅</span> Расписание</h1>
            <span class="week-label" id="weekLabel">Загрузка...</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="group-label">Группа 86</span>
            <span class="status-badge loading" id="statusBadge">⏳ Загрузка...</span>
        </div>
    </div>

    <div class="controls">
        <button id="refreshBtn">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Обновить</span>
        </button>
    </div>

    <div id="scheduleContent">
        <div class="schedule-loader">
            <div class="spinner"></div>
            <span>Загрузка расписания...</span>
        </div>
    </div>

    <div class="debug-log" id="debugLog">
        <div class="log-entry info"><span class="time">[⏳]</span> Ожидание загрузки...</div>
    </div>

    <script>
        // ============================================================
        // 1. НАСТРОЙКИ
        // ============================================================
        const PROXY_URL = 'https://schedule-proxy.arsenijbro5.workers.dev/';
        const DAYS_RU = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const TYPE_MAP = {
            'Лек': 'лекция',
            'ЛР': 'лабораторная',
            'ПР': 'практика',
            'Лекция': 'лекция',
            'Лабораторная': 'лабораторная',
            'Практика': 'практика'
        };

        // ============================================================
        // 2. ЛОГГЕР
        // ============================================================
        function addLog(message, type = 'info') {
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============================================================
        // 3. ПАРСИНГ
        // ============================================================
        function parseLessonText(text, pairNum) {
            if (!text || text.trim() === '' || text.trim() === '-') return null;
            
            let content = text.trim();
            let subgroup = '';
            let discipline = '';
            let lessonType = '';
            let teacher = '';
            let room = '';
            
            // 1. Подгруппа
            const subMatch = content.match(/^(\d+)\./);
            if (subMatch) {
                subgroup = subMatch[1];
                content = content.replace(/^\d+\.\s*/, '').trim();
            }
            
            // 2. Аудитория (с буквами к, кн)
            const roomMatch = content.match(/(Кн\.?\s*[\d\-()]+|[\d\-]+\(?[к\)]?)/i);
            if (roomMatch) {
                room = roomMatch[0].trim();
                content = content.replace(roomMatch[0], '').trim();
            }
            
            // 3. Проверяем, остались ли в конце буквы (к) или (кн) в названии
            // Если в конце осталось (к) или (кн) — переносим в аудиторию
            const leftoverMatch = content.match(/\([кКнН]\)$/);
            if (leftoverMatch && !room) {
                room = leftoverMatch[0].trim();
                content = content.replace(leftoverMatch[0], '').trim();
            }
            
            // 4. Тип занятия
            const typeMatch = content.match(/\(([^)]+)\)/);
            if (typeMatch) {
                const type = typeMatch[1].trim();
                lessonType = TYPE_MAP[type] || type;
                content = content.replace(typeMatch[0], '').trim();
            }
            
            // 5. Преподаватель
            const teacherPattern = /([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)|([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)|([А-Я][а-я]+\s+[А-Я][а-я]+\s+[А-Я][а-я]+)/;
            const teacherMatch = content.match(teacherPattern);
            if (teacherMatch) {
                teacher = teacherMatch[0].trim();
                content = content.replace(teacherMatch[0], '').trim();
            }
            
            // 6. Дисциплина
            discipline = content.trim();
            if (!discipline) discipline = 'Без названия';
            
            return {
                pair: pairNum,
                discipline: discipline,
                type: lessonType,
                teacher: teacher,
                room: room,
                subgroup: subgroup
            };
        }

        function mergeLessonsInPair(lessons) {
            if (!lessons || lessons.length === 0) return [];
            
            const grouped = {};
            
            for (const lesson of lessons) {
                const key = lesson.pair + '|' + lesson.discipline + '|' + lesson.type + '|' + lesson.room;
                if (!grouped[key]) {
                    grouped[key] = {
                        pair: lesson.pair,
                        discipline: lesson.discipline,
                        type: lesson.type,
                        room: lesson.room,
                        teachers: [],
                        subgroups: []
                    };
                }
                if (lesson.teacher && !grouped[key].teachers.includes(lesson.teacher)) {
                    grouped[key].teachers.push(lesson.teacher);
                }
                if (lesson.subgroup && !grouped[key].subgroups.includes(lesson.subgroup)) {
                    grouped[key].subgroups.push(lesson.subgroup);
                }
            }
            
            return Object.values(grouped);
        }

        function parseSchedule(html) {
            addLog('🔍 Начинаем парсинг...', 'info');
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            let table = null;
            const headings = doc.querySelectorAll('h2');
            
            for (const h2 of headings) {
                if (h2.textContent.includes('Группа - 86')) {
                    let el = h2.nextElementSibling;
                    while (el) {
                        if (el.tagName === 'TABLE') {
                            table = el;
                            addLog('✅ Таблица найдена', 'success');
                            break;
                        }
                        el = el.nextElementSibling;
                    }
                    break;
                }
            }
            
            if (!table) {
                const tables = doc.querySelectorAll('table');
                if (tables.length > 0) {
                    table = tables[0];
                    addLog('⚠️ Использую первую таблицу', 'warning');
                } else {
                    addLog('❌ Таблица не найдена', 'error');
                    return null;
                }
            }
            
            const rows = table.querySelectorAll('tr');
            addLog(`📊 Строк: ${rows.length}`, 'info');
            
            if (rows.length < 4) {
                addLog('❌ Слишком мало строк', 'error');
                return null;
            }
            
            // ============================================================
            // 1. ОПРЕДЕЛЯЕМ ДНИ НЕДЕЛИ
            // ============================================================
            let headerRow = null;
            let headerRowIndex = 0;
            
            for (let i = 0; i < Math.min(3, rows.length); i++) {
                const cells = rows[i].querySelectorAll('td, th');
                let hasDay = false;
                for (const cell of cells) {
                    const text = cell.textContent.trim();
                    for (const day of DAYS_RU) {
                        if (text.includes(day)) {
                            hasDay = true;
                            break;
                        }
                    }
                    if (hasDay) break;
                }
                if (hasDay) {
                    headerRow = rows[i];
                    headerRowIndex = i;
                    addLog(`✅ Строка с днями: ${i}`, 'success');
                    break;
                }
            }
            
            if (!headerRow) {
                addLog('❌ Строка с днями не найдена', 'error');
                return null;
            }
            
            const headerCells = headerRow.querySelectorAll('td, th');
            
            const dayMap = {};
            let currentCol = 0;
            
            for (const cell of headerCells) {
                const text = cell.textContent.trim();
                const colspan = parseInt(cell.getAttribute('colspan')) || 1;
                
                let foundDay = null;
                for (const day of DAYS_RU) {
                    if (text.includes(day)) {
                        foundDay = day;
                        break;
                    }
                }
                
                if (foundDay) {
                    dayMap[foundDay] = {
                        subjectCol: currentCol,
                        roomCol: currentCol + 1,
                        date: text
                    };
                    addLog(`📅 ${foundDay}: колонка ${currentCol} (ауд ${currentCol+1})`, 'success');
                }
                
                currentCol += colspan;
            }
            
            if (Object.keys(dayMap).length === 0) {
                addLog('⚠️ Дни не найдены, использую стандартные', 'warning');
                for (let i = 0; i < 6; i++) {
                    dayMap[DAYS_RU[i]] = {
                        subjectCol: 1 + i * 2,
                        roomCol: 2 + i * 2,
                        date: ''
                    };
                }
            }
            
            // ============================================================
            // 2. ПАРСИМ ПАРЫ
            // ============================================================
            const schedule = {};
            Object.keys(dayMap).forEach(day => { schedule[day] = []; });
            
            let totalPairs = 0;
            const startRow = headerRowIndex + 2;
            
            for (let i = startRow; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td, th');
                if (cells.length < 2) continue;
                
                const pairNum = cells[0].textContent.trim();
                if (!pairNum || pairNum === '') continue;
                
                for (const [dayName, info] of Object.entries(dayMap)) {
                    const subjCol = info.subjectCol;
                    const roomCol = info.roomCol;
                    
                    let subject = '';
                    let room = '';
                    
                    if (subjCol < cells.length) {
                        subject = cells[subjCol].textContent.trim();
                    }
                    if (roomCol < cells.length) {
                        room = cells[roomCol].textContent.trim();
                    }
                    
                    if (!subject || subject === '' || subject === '-') continue;
                    
                    let fullText = subject;
                    if (room && room !== '' && room !== '-') {
                        fullText += ' ' + room;
                    }
                    
                    const lesson = parseLessonText(fullText, pairNum);
                    if (lesson) {
                        if (!lesson.room && room && room !== '' && room !== '-') {
                            lesson.room = room;
                        }
                        schedule[dayName].push(lesson);
                        totalPairs++;
                    }
                }
            }
            
            addLog(`📊 Всего пар: ${totalPairs}`, 'info');
            
            if (totalPairs === 0) {
                addLog('⚠️ Пары не найдены', 'error');
                return null;
            }
            
            for (const day of Object.keys(schedule)) {
                schedule[day] = mergeLessonsInPair(schedule[day]);
            }
            
            return schedule;
        }

        // ============================================================
        // 4. ОТОБРАЖЕНИЕ
        // ============================================================
        function renderSchedule(schedule, sourceType) {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            const weekLabel = document.getElementById('weekLabel');
            
            if (!schedule) {
                container.innerHTML = `<div class="schedule-empty"><span class="empty-icon">📭</span><span>Расписание не найдено</span></div>`;
                statusBadge.textContent = '❌ Ошибка';
                statusBadge.className = 'status-badge error';
                return;
            }
            
            if (sourceType === 'live') {
                statusBadge.textContent = '✅ С сервера';
                statusBadge.className = 'status-badge success';
            } else {
                statusBadge.textContent = '❌ Ошибка парсинга';
                statusBadge.className = 'status-badge error';
            }
            
            const today = new Date();
            const weekDates = [];
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(today);
            monday.setDate(diff);
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
            }
            
            weekLabel.textContent = `${weekDates[0].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })} — ${weekDates[6].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })}`;
            
            const todayName = today.getDay() === 0 ? 'Воскресенье' : DAYS_RU[today.getDay() - 1];
            
            let html = '';
            
            for (let i = 0; i < 6; i++) {
                const dayName = DAYS_RU[i];
                const lessons = schedule[dayName] || [];
                const isToday = dayName === todayName;
                const isWeekend = i === 5;
                const dateStr = weekDates[i].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                
                html += `
                    <div class="schedule-day">
                        <div class="schedule-day-header">
                            <span class="day-name">${dayName}</span>
                            <span class="day-date">${dateStr}</span>
                            <span class="day-badge ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">${isToday ? 'СЕГОДНЯ' : isWeekend ? 'СУББОТА' : lessons.length > 0 ? `${lessons.length} пар` : 'ВЫХОДНОЙ'}</span>
                        </div>
                `;
                
                if (lessons.length === 0) {
                    html += `<div class="schedule-empty"><span class="empty-icon">📭</span><span>Нет занятий</span></div>`;
                } else {
                    lessons.sort((a, b) => parseInt(a.pair) - parseInt(b.pair));
                    lessons.forEach(lesson => {
                        const typeClass = lesson.type === 'лекция' ? 'lecture' : 
                                        lesson.type === 'лабораторная' ? 'lab' : 
                                        lesson.type === 'практика' ? 'practice' : '';
                        const typeLabel = lesson.type ? lesson.type.charAt(0).toUpperCase() + lesson.type.slice(1) : '';
                        
                        let teachersHtml = '';
                        if (lesson.teachers && lesson.teachers.length > 0) {
                            teachersHtml = lesson.teachers.map(t => 
                                `<span class="teacher-item">${escapeHtml(t)}</span>`
                            ).join(' ');
                        }
                        
                        let subgroupsHtml = '';
                        if (lesson.subgroups && lesson.subgroups.length > 0) {
                            subgroupsHtml = lesson.subgroups.map(s => 
                                `${s} подгруппа`
                            ).join(' / ');
                        }
                        
                        html += `
                            <div class="schedule-lesson">
                                <span class="lesson-time">${lesson.pair}</span>
                                <div class="lesson-info">
                                    <div class="lesson-name">${escapeHtml(lesson.discipline)}</div>
                                    ${subgroupsHtml ? `<div class="lesson-subgroup">${subgroupsHtml}</div>` : ''}
                                    <div class="lesson-details">
                                        ${lesson.room ? `<span class="detail-item"><span class="icon">🏛️</span> ${escapeHtml(lesson.room)}</span>` : ''}
                                        ${typeLabel ? `<span class="detail-item"><span class="type-badge ${typeClass}">${typeLabel}</span></span>` : ''}
                                    </div>
                                    ${teachersHtml ? `<div class="lesson-teachers">${teachersHtml}</div>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
                
                html += `</div>`;
            }
            
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }

        // ============================================================
        // 5. ЗАГРУЗКА
        // ============================================================
        async function loadSchedule() {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            
            document.getElementById('debugLog').innerHTML = '';
            addLog('🚀 Загрузка расписания...', 'info');
            
            container.innerHTML = `<div class="schedule-loader"><div class="spinner"></div><span>Загрузка расписания...</span></div>`;
            statusBadge.textContent = '⏳ Загрузка...';
            statusBadge.className = 'status-badge loading';
            
            try {
                const response = await fetch(PROXY_URL, { signal: AbortSignal.timeout(15000) });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const html = await response.text();
                addLog(`✅ Получен HTML (${html.length} символов)`, 'success');
                
                const schedule = parseSchedule(html);
                
                if (schedule && Object.values(schedule).some(arr => arr.length > 0)) {
                    renderSchedule(schedule, 'live');
                    addLog(`✅ Готово!`, 'success');
                    return;
                } else {
                    addLog('❌ Парсинг не дал результатов', 'error');
                }
            } catch(e) {
                addLog(`❌ Ошибка: ${e.message}`, 'error');
            }
            
            container.innerHTML = `
                <div class="schedule-error">
                    <span class="error-icon">⚠️</span>
                    <span>Не удалось загрузить расписание</span>
                    <br>
                    <span style="font-size:11px;color:var(--muted);">Проверьте прокси-сервер</span>
                    <br>
                    <button class="retry-btn" onclick="loadSchedule()">🔄 Попробовать снова</button>
                </div>
            `;
            statusBadge.textContent = '❌ Ошибка';
            statusBadge.className = 'status-badge error';
        }

        // ============================================================
        // 6. ЗАПУСК
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', loadSchedule);
        loadSchedule();
    </script>
</body>
</html>
