<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Журнал 86РТК</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --exam-color: #f472b6;
            --exam-bg: rgba(244, 114, 182, 0.12);
            --success: #10b981;
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { 
            padding: 16px; 
            padding-bottom: 30px; 
        }

        /* ЛОАДЕР */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }
        
        .logo-container { 
            position: relative; 
            width: 100px; 
            height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 30px; 
        }
        
        .logo-outline {
            position: absolute; 
            width: 100%; 
            height: 100%;
            border-radius: 50%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        #loader:not(.error-mode) .logo-container {
            animation: breatheContainer 2s ease-in-out infinite;
        }
        
        #loader:not(.error-mode) .logo-outline {
            border: 2px solid rgba(56, 189, 248, 0.15);
            border-top: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: spin 1.2s linear infinite;
        }
        
        #loader:not(.error-mode) .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            animation: breatheIcon 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        
        #loader.error-mode .logo-outline {
            border: 2px solid var(--error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: none;
        }
        
        #loader.error-mode .logo-icon {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: breatheIconError 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        
        .logo-icon {
            width: 45px; 
            height: 60px; 
            border-radius: 5px 12px 12px 5px; 
            position: relative; 
            z-index: 2;
        }
        
        .logo-icon::before {
            content: ""; 
            position: absolute; 
            top: 12px; 
            left: 8px;
            width: 25px; 
            height: 3px; 
            background: rgba(255,255,255,0.5);
            border-radius: 2px; 
            box-shadow: 0 8px 0 rgba(255,255,255,0.5), 0 16px 0 rgba(255,255,255,0.5);
        }
        
        .loader-status { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--accent); 
            text-transform: uppercase; 
            letter-spacing: 0.3em; 
            margin-bottom: 25px;
        }
        
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
        }
        
        .error-container.visible {
            display: flex;
        }
        
        .error-message {
            font-size: 13px;
            font-weight: 500;
            color: var(--error);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        
        .copyright {
            position: absolute;
            bottom: 25px;
            font-size: 9px;
            color: rgba(255,255,255,0.08);
        }

        @keyframes breatheContainer {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.98); }
        }
        
        @keyframes breatheIcon {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        
        @keyframes breatheIconError {
            0% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.97); opacity: 0.85; }
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* ИНТЕРФЕЙС */
        #main-content { 
            opacity: 0; 
            transition: 0.5s; 
            display: none;
        }
        #main-content.visible {
            display: block;
            opacity: 1;
        }
        
        /* ШАПКА С ПРОФИЛЕМ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
        }
        
        .header-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .mini-journal-icon {
            width: 28px;
            height: 36px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-radius: 3px 8px 8px 3px;
            position: relative;
            display: inline-block;
        }
        
        .mini-journal-icon::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 5px;
            width: 18px;
            height: 2px;
            background: rgba(255,255,255,0.6);
            border-radius: 1px;
            box-shadow: 0 7px 0 rgba(255,255,255,0.6), 0 14px 0 rgba(255,255,255,0.6);
        }
        
        /* КНОПКА ПРОФИЛЯ - ВСЕГДА ВИДНА */
        .profile-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            position: relative;
        }
        
        .profile-btn:active {
            transform: scale(0.92);
        }
        
        .profile-btn .badge-online {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }
        
        .profile-btn .badge-offline {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background: var(--muted);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }
        
        .profile-btn .profile-icon {
            font-size: 18px;
        }
        
        .header-sub { 
            font-size: 11px; 
            color: var(--muted); 
            margin-bottom: 16px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        
        #search { 
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 12px 16px; 
            border-radius: 14px; 
            background: rgba(255,255,255,0.04); 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 16px; 
        }
        #search:focus { 
            border-color: var(--accent); 
        }
        
        .card { 
            background: var(--card); 
            border-radius: 18px; 
            padding: 14px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:active { 
            transform: scale(0.98); 
        }
        .student-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .student-name { 
            font-size: 15px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        
        .abs-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        
        .score-pill { 
            font-size: 11px; 
            font-weight: 700; 
            padding: 3px 8px; 
            border-radius: 7px; 
            min-width: 36px; 
            text-align: center; 
            display: inline-block;
        }
        .m-low { background: #ef4444; color: white; } 
        .m-warn { background: #f59e0b; color: white; } 
        .m-high { background: #10b981; color: white; }
        .m-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
        .m-none { background: rgba(255,255,255,0.08); color: var(--muted); }
        
        .subs-container { 
            display: none;
            padding-top: 12px; 
            margin-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .subs-container.open { 
            display: block; 
        }
        .sub-item { 
            margin-bottom: 10px; 
            cursor: pointer; 
            padding: 8px 10px;
            border-radius: 10px;
            transition: background 0.2s;
            position: relative;
        }
        .sub-item.exam-subject {
            background: var(--exam-bg);
            border-left: 3px solid var(--exam-color);
        }
        .sub-item.exam-subject:active {
            background: rgba(244, 114, 182, 0.2);
        }
        .sub-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 6px; 
            font-size: 13px; 
        }
        .subject-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .exam-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--exam-color);
            border-radius: 50%;
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
            pointer-events: none;
        }
        .exam-tooltip {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--exam-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text);
            line-height: 1.5;
            max-width: 100%;
            margin-top: 6px;
            animation: fadeIn 0.25s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .exam-tooltip.open {
            display: block;
        }
        .exam-tooltip .tooltip-title {
            color: var(--exam-color);
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .exam-tooltip .tooltip-text {
            color: var(--muted);
        }
        .exam-tooltip .tooltip-text strong {
            color: var(--text);
        }
        .exam-tooltip .tooltip-hint {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            margin-top: 6px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }
        
        .marks-box { 
            display: none; 
            background: rgba(0,0,0,0.25); 
            padding: 10px; 
            border-radius: 10px; 
            margin-top: 6px; 
        }
        .marks-box.open { 
            display: block; 
        }
        .marks-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
        }
        .mark { 
            width: 26px; 
            height: 26px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 7px; 
            font-size: 10px; 
            font-weight: 700; 
            margin-right: 2px; 
        }

        /* ===== КАРТОЧКА СТУДЕНТА (ОВЕРЛЕЙ) ===== */
        .card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }
        
        .card-overlay.open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        
        .card-overlay .card-wrapper {
            max-width: 420px;
            width: 100%;
            margin: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .student-tile {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .student-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #f472b6, #fbbf24);
            opacity: 0.6;
        }

        .tile-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .tile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
        }

        .tile-info {
            flex: 1;
            min-width: 0;
        }

        .tile-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tile-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .tile-group {
            font-size: 11px;
            color: var(--muted);
        }

        .tile-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tile-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .tile-stat .value {
            font-weight: 700;
            color: var(--text);
        }

        .tile-stat .value.gold {
            color: var(--gold);
        }

        .tile-stat .value.green {
            color: var(--success);
        }

        .tile-stat .icon {
            font-size: 14px;
        }

        .tile-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 2;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        
        .tile-close:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.08);
        }

        .detail-card {
            margin-top: 12px;
            background: var(--card);
            border-radius: 16px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .detail-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px 20px 16px;
            position: relative;
            overflow: hidden;
        }

        .detail-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
            border-radius: 50%;
        }

        .detail-header::before {
            content: '📚';
            position: absolute;
            bottom: -10px;
            right: 20px;
            font-size: 48px;
            opacity: 0.06;
        }

        .detail-top {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .detail-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .detail-title {
            flex: 1;
        }

        .detail-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }

        .detail-sub {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .detail-sub .group-tag {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 9px;
        }

        .detail-avg-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 1;
        }

        .avg-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            flex-shrink: 0;
            position: relative;
        }

        .avg-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .avg-circle.gold {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1));
            color: #fbbf24;
        }

        .avg-circle.green {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1));
            color: #10b981;
        }

        .avg-circle.orange {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.1));
            color: #f59e0b;
        }

        .avg-circle.red {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1));
            color: #ef4444;
        }

        .avg-info {
            flex: 1;
        }

        .avg-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .avg-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .avg-value span {
            color: var(--muted);
            font-weight: 400;
            font-size: 11px;
        }

        .detail-body {
            padding: 16px 20px 20px;
        }

        .detail-body-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-body-title .count {
            font-size: 9px;
            font-weight: 400;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 8px;
            border-radius: 20px;
        }

        /* Стили для предметов в карточке - кликабельные */
        .subject-row {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
            cursor: pointer;
        }

        .subject-row:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.06);
        }

        .subject-row .subject-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .subject-row .subject-icon.blue { background: rgba(56, 189, 248, 0.12); }
        .subject-row .subject-icon.pink { background: rgba(244, 114, 182, 0.12); }

<body>

            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>

    <script>
        // ============================================================
        // 1. НАСТРОЙКИ
        // ============================================================
        const API_JOURNAL = 'https://script.google.com/macros/s/AKfycbwtV3eFenNotdiVr3u1DQPJdOLn2fieHDsvWUwlsQquKURzkLkW4wuTiLqkNFnWCH0v/exec';
        const API_ABSENCES = 'https://script.google.com/macros/s/AKfycbyux4wfN_lVoodDq-JHHjbYAGuJys_DsZ2mADyUGdw1MERG-iZK833dN0tSzI7lq_QeZg/exec';
        const BOT_TOKEN = '8559243948:AAFAW1LdoTmE1a0I1pTgOvv6c9jDLz_1nnI';
        const OWNER_CHAT_ID = '5753985995';
        
        // ============================================================
        // 2. РУЧНАЯ ПРИВЯЗКА СТУДЕНТОВ
        // ============================================================
        const BINDINGS = {
            // 'telegram_user_id' : 'полное имя студента'
            // '123456789' : 'Иванов Иван Иванович',
        };
        
        // ============================================================
        // 3. ОСТАЛЬНОЙ КОД
        // ============================================================
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch(e) {}
        
        const CACHE_KEY = 'journal_86rtk_v15';
        
        const EXAM_SUBJECTS = [
            'Цифровая и микропроцессорная техника',
            'Промышленная электроника и микроэлектроника',
            'Автоматизация производства'
        ];
        
        let ALL_DATA = { journal: [], absences: {} };
        let isLoading = false;
        let currentStudentForIdentity = null;
        
        // ============================================================
        // 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function isExamSubject(subjectName) {
            if (!subjectName) return false;
            const name = subjectName.toLowerCase().trim();
            return EXAM_SUBJECTS.some(exam => name.includes(exam.toLowerCase()) || exam.toLowerCase().includes(name));
        }
        
        function calculateAverage(marks) {
            if (!marks || marks.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (let m of marks) {
                let val = parseFloat(String(m).replace(',', '.'));
                if (!isNaN(val) && val > 0) {
                    sum += val;
                    count++;
                }
            }
            if (count === 0) return null;
            let avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function calculateTotalAverage(subjects) {
            if (!subjects || subjects.length === 0) return null;
            let sum = 0;
            let count = 0;
            for (let sub of subjects) {
                if (sub.avg && sub.avg !== '—') {
                    let val = parseFloat(String(sub.avg).replace(',', '.'));
                    if (!isNaN(val) && val > 0) {
                        sum += val;
                        count++;
                    }
                }
            }
            if (count === 0) return null;
            let avg = sum / count;
            return avg.toFixed(1).replace('.', ',');
        }
        
        function getStyleForScore(score) {
            if (!score || score === '—' || score === '0,0') return 'm-none';
            const v = parseFloat(String(score).replace(',', '.'));
            if (isNaN(v)) return 'm-none';
            if (v >= 9.5) return 'm-gold';
            if (v >= 7.5) return 'm-high';
            if (v >= 5) return 'm-warn';
            return 'm-low';
        }
        
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }
        
        function getGroup(name) {
            return '86РТК';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showError(message) {
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');
            loader.classList.add('error-mode');
            loaderStatus.textContent = 'Ошибка соединения';
            errorMessage.textContent = message || 'Не удалось подключиться к серверу';
            errorContainer.classList.add('visible');
        }
        
        function hideError() {
            const loader = document.getElementById('loader');
            const errorContainer = document.getElementById('errorContainer');
            loader.classList.remove('error-mode');
            errorContainer.classList.remove('visible');
            document.getElementById('loaderStatus').textContent = 'Загрузка данных';
        }
        
        // ============================================================
        // 5. ОТПРАВКА УВЕДОМЛЕНИЯ ВЛАДЕЛЬЦУ
        // ============================================================
        async function notifyOwner(userId, studentName) {
            try {
                const message = `🔔 <b>Новая привязка!</b>\n\n` +
                    `👤 Студент: <b>${escapeHtml(studentName)}</b>\n` +
                    `🆔 Telegram ID: <code>${userId}</code>\n\n` +
                    `Для привязки добавьте в BINDINGS:\n` +
                    `<code>'${userId}' : '${escapeHtml(studentName)}'</code>`;
                
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: OWNER_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                if (data.ok) {
                    console.log('✅ Уведомление отправлено владельцу');
                    return true;
                } else {
                    console.error('❌ Ошибка отправки:', data);
                    return false;
                }
            } catch (e) {
                console.error('❌ Ошибка при отправке уведомления:', e);
                return false;
            }
        }
        
        // ============================================================
        // 6. РЕНДЕРИНГ КАРТОЧКИ СТУДЕНТА
        // ============================================================
        function renderStudentCard(studentName) {
            const container = document.getElementById('cardWrapper');
            if (!container) return;
            
            if (!studentName) {
                container.innerHTML = `
                    <div class="student-tile">
                        <div class="tile-close" onclick="closeCard()">✕</div>
                        <div style="text-align:center;padding:30px 20px;color:var(--muted);">
                            <div style="font-size:36px;margin-bottom:12px;">👤</div>
                            <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;">Выберите студента</div>
                            <div style="font-size:12px;">Нажмите на фамилию в журнале</div>
                        </div>
                    </div>
                `;
                return;
            }
            
            const student = ALL_DATA.journal.find(s => s.studentName === studentName);
            if (!student) {
                container.innerHTML = `
                    <div class="student-tile">
                        <div class="tile-close" onclick="closeCard()">✕</div>
                        <div style="text-align:center;padding:20px;color:var(--muted);">
                            <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
                            <div>Студент не найден</div>
                        </div>
                    </div>
                `;
                return;
            }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const isBoundToMe = userId && BINDINGS[userId] === student.studentName;
            
            const sortedStudents = [...ALL_DATA.journal].filter(s => s && s.studentName)
                .sort((a, b) => a.studentName.localeCompare(b.studentName));
            const studentIndex = sortedStudents.findIndex(s => s.studentName === student.studentName) + 1;
            const studentId = String(studentIndex).padStart(3, '0');
            
            const absCount = ALL_DATA.absences[student.studentName] || "0";
            const totalAvg = student.totalAverage && student.totalAverage !== '—' ? student.totalAverage : '—';
            const avgNum = parseFloat(String(totalAvg).replace(',', '.'));
            let avgClass = 'gold';
            if (isNaN(avgNum)) avgClass = 'gold';
            else if (avgNum >= 7.5) avgClass = 'gold';
            else if (avgNum >= 5) avgClass = 'orange';
            else avgClass = 'red';
            
            let statusText = 'Отлично';
            if (isNaN(avgNum)) statusText = 'Нет данных';
            else if (avgNum >= 9) statusText = '🏆 Отлично';
            else if (avgNum >= 7.5) statusText = '✅ Хорошо';
            else if (avgNum >= 5) statusText = '⚠️ Удовлетворительно';
            else statusText = '❌ Требуется внимание';
            
            let subjectsHtml = '';
            if (student.subjects && Array.isArray(student.subjects)) {
                const icons = ['📐', '💻', '⚡', '🔌', '🏭', '📡', '🔧', '📊', '🎯', '🧮', '📈', '🔬'];
                student.subjects.forEach((sub, idx) => {
                    const isExam = isExamSubject(sub.subject);
                    const avgDisplay = sub.avg && sub.avg !== '—' ? sub.avg : '—';
                    const avgNumSub = parseFloat(String(avgDisplay).replace(',', '.'));
                    let scoreClass = 'gray';
                    if (!isNaN(avgNumSub)) {
                        if (avgNumSub >= 7.5) scoreClass = 'gold';
                        else if (avgNumSub >= 5) scoreClass = 'orange';
                        else scoreClass = 'red';
                    }
                    
                    // Собираем все оценки для отображения
                    let marksListHtml = '';
                    if (sub.marks && Array.isArray(sub.marks) && sub.marks.length > 0) {
                        marksListHtml = sub.marks.map(m => {
                            const mNum = parseFloat(String(m).replace(',', '.'));
                            let bg = '#475569';
                            if (!isNaN(mNum)) {
                                if (mNum >= 7.5) bg = '#10b981';
                                else if (mNum >= 5) bg = '#f59e0b';
                                else bg = '#ef4444';
                            }
                            return `<span class="mark-item" style="background:${bg};">${m}</span>`;
                        }).join('');
                    }
                    
                    const icon = icons[idx % icons.length];
                    const iconClass = ['blue', 'pink', 'purple', 'green', 'orange', 'blue', 'pink', 'purple', 'green', 'orange', 'blue', 'pink'][idx % 12];
                    const examBadge = isExam ? `<span class="exam-badge">📝 Экзамен</span>` : '';
                    
                    // Создаем уникальный ID для контейнера с оценками
                    const marksId = 'marks_' + idx + '_' + Math.random().toString(36).substr(2, 6);
                    
                    subjectsHtml += `
                        <div class="subject-row ${isExam ? 'exam' : ''}" onclick="toggleMarks('${marksId}')">
                            <div class="subject-icon ${iconClass}">${icon}</div>
                            <div class="subject-info">
                                <div class="subject-name">
                                    ${escapeHtml(sub.subject || 'Без названия')}
                                    ${examBadge}
                                </div>
                            </div>
                            <div class="subject-score ${scoreClass}">${avgDisplay}</div>
                        </div>
                        <div class="subject-marks-container" id="${marksId}">
                            ${marksListHtml || '<span style="color:var(--muted);font-size:10px;">Нет оценок</span>'}
                        </div>
                    `;
                });
            }
            
            const subjectsCount = student.subjects ? student.subjects.length : 0;
            const badge = isBoundToMe ? `<span class="tile-badge">✅ Вы</span>` : '';
            
            container.innerHTML = `
                <div class="student-tile">
                    <div class="tile-close" onclick="closeCard()">✕</div>
                    <div class="tile-header">
                        <div class="tile-avatar">${getInitials(student.studentName)}</div>
                        <div class="tile-info">
                            <div class="tile-name">
                                ${escapeHtml(student.studentName)}
                                ${badge}
                            </div>
                            <div class="tile-group">${getGroup(student.studentName)} • ID: #${studentId}</div>
                        </div>
                    </div>
                    <div class="tile-stats">
                        <div class="tile-stat">
                            <span class="icon">📊</span>
                            <span>Ср. балл: <span class="value gold">${totalAvg}</span></span>
                        </div>
                        <div class="tile-stat">
                            <span class="icon">⏳</span>
                            <span>Отгулы: <span class="value">${absCount}</span></span>
                        </div>
                        <div class="tile-stat">
                            <span class="icon">📚</span>
                            <span>Предметов: <span class="value green">${subjectsCount}</span></span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-header">
                        <div class="detail-top">
                            <div class="detail-avatar">${getInitials(student.studentName)}</div>
                            <div class="detail-title">
                                <div class="detail-name">${escapeHtml(student.studentName)}</div>
                                <div class="detail-sub">
                                    <span class="group-tag">${getGroup(student.studentName)}</span>
                                    <span>• ID: #${studentId}</span>
                                </div>
                            </div>
                        </div>
                        <div class="detail-avg-block">
                            <div class="avg-circle ${avgClass}">${totalAvg}</div>
                            <div class="avg-info">
                                <div class="avg-label">Средний балл</div>
                                <div class="avg-value">
                                    ${statusText}
                                    <span>• ${subjectsCount} предметов</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="detail-body">
                        <div class="detail-body-title">
                            📋 Предметы
                            <span class="count">${subjectsCount}</span>
                        </div>
                        ${subjectsHtml}
                    </div>
                </div>
            `;
        }
        
        // Функция для раскрытия оценок по предмету
        function toggleMarks(id) {
            const container = document.getElementById(id);
            if (container) {
                container.classList.toggle('open');
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }
        
        // ============================================================
        // 7. УПРАВЛЕНИЕ КАРТОЧКОЙ
        // ============================================================
        function openCard(studentName) {
            const overlay = document.getElementById('cardOverlay');
            renderStudentCard(studentName || null);
            overlay.classList.add('open');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        function closeCard() {
            document.getElementById('cardOverlay').classList.remove('open');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
        
        // ============================================================
        // 8. РЕНДЕРИНГ ЖУРНАЛА
        // ============================================================
        function renderJournal() {
            const container = document.getElementById('list');
            if (!container) return;
            container.innerHTML = '';
            const query = document.getElementById('search')?.value.toLowerCase().trim() || '';
            
            if (!ALL_DATA.journal || ALL_DATA.journal.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных</div>';
                return;
            }
            
            let filteredStudents = ALL_DATA.journal.filter(s => s && s.studentName);
            
            const sortedByTotal = [...filteredStudents].sort((a, b) => {
                const avgA = parseFloat(String(a.totalAverage).replace(',', '.'));
                const avgB = parseFloat(String(b.totalAverage).replace(',', '.'));
                if (isNaN(avgA)) return 1;
                if (isNaN(avgB)) return -1;
                return avgB - avgA;
            });
            const topNames = sortedByTotal.slice(0, 3).map(s => s.studentName);
            const crowns = ['🥇', '🥈', '🥉'];
            
            const list = filteredStudents
                .filter(s => s && s.studentName && s.studentName.toLowerCase().includes(query))
                .sort((a, b) => a.studentName.localeCompare(b.studentName));
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                return;
            }
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            
            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card';
                const absCount = ALL_DATA.absences[s.studentName] || "0";
                const tIdx = topNames.indexOf(s.studentName);
                
                const isBoundToMe = userId && BINDINGS[userId] === s.studentName;
                
                let subsHtml = '';
                if (s.subjects && Array.isArray(s.subjects)) {
                    subsHtml = s.subjects.map(sub => {
                        const isExam = isExamSubject(sub.subject);
                        
                        let marksHtml = '';
                        if (sub.marks && Array.isArray(sub.marks) && sub.marks.length > 0) {
                            marksHtml = sub.marks.map(m => `<div class="mark ${getStyleForScore(m)}">${m}</div>`).join('');
                        } else {
                            marksHtml = '<div style="font-size:10px; opacity:0.4; padding:6px;">Нет отметок</div>';
                        }
                        
                        const avgDisplay = sub.avg && sub.avg !== '—' ? sub.avg : '—';
                        const examClass = isExam ? 'exam-subject' : '';
                        
                        const tooltipId = 'tooltip_' + Math.random().toString(36).substr(2, 9);
                        const examIcon = isExam ? `<span class="exam-icon">!</span>` : '';
                        
                        const tooltipHtml = isExam ? `
                            <div class="exam-tooltip" id="${tooltipId}">
                                <div class="tooltip-title">📝 Экзаменационный предмет</div>
                                <div class="tooltip-text">Итоговая отметка может <strong>отличаться</strong> от текущей успеваемости и выставляется по результатам экзамена.</div>
                                <div class="tooltip-hint">Нажмите на подсказку, чтобы скрыть</div>
                            </div>
                        ` : '';
                        
                        return `<div class="sub-item ${examClass}" data-tooltip="${tooltipId}" data-tooltip-shown="false">
                            <div class="sub-row">
                                <div class="subject-name-wrapper">
                                    <span>${escapeHtml(sub.subject || 'Без названия')}</span>
                                    ${examIcon}
                                </div>
                                <span class="score-pill ${getStyleForScore(avgDisplay)}">${avgDisplay}</span>
                            </div>
                            <div class="marks-box">
                                <div class="marks-row">${marksHtml}</div>
                            </div>
                            ${tooltipHtml}
                        </div>`;
                    }).join('');
                } else {
                    subsHtml = '<div style="font-size:11px; opacity:0.4; text-align:center; padding:10px;">Нет предметов</div>';
                }
                
                const totalDisplay = s.totalAverage && s.totalAverage !== '—' ? s.totalAverage : '—';
                
                const identityBadge = isBoundToMe ? 
                    `<span style="font-size:9px;background:var(--success);color:white;padding:1px 8px;border-radius:10px;margin-left:6px;">✅ Вы</span>` : '';
                
                card.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">
                            ${escapeHtml(s.studentName)} ${tIdx !== -1 ? crowns[tIdx] : ''}
                            <span class="abs-badge">⏳ ${absCount}</span>
                            ${identityBadge}
                        </span>
                        <span class="score-pill ${getStyleForScore(totalDisplay)}">${totalDisplay}</span>
                    </div>
                    <div class="subs-container">${subsHtml}</div>`;
                
                card.onclick = function(e) {
                    e.stopPropagation();
                    // Открываем карточку с этим студентом
                    openCard(s.studentName);
                };
                
                container.appendChild(card);
            });
            
            document.querySelectorAll('.sub-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const marksBox = this.querySelector('.marks-box');
                    if (marksBox) marksBox.classList.toggle('open');
                    
                    if (this.classList.contains('exam-subject')) {
                        const tooltipId = this.dataset.tooltip;
                        const tooltip = document.getElementById(tooltipId);
                        if (tooltip && this.dataset.tooltipShown === 'false') {
                            tooltip.classList.add('open');
                            this.dataset.tooltipShown = 'true';
                            
                            tooltip.onclick = function(e) {
                                e.stopPropagation();
                                this.classList.remove('open');
                                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                            };
                            
                            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                        }
                    }
                });
            });
            
            updateProfile();
        }
        
        // ============================================================
        // 9. ПРОФИЛЬ
        // ============================================================
        function updateProfile() {
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const boundStudent = userId && BINDINGS[userId] ? BINDINGS[userId] : null;
            const profileBtn = document.getElementById('profileBtn');
            const profileContent = document.getElementById('profileContent');
            const profileBadge = document.getElementById('profileBadge');
            
            if (boundStudent) {
                const student = ALL_DATA.journal.find(s => s.studentName === boundStudent);
                if (student) {
                    profileContent.textContent = getInitials(student.studentName);
                    profileBadge.className = 'badge-online';
                }
            } else {
                profileContent.textContent = '👤';
                profileBadge.className = 'badge-offline';
            }
        }
        
        // ============================================================
        // 10. ОБРАБОТЧИК ПРОФИЛЯ
        // ============================================================
        document.getElementById('profileBtn')?.addEventListener('click', function() {
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            const boundStudent = userId && BINDINGS[userId] ? BINDINGS[userId] : null;
            
            if (boundStudent) {
                // Если привязан - открываем карточку
                openCard(boundStudent);
            } else {
                // Если не привязан - отправляем запрос
                // Показываем попап с выбором студента
                // Для простоты - показываем список студентов в попапе
                const popup = document.getElementById('identityPopup');
                // Здесь нужно показать список студентов для выбора
                // Пока просто показываем заглушку
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                tg.showAlert('👤 Нажмите на свою фамилию в журнале, чтобы отправить запрос на привязку.');
            }
        });
        
        // ============================================================
        // 11. ЗАГРУЗКА ДАННЫХ
        // ============================================================
        async function init(force = false) {
            if (isLoading) return;
            isLoading = true;
            
            const loader = document.getElementById('loader');
            const loaderStatus = document.getElementById('loaderStatus');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            hideError();
            loaderStatus.textContent = 'Загрузка данных';
            
            const timeoutId = setTimeout(() => {
                if (isLoading) showError('Сервер не отвечает');
            }, 20000);
            
            const cached = localStorage.getItem(CACHE_KEY);
            if (!force && cached) {
                try {
                    ALL_DATA = JSON.parse(cached);
                    if (ALL_DATA.journal && ALL_DATA.journal.length > 0) {
                        clearTimeout(timeoutId);
                        processAllAverages();
                        renderJournal();
                        updateProfile();
                        hideLoader();
                        isLoading = false;
                        return;
                    }
                } catch(e) {}
            }
            
            try {
                loaderStatus.textContent = 'Загрузка журнала';
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 15000);
                
                const [resJ, resA] = await Promise.all([
                    fetch(API_JOURNAL, { signal: controller.signal }).then(r => r.json()),
                    fetch(API_ABSENCES, { signal: controller.signal }).then(r => r.json())
                ]);
                
                clearTimeout(timeoutId);
                
                const absMap = {};
                if (Array.isArray(resA)) {
                    resA.forEach(a => { 
                        if (a && a.name) absMap[a.name.trim()] = a.count || "0"; 
                    });
                }
                
                let journalData = [];
                if (Array.isArray(resJ)) journalData = resJ;
                else if (resJ && resJ.journal && Array.isArray(resJ.journal)) journalData = resJ.journal;
                else if (resJ && !resJ.error) journalData = resJ;
                
                if (!journalData.length) throw new Error('No data');
                
                ALL_DATA = { journal: journalData, absences: absMap };
                
                processAllAverages();
                
                localStorage.setItem(CACHE_KEY, JSON.stringify(ALL_DATA));
                
                renderJournal();
                updateProfile();
                hideLoader();
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
            } catch (e) {
                console.error('Error:', e);
                clearTimeout(timeoutId);
                
                if (ALL_DATA.journal && ALL_DATA.journal.length > 0) {
                    loaderStatus.textContent = 'Использую сохранённые данные';
                    setTimeout(() => {
                        processAllAverages();
                        renderJournal();
                        updateProfile();
                        hideLoader();
                    }, 800);
                } else {
                    showError('Проверьте подключение к интернету');
                }
            } finally {
                isLoading = false;
            }
        }
        
        function processAllAverages() {
            for (let student of ALL_DATA.journal) {
                if (student.subjects && Array.isArray(student.subjects)) {
                    for (let subject of student.subjects) {
                        const calculatedAvg = calculateAverage(subject.marks);
                        if (calculatedAvg) {
                            subject.avg = calculatedAvg;
                        } else if (!subject.avg || subject.avg === '—') {
                            subject.avg = '—';
                        }
                    }
                    const totalAvg = calculateTotalAverage(student.subjects);
                    if (totalAvg) {
                        student.totalAverage = totalAvg;
                    } else if (!student.totalAverage || student.totalAverage === '0,0') {
                        student.totalAverage = '—';
                    }
                }
            }
        }
        
        function forceUpdate() {
            localStorage.removeItem(CACHE_KEY);
            init(true);
        }
        
        function hideLoader() {
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('main-content');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                mainContent.classList.add('visible');
            }, 500);
        }
        
        // ============================================================
        // 12. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================
        // Закрытие карточки по клику на оверлей
        document.getElementById('cardOverlay')?.addEventListener('click', function(e) {
            if (e.target === this) closeCard();
        });
        
        // Поиск
        document.getElementById('search')?.addEventListener('input', () => renderJournal());
        
        // Обновление
        document.getElementById('retryButton')?.addEventListener('click', () => forceUpdate());
        document.getElementById('fabUpdate')?.addEventListener('click', () => forceUpdate());
        
        // Попап "Это вы?" - отправка запроса владельцу
        document.getElementById('btnIdentityYes')?.addEventListener('click', async function() {
            const popup = document.getElementById('identityPopup');
            popup.classList.remove('open');
            
            const userId = tg ? String(tg.initDataUnsafe?.user?.id || '') : '';
            if (!userId || !currentStudentForIdentity) {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            
            const sent = await notifyOwner(userId, currentStudentForIdentity);
            
            if (tg && tg.HapticFeedback) {
                if (sent) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert('✅ Запрос отправлен владельцу!');
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('❌ Ошибка отправки. Попробуйте позже.');
                }
            } else {
                alert(sent ? '✅ Запрос отправлен!' : '❌ Ошибка отправки');
            }
            
            currentStudentForIdentity = null;
        });
        
        document.getElementById('btnIdentityNo')?.addEventListener('click', function() {
            document.getElementById('identityPopup').classList.remove('open');
            currentStudentForIdentity = null;
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });
        
        // Закрытие попапа по клику вне
        document.addEventListener('click', function(e) {
            const popup = document.getElementById('identityPopup');
            if (popup.classList.contains('open')) {
                if (!popup.contains(e.target)) {
                    popup.classList.remove('open');
                    currentStudentForIdentity = null;
                }
            }
        });
        
        // ============================================================
        // 13. ЗАПУСК
        // ============================================================
        if (tg) {
            tg.onEvent('backButtonClicked', () => tg.close());
        }
        
        // Делаем функции глобальными
        window.openCard = openCard;
        window.closeCard = closeCard;
        window.toggleMarks = toggleMarks;
        
        init(true);
    </script>
</body>
</html>
