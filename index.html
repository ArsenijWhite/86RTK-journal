<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание 86РТК</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #ef4444;
            --gold: #fbbf24;
            --success: #10b981;
            --schedule-day-bg: rgba(56, 189, 248, 0.06);
            --schedule-border: rgba(56, 189, 248, 0.12);
        }
        * { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
        }
        html, body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            min-height: 100vh; 
        }
        body { padding: 16px; padding-bottom: 30px; }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span { font-size: 24px; }
        .header .group-label {
            background: rgba(56, 189, 248, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .header .week-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            width: 100%;
        }
        .header .status-badge {
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
        }
        .header .status-badge.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .header .status-badge.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }
        .header .status-badge.loading {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 12px;
        }
        .controls button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 6px 14px;
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .controls button:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.08);
        }
        .controls button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .schedule-loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-loader .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .schedule-error {
            text-align: center;
            padding: 30px 20px;
            color: var(--error);
            font-size: 13px;
        }
        .schedule-error .error-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .schedule-error .retry-btn {
            margin-top: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 24px;
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
        .schedule-error .retry-btn:active { transform: scale(0.95); }

        .schedule-day {
            margin-bottom: 14px;
            background: var(--schedule-day-bg);
            border-radius: 14px;
            border: 1px solid var(--schedule-border);
            overflow: hidden;
        }
        .schedule-day-header {
            padding: 12px 16px 10px;
            background: rgba(56, 189, 248, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--schedule-border);
            flex-wrap: wrap;
        }
        .schedule-day-header .day-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .schedule-day-header .day-date {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
        }
        .schedule-day-header .day-badge {
            margin-left: auto;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }
        .schedule-day-header .day-badge.today {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .schedule-day-header .day-badge.weekend {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .schedule-lesson {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: background 0.15s;
        }
        .schedule-lesson:last-child { border-bottom: none; }
        .schedule-lesson:active { background: rgba(255,255,255,0.03); }

        .schedule-lesson .lesson-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            min-width: 36px;
            padding-top: 1px;
        }
        .schedule-lesson .lesson-info {
            flex: 1;
            min-width: 0;
        }
        .schedule-lesson .lesson-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }
        .schedule-lesson .lesson-subgroup {
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            background: rgba(251, 191, 36, 0.12);
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-left: 6px;
        }
        .schedule-lesson .lesson-details {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .schedule-lesson .lesson-details .detail-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .schedule-lesson .lesson-details .detail-item .icon {
            font-size: 11px;
        }
        .schedule-lesson .lesson-details .detail-item .type-badge {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.lecture {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.practice {
            background: rgba(251, 191, 36, 0.12);
            color: var(--gold);
        }
        .schedule-lesson .lesson-details .detail-item .type-badge.lab {
            background: rgba(244, 114, 182, 0.12);
            color: #f472b6;
        }

        .schedule-empty {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .schedule-empty .empty-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .debug-log {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 11px;
            color: var(--muted);
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .debug-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .debug-log .log-entry:last-child { border-bottom: none; }
        .debug-log .log-entry .time {
            color: var(--muted);
            opacity: 0.5;
        }
        .debug-log .log-entry.success { color: var(--success); }
        .debug-log .log-entry.error { color: var(--error); }
        .debug-log .log-entry.info { color: var(--accent); }
        .debug-log .log-entry.warning { color: var(--gold); }
        .debug-log .log-entry.raw { color: #94a3b8; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1><span>📅</span> Расписание</h1>
            <span class="week-label" id="weekLabel">Загрузка...</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="group-label">Группа 86</span>
            <span class="status-badge loading" id="statusBadge">⏳ Загрузка...</span>
        </div>
    </div>

    <div class="controls">
        <button id="refreshBtn">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Обновить</span>
        </button>
    </div>

    <div id="scheduleContent">
        <div class="schedule-loader">
            <div class="spinner"></div>
            <span>Загрузка расписания...</span>
        </div>
    </div>

    <div class="debug-log" id="debugLog">
        <div class="log-entry info"><span class="time">[⏳]</span> Ожидание загрузки...</div>
    </div>

    <script>
        // ============================================================
        // 1. НАСТРОЙКИ
        // ============================================================
        const PROXY_URL = 'https://schedule-proxy.arsenijbro5.workers.dev/';
        const DAYS_RU = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const TYPE_MAP = {
            'Лек': 'лекция',
            'ЛР': 'лабораторная',
            'ПР': 'практика',
            'Лекция': 'лекция',
            'Лабораторная': 'лабораторная',
            'Практика': 'практика'
        };

        // ============================================================
        // 2. ЛОГГЕР
        // ============================================================
        function addLog(message, type = 'info') {
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============================================================
        // 3. ПАРСИНГ — ПРАВИЛЬНЫЙ ДЛЯ ТАБЛИЦЫ САЙТА
        // ============================================================
        
        function parseLessonCell(content, pairNum) {
            if (!content || content.trim() === '' || content.trim() === '-') return [];
            
            let text = content.trim();
            const lessons = [];
            
            // Разделяем на отдельные занятия (по переносам строк или по наличию цифры с точкой)
            // Сначала разбиваем по переносу строки
            let parts = text.split(/\n/);
            
            // Если нет переносов, пробуем разделить по цифре с точкой
            if (parts.length === 1) {
                // Ищем все вхождения "цифра.текст"
                const regex = /(\d+\.\s*[^(\d]+)/g;
                const matches = text.match(regex);
                if (matches && matches.length > 1) {
                    parts = matches.map(m => m.trim());
                    // Остаток текста после последнего совпадения
                    const lastMatch = matches[matches.length - 1];
                    const rest = text.substring(text.indexOf(lastMatch) + lastMatch.length).trim();
                    if (rest) {
                        parts[parts.length - 1] = parts[parts.length - 1] + ' ' + rest;
                    }
                }
            }
            
            // Если всё ещё одна часть — пробуем разделить по " 2." или " 3." и т.д.
            if (parts.length === 1) {
                const splitRegex = /\s+(\d+\.)/;
                const match = text.match(splitRegex);
                if (match) {
                    const idx = text.indexOf(match[1]);
                    const first = text.substring(0, idx).trim();
                    const second = text.substring(idx).trim();
                    parts = [first, second];
                }
            }
            
            // Парсим каждую часть
            for (const part of parts) {
                if (!part || part.trim() === '') continue;
                
                let partText = part.trim();
                let subgroup = '';
                let discipline = '';
                let lessonType = '';
                let teacher = '';
                let room = '';
                
                // 1. Ищем подгруппу (цифра с точкой)
                const subgroupMatch = partText.match(/^(\d+)\./);
                if (subgroupMatch) {
                    subgroup = subgroupMatch[1];
                    partText = partText.replace(/^\d+\.\s*/, '').trim();
                }
                
                // 2. Ищем тип занятия в скобках
                const typeMatch = partText.match(/\(([^)]+)\)/);
                if (typeMatch) {
                    const type = typeMatch[1].trim();
                    lessonType = TYPE_MAP[type] || type;
                    partText = partText.replace(typeMatch[0], '').trim();
                }
                
                // 3. Ищем аудиторию
                const roomMatch = partText.match(/(Кн\.?\s*[\d\-()]+|[\d\-]+\(?[к\)]?)/i);
                if (roomMatch) {
                    room = roomMatch[0].trim();
                    partText = partText.replace(roomMatch[0], '').trim();
                }
                
                // 4. Ищем преподавателя (Фамилия И. О.)
                const teacherPattern = /([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)|([А-Я][а-я]+\s+[А-Я]\.\s*[А-Я]\.)|([А-Я][а-я]+\s+[А-Я][а-я]+\s+[А-Я][а-я]+)/;
                const teacherMatch = partText.match(teacherPattern);
                
                if (teacherMatch) {
                    teacher = teacherMatch[0].trim();
                    partText = partText.replace(teacherMatch[0], '').trim();
                }
                
                // 5. Остаток — дисциплина
                discipline = partText.trim();
                
                // Если дисциплина пустая, пробуем взять всё содержимое
                if (!discipline) {
                    discipline = part.trim();
                    // Убираем то, что уже нашли
                    if (subgroup) discipline = discipline.replace(subgroup + '.', '').trim();
                    if (room) discipline = discipline.replace(room, '').trim();
                    if (teacher) discipline = discipline.replace(teacher, '').trim();
                    if (lessonType) {
                        const typeKeys = Object.keys(TYPE_MAP);
                        for (const key of typeKeys) {
                            if (discipline.includes('(' + key + ')')) {
                                discipline = discipline.replace('(' + key + ')', '').trim();
                            }
                        }
                    }
                }
                
                // Очищаем
                discipline = discipline.replace(/[,\-–\s]+$/, '').trim();
                if (teacher) teacher = teacher.trim();
                if (room) room = room.trim();
                
                if (discipline) {
                    lessons.push({
                        pair: pairNum,
                        discipline: discipline || 'Без названия',
                        type: lessonType,
                        teacher: teacher,
                        room: room,
                        subgroup: subgroup
                    });
                }
            }
            
            return lessons;
        }

        function parseSchedule(html) {
            addLog('🔍 Начинаем парсинг...', 'info');
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // Ищем таблицу для группы 86
            let targetTable = null;
            
            // Ищем заголовок h2 с текстом "Группа - 86"
            const headings = doc.querySelectorAll('h2');
            addLog(`Найдено заголовков h2: ${headings.length}`, 'info');
            
            for (const h2 of headings) {
                const text = h2.textContent.trim();
                if (text.includes('Группа - 86')) {
                    addLog(`✅ Найден заголовок: ${text}`, 'success');
                    let sibling = h2.nextElementSibling;
                    while (sibling) {
                        if (sibling.tagName === 'TABLE') {
                            targetTable = sibling;
                            addLog('✅ Таблица найдена после заголовка', 'success');
                            break;
                        }
                        sibling = sibling.nextElementSibling;
                    }
                    break;
                }
            }
            
            if (!targetTable) {
                addLog('⚠️ Заголовок не найден, ищу таблицу', 'warning');
                const tables = doc.querySelectorAll('table');
                addLog(`Найдено таблиц: ${tables.length}`, 'info');
                
                for (const table of tables) {
                    const tableText = table.textContent;
                    const hasDays = DAYS_RU.some(day => tableText.includes(day));
                    if (hasDays) {
                        targetTable = table;
                        addLog('✅ Найдена таблица с днями недели', 'success');
                        break;
                    }
                }
                
                if (!targetTable && tables.length > 0) {
                    targetTable = tables[0];
                    addLog('⚠️ Использую первую таблицу', 'warning');
                }
            }
            
            if (!targetTable) {
                addLog('❌ Таблица не найдена', 'error');
                return null;
            }
            
            // Парсим таблицу
            const rows = targetTable.querySelectorAll('tr');
            addLog(`📊 Найдено строк: ${rows.length}`, 'info');
            
            if (rows.length < 3) {
                addLog('❌ Слишком мало строк', 'error');
                return null;
            }
            
            // ============================================================
            // ОПРЕДЕЛЯЕМ ДНИ НЕДЕЛИ
            // ============================================================
            const headerRow1 = rows[0];
            const dayCells = headerRow1.querySelectorAll('td, th');
            
            const dayInfo = [];
            let currentDay = null;
            
            for (let i = 1; i < dayCells.length; i++) {
                const cell = dayCells[i];
                const text = cell.textContent.trim();
                
                // Проверяем, не является ли ячейка названием дня
                let foundDay = null;
                for (const day of DAYS_RU) {
                    if (text.includes(day)) {
                        foundDay = day;
                        break;
                    }
                }
                
                if (foundDay) {
                    // Это колонка с дисциплиной (i)
                    dayInfo.push({
                        name: foundDay,
                        colSubject: i,
                        date: text
                    });
                    addLog(`📅 День "${foundDay}" в колонке ${i}`, 'success');
                }
            }
            
            // Если дни не найдены — используем стандартные
            if (dayInfo.length === 0) {
                addLog('⚠️ Дни не найдены, использую стандартные', 'warning');
                for (let i = 0; i < 6; i++) {
                    dayInfo.push({
                        name: DAYS_RU[i],
                        colSubject: 1 + i,
                        date: ''
                    });
                }
            }
            
            // Ограничиваем 6 днями
            while (dayInfo.length > 6) {
                dayInfo.pop();
            }
            
            const dayNames = dayInfo.map(d => d.name);
            addLog(`📅 Итоговые дни: ${dayNames.join(', ')}`, 'info');
            
            const schedule = {};
            dayNames.forEach(day => { schedule[day] = []; });
            
            // ============================================================
            // ПАРСИМ СТРОКИ С ПАРАМИ
            // ============================================================
            let pairCount = 0;
            
            for (let i = 2; i < rows.length; i++) {
                const row = rows[i];
                const cells = row.querySelectorAll('td, th');
                if (cells.length < 2) continue;
                
                // Номер пары — первая колонка
                let pairNum = cells[0].textContent.trim();
                if (!pairNum || pairNum === '') continue;
                
                // Проходим по каждому дню
                for (let d = 0; d < dayInfo.length; d++) {
                    const info = dayInfo[d];
                    
                    // Проверяем, что колонка существует
                    if (info.colSubject >= cells.length) continue;
                    
                    // Получаем данные из ячейки
                    const content = cells[info.colSubject].textContent.trim();
                    
                    // Если дисциплина пустая — пропускаем
                    if (!content || content === '' || content === '-') continue;
                    
                    const dayName = info.name;
                    
                    // Парсим ячейку (может быть несколько занятий)
                    const lessons = parseLessonCell(content, pairNum);
                    
                    for (const lesson of lessons) {
                        if (lesson) {
                            schedule[dayName].push(lesson);
                            pairCount++;
                            
                            // Лог для отладки
                            const teacherInfo = lesson.teacher ? ` (${lesson.teacher})` : '';
                            const roomInfo = lesson.room ? ` [${lesson.room}]` : '';
                            const typeInfo = lesson.type ? ` ${lesson.type}` : '';
                            const subgroupInfo = lesson.subgroup ? ` ${lesson.subgroup}подгр` : '';
                            addLog(`✅ Пара ${pairNum}: ${lesson.discipline}${teacherInfo}${roomInfo}${typeInfo}${subgroupInfo} (${dayName})`, 'success');
                        }
                    }
                }
            }
            
            addLog(`📊 Всего пар найдено: ${pairCount}`, 'info');
            
            if (pairCount === 0) {
                addLog('⚠️ Пар не найдено', 'warning');
                return null;
            }
            
            return schedule;
        }

        // ============================================================
        // 4. ОТОБРАЖЕНИЕ
        // ============================================================
        function renderSchedule(schedule) {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            const weekLabel = document.getElementById('weekLabel');
            
            if (!schedule || !Object.values(schedule).some(arr => arr.length > 0)) {
                container.innerHTML = `
                    <div class="schedule-empty">
                        <span class="empty-icon">📭</span>
                        <span>Расписание не найдено</span>
                    </div>
                `;
                statusBadge.textContent = '❌ Ошибка';
                statusBadge.className = 'status-badge error';
                return;
            }
            
            statusBadge.textContent = '✅ С сервера';
            statusBadge.className = 'status-badge success';
            addLog('✅ Отображение: данные с сервера через прокси', 'success');
            
            // Даты недели
            const today = new Date();
            const weekDates = [];
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(today);
            monday.setDate(diff);
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
            }
            
            const start = weekDates[0].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            const end = weekDates[6].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            weekLabel.textContent = `${start} — ${end}`;
            
            const todayIndex = today.getDay();
            const todayName = todayIndex === 0 ? 'Воскресенье' : DAYS_RU[todayIndex - 1];
            
            let html = '';
            let hasLessons = false;
            
            for (let i = 0; i < 6; i++) {
                const dayName = DAYS_RU[i];
                const lessons = schedule[dayName] || [];
                if (lessons.length === 0) continue;
                hasLessons = true;
                
                const isToday = dayName === todayName;
                const isWeekend = (i === 5);
                const dateStr = weekDates[i] ? weekDates[i].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) : '';
                
                html += `
                    <div class="schedule-day">
                        <div class="schedule-day-header">
                            <span class="day-name">${dayName}</span>
                            ${dateStr ? `<span class="day-date">${dateStr}</span>` : ''}
                            <span class="day-badge ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">${isToday ? 'СЕГОДНЯ' : isWeekend ? 'СУББОТА' : `${lessons.length} пар`}</span>
                        </div>
                `;
                
                // Сортируем пары по номеру
                lessons.sort((a, b) => parseInt(a.pair) - parseInt(b.pair));
                
                lessons.forEach(lesson => {
                    const typeClass = lesson.type === 'лекция' ? 'lecture' : 
                                    lesson.type === 'лабораторная' ? 'lab' : 
                                    lesson.type === 'практика' ? 'practice' : '';
                    const typeLabel = lesson.type ? lesson.type.charAt(0).toUpperCase() + lesson.type.slice(1) : '';
                    const subgroupLabel = lesson.subgroup ? `${lesson.subgroup} подгруппа` : '';
                    
                    html += `
                        <div class="schedule-lesson">
                            <span class="lesson-time">${lesson.pair}</span>
                            <div class="lesson-info">
                                <div class="lesson-name">
                                    ${escapeHtml(lesson.discipline)}
                                    ${subgroupLabel ? `<span class="lesson-subgroup">${subgroupLabel}</span>` : ''}
                                </div>
                                <div class="lesson-details">
                                    ${lesson.teacher ? `<span class="detail-item"><span class="icon">👨‍🏫</span> ${escapeHtml(lesson.teacher)}</span>` : ''}
                                    ${lesson.room ? `<span class="detail-item"><span class="icon">🏛️</span> ${escapeHtml(lesson.room)}</span>` : ''}
                                    ${typeLabel ? `<span class="detail-item"><span class="type-badge ${typeClass}">${typeLabel}</span></span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            if (!hasLessons) {
                container.innerHTML = `
                    <div class="schedule-empty">
                        <span class="empty-icon">📭</span>
                        <span>На этой неделе занятий нет</span>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 5. ЗАГРУЗКА
        // ============================================================
        async function loadSchedule() {
            const container = document.getElementById('scheduleContent');
            const statusBadge = document.getElementById('statusBadge');
            const weekLabel = document.getElementById('weekLabel');
            
            document.getElementById('debugLog').innerHTML = '';
            addLog('🚀 Начинаем загрузку расписания...', 'info');
            
            container.innerHTML = `
                <div class="schedule-loader">
                    <div class="spinner"></div>
                    <span>Загрузка расписания...</span>
                </div>
            `;
            weekLabel.textContent = 'Загрузка...';
            statusBadge.textContent = '⏳ Загрузка...';
            statusBadge.className = 'status-badge loading';
            
            try {
                const response = await fetch(PROXY_URL, {
                    signal: AbortSignal.timeout(15000)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const html = await response.text();
                addLog(`✅ Получен ответ (${html.length} символов)`, 'success');
                
                const schedule = parseSchedule(html);
                
                if (schedule && Object.values(schedule).some(arr => arr.length > 0)) {
                    renderSchedule(schedule);
                    addLog(`✅ Готово! Расписание загружено`, 'success');
                    return;
                } else {
                    addLog(`⚠️ Парсинг не дал результатов`, 'error');
                }
                
            } catch(e) {
                addLog(`❌ Ошибка загрузки: ${e.message}`, 'error');
            }
            
            container.innerHTML = `
                <div class="schedule-error">
                    <span class="error-icon">⚠️</span>
                    <span>Не удалось загрузить расписание</span>
                    <br>
                    <span style="font-size:11px;color:var(--muted);">Проверьте прокси-сервер</span>
                    <br>
                    <button class="retry-btn" onclick="loadSchedule()">🔄 Попробовать снова</button>
                </div>
            `;
            statusBadge.textContent = '❌ Ошибка';
            statusBadge.className = 'status-badge error';
            weekLabel.textContent = 'Ошибка загрузки';
            addLog(`❌ Не удалось загрузить расписание`, 'error');
        }

        // ============================================================
        // 6. ЗАПУСК
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadSchedule();
        });

        loadSchedule();
    </script>
</body>
</html>
